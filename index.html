// CONDITIONING
// ═════════════════════════════════════════════════════════════════════
function Conditioning() {
  const RED  = "#c41b1b";
  const BLUE = "#0a3060";
  const TEAL_C = "#0a6060";

  const METHODS = [
    { num:"01", name:"Short-Interval HIIT", tags:[["RSA Training","r"],["Time-Efficient","g"],["#1 Priority","r"]], body:"Short-interval HIIT is the single most basketball-specific conditioning method. Work intervals of 15–30 seconds at near-maximum effort, with 15–30 seconds of rest, directly train your Repeated Sprint Ability — the quality that determines your 4th quarter output. A 2024 NIH-indexed meta-analysis confirmed short-interval HIIT significantly improves VO₂max, RSA, change of direction speed, and linear sprint performance simultaneously. No other method does all four at once.", protocol:"8–12 rounds × 20s all-out / 10s rest (Tabata)\nOr: 6–10 rounds × 30s sprint / 30s walk\n2× per week · 6–10 min of work\nExercises: High knees, burpees, stair runs, shuttles" },
    { num:"02", name:"Long-Interval HIIT",  tags:[["Aerobic Base","b"],["VO₂max","b"],["2–4 Min Efforts","g"]], body:"Long-interval HIIT targets the aerobic energy system — the foundation that lets you recover between explosive plays. Without a strong aerobic base, your RSA collapses in the third quarter. Research defines long-interval HIIT as 2–4 minute efforts at high but submaximal intensity (85–90% max HR). One long-interval session per week paired with one short-interval session is the optimal combination for time-constrained athletes.", protocol:"3–5 rounds × 3 min at 85–90% max HR / 4 min rest\n1× per week alternating with short-interval\n~21–35 min total with rest" },
    { num:"03", name:"Game Play = Cardio",  tags:[["Game Play","g"],["Most Specific","g"],["Counts As Training","b"]], body:"Playing basketball is itself high-quality conditioning. A full game covers the aerobic and anaerobic demands of almost any conditioning drill. If you play 1–2 games per week, count those as conditioning sessions and do supplemental HIIT only on the other days. Don't add conditioning on top of game days — that's the fastest path to overtraining at 34 with broken sleep.", protocol:"Game = 1 full conditioning session\nPlay 1–2× per week + 1 HIIT = minimum effective dose\nHalf-court pickup < full court — intensity matters" },
  ];
  const TAG_COLS = { r:RED, b:BLUE, g:TEAL_C };

  const WEEK = [
    { day:"MON", title:"Short-Interval HIIT",    sub:"Tabata format · 20 min total",              col:RED,    active:true  },
    { day:"TUE", title:"Rest / Mobility Only",    sub:"15-min mobility routine",                   col:BOR,    active:false },
    { day:"WED", title:"Game / Full-Court Run",   sub:"Counts as full conditioning session",       col:TEAL_C, active:true  },
    { day:"THU", title:"Active Recovery",         sub:"Walk, light movement — no intensity",       col:BOR,    active:false },
    { day:"FRI", title:"Long-Interval HIIT",      sub:"3 rounds × 3 min / 4 min rest",             col:BLUE,   active:true  },
    { day:"SAT", title:"Game or Skills Work",     sub:"Ball handling + form shooting session",     col:AMB,    active:true  },
    { day:"SUN", title:"Full Rest",               sub:"Non-negotiable. This is where you adapt.",  col:BOR,    active:false },
  ];

  const WORKOUTS = [
    { id:"tabata", name:"Tabata HIIT", meta:"8 rounds · 20s on / 10s off · ~4 min", badge:"Short-Interval", badgeCol:RED, rounds:[
      { label:"High Knees",           phase:"Work",      duration:20, isRest:false, cue:"Drive knees above hip height. Arms pumping hard. This is max effort — if you can talk normally, go faster. This trains your anaerobic alactic system — the same energy system you use on a fast break." },
      { label:"Rest",                 phase:"Recover",   duration:10, isRest:true,  cue:"10 seconds. Catch your breath. Hands on knees is fine. Prepare for the next round — the goal is to maintain quality on every work interval." },
      { label:"Burpees",              phase:"Work",      duration:20, isRest:false, cue:"Full burpee — chest to floor, jump with hands overhead. Hits your whole body and mimics the up-down demands of basketball. Quality over speed, but move fast." },
      { label:"Rest",                 phase:"Recover",   duration:10, isRest:true,  cue:"10 seconds. Shake your hands out. Your heart rate should be spiking — that's the point. The recovery teaches your cardiovascular system to reset quickly." },
      { label:"Lateral Shuffles",     phase:"Work",      duration:20, isRest:false, cue:"Low defensive stance. Shuffle as fast as you can side to side — 3 steps each direction. Stay low. This directly trains your defensive lateral conditioning. Go max speed." },
      { label:"Rest",                 phase:"Recover",   duration:10, isRest:true,  cue:"10 seconds. You're halfway through. This is where most recreational players quit — which is exactly why you're here doing this." },
      { label:"Jump Squats",          phase:"Work",      duration:20, isRest:false, cue:"Explode up on every rep. Land soft. The goal isn't reps — it's power. Each jump should be your maximum effort. Vertical jump training and conditioning in one." },
      { label:"Rest",                 phase:"Recover",   duration:10, isRest:true,  cue:"10 seconds. Last work round coming. Your RSA is being trained right now — every time you feel like stopping and keep going, you're building 4th quarter legs." },
      { label:"Stair Sprints / Sprints", phase:"Work",  duration:20, isRest:false, cue:"If you have stairs: sprint up. If not: sprint in place at absolute maximum speed. This is your final round. Leave everything on this one." },
      { label:"Walk it off",          phase:"Cool Down", duration:60, isRest:true,  cue:"60 seconds of walking. Let your heart rate come down naturally. Don't sit immediately — keep moving lightly. 4 minutes of work that produces measurable fitness gains." },
    ]},
    { id:"long", name:"Long-Interval HIIT", meta:"3 rounds · 3 min work / 4 min rest", badge:"Aerobic Base", badgeCol:BLUE, rounds:[
      { label:"Round 1 — Work",      phase:"Aerobic Work", duration:180, isRest:false, cue:"Sustained high-intensity movement — jumping jacks, jogging in place, stair climbing. Target 85–90% of your max HR. You should be breathing hard but not completely gassed. Trains your aerobic base — the foundation that lets you recover between explosive plays." },
      { label:"Round 1 — Rest",      phase:"Recover",      duration:240, isRest:true,  cue:"4 full minutes of rest. Not optional — this is where the aerobic adaptation occurs. Walk slowly, breathe deeply. Research shows cutting rest short here significantly reduces the training effect." },
      { label:"Round 2 — Work",      phase:"Aerobic Work", duration:180, isRest:false, cue:"Same sustained effort as round 1. Maintain 85–90% intensity. Switch to a different movement to reduce local muscle fatigue. Your cardiovascular system is doing the work here — keep feeding it." },
      { label:"Round 2 — Rest",      phase:"Recover",      duration:240, isRest:true,  cue:"4 minutes. Your body is making adaptations right now — mitochondrial density increasing, cardiac stroke volume improving. These show up as better conditioning in your third game of the night." },
      { label:"Round 3 — Work",      phase:"Aerobic Work", duration:180, isRest:false, cue:"Final work round. Research shows the third round of long-interval HIIT produces the strongest cardiovascular stimulus. Push through any desire to ease up. You'll feel this round in games 3–4 weeks from now." },
      { label:"Cool Down Walk",       phase:"Cool Down",   duration:120, isRest:true,  cue:"2 minutes walking. Total elapsed time with rest: ~21 minutes. The most time-efficient aerobic conditioning possible for a basketball player. Done weekly, this measurably improves VO₂max within 4–6 weeks." },
    ]},
  ];

  const [inner, setInner]       = useState("science");
  const [openMethod, setOpenMethod] = useState(null);
  const [selWkt, setSelWkt]     = useState(null);
  const [rIdx, setRIdx]         = useState(0);
  const [timeLeft, setTimeLeft] = useState(0);
  const [running, setRunning]   = useState(false);
  const [done, setDone]         = useState(new Set());
  const [wktComplete, setWktComplete] = useState(false);
  const iRef = useRef(null);

  const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current=null; setRunning(false); };
  const selectWkt = (w) => { stopT(); setSelWkt(w); setRIdx(0); setTimeLeft(w.rounds[0].duration); setDone(new Set()); setWktComplete(false); };
  const resetWkt = () => { stopT(); setSelWkt(null); setRIdx(0); setDone(new Set()); setWktComplete(false); };
  const jumpTo = i => { stopT(); setRIdx(i); setTimeLeft(selWkt.rounds[i].duration); };

  useEffect(() => {
    if (!running || !selWkt) return;
    const r = selWkt.rounds[rIdx];
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current=null;
          setDone(d => { const nd=new Set(d); nd.add(rIdx); return nd; });
          setTimeout(() => {
            if (rIdx+1 < selWkt.rounds.length) { setRIdx(rIdx+1); setTimeLeft(selWkt.rounds[rIdx+1].duration); setRunning(true); }
            else { setWktComplete(true); setRunning(false); }
          }, 800);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, rIdx, selWkt]);

  const round = selWkt ? selWkt.rounds[rIdx] : null;
  const exPct = round ? (round.duration-timeLeft)/round.duration*100 : 0;
  const clockCol = round ? (round.isRest ? TEAL : (timeLeft<=5?"#ef4444":timeLeft<=10?AMB:TEXT)) : TEXT;

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>💪 Conditioning</h2>
        <div style={{ fontSize:11, color:MID }}>Research-backed · Age 34</div>
      </div>

      {/* Inner tabs */}
      <div style={{ display:"flex", gap:4, background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:4, marginBottom:16 }}>
        {[["science","Science"],["methods","Methods"],["weekly","Weekly Plan"],["workout","▶ Workout"]].map(([id,lbl]) => (
          <button key={id} onClick={()=>setInner(id)} style={{ flex:1, padding:"8px 4px", borderRadius:7, border:"none", background:inner===id?RED:"transparent", color:inner===id?"#fff":LOW, fontWeight:700, fontSize:10, textTransform:"uppercase", letterSpacing:"0.04em", cursor:"pointer" }}>{lbl}</button>
        ))}
      </div>

      {/* ── SCIENCE ── */}
      {inner==="science" && (
        <div>
          <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+RED, borderRadius:12, padding:"14px 16px", marginBottom:14 }}>
            <div style={{ fontSize:16, fontWeight:700, fontStyle:"italic", lineHeight:1.5, marginBottom:8, color:TEXT }}>"VO₂ max begins a linear decline around age 30. The good news: 50–70% of that decline comes from inactivity, not biology."</div>
            <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.1em" }}>— Cleveland Clinic / DexaFit Research Review, 2025</div>
          </div>
          <div style={{ fontSize:13, color:MID, lineHeight:1.7, marginBottom:12 }}>Your aerobic engine — VO₂ max — is declining at roughly <span style={{ color:TEXT, fontWeight:700 }}>5–10% per decade</span> starting now. Athletes who train consistently can cut that rate in half. The window you're in right now — mid-30s — is where the gap between trained and untrained bodies starts opening up fast.</div>
          <div style={{ display:"flex", gap:8, marginBottom:14 }}>
            {[["5–10%","VO₂ decline / decade untrained"],["~5%","Decline / decade if you keep training"],["-20%","VO₂ loss in just 12 weeks of no training"]].map(([n,l]) => (
              <div key={l} style={{ flex:1, background:CARD, border:"1px solid "+BOR, borderRadius:8, padding:"12px 8px", textAlign:"center" }}>
                <div style={{ fontSize:20, fontWeight:700, color:RED, fontFamily:"monospace", marginBottom:4 }}>{n}</div>
                <div style={{ fontSize:9, color:LOW, lineHeight:1.4 }}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize:13, color:MID, lineHeight:1.7, marginBottom:14 }}>Just 12 weeks of stopping training can undo years of fitness gains. For a dad with a busy schedule, the goal isn't peak fitness every week — it's <span style={{ color:TEXT, fontWeight:700 }}>consistency</span>. Two solid sessions beats one perfect week and then nothing.</div>

              {/* big clock */}
              <div style={{ textAlign:"center", paddingBottom:14, borderBottom:"1px solid "+BOR, marginBottom:14 }}>

              </div>
              {/* cue */}
              <div style={{ background:SURF, border:"1px solid "+BOR, borderLeft:"3px solid "+(round.isRest?TEAL:RED), borderRadius:8, padding:"11px 14px", marginBottom:14, fontSize:13, color:MID, lineHeight:1.55, fontStyle:"italic" }}>{round.cue}</div>
              {/* controls */}
              <div style={{ display:"flex", gap:8, marginBottom:14 }}>
                <Btn onClick={()=>{ stopT(); if(rIdx>0){jumpTo(rIdx-1);} }} v="sec" style={{ padding:"12px 16px" }} disabled={rIdx===0}>‹</Btn>
                <Btn onClick={()=>setRunning(r=>!r)} style={{ flex:1, padding:13, background:running?SURF:RED, color:running?TEXT:"#fff" }}>{running?"⏸ Pause":timeLeft===round.duration?"▶ Start":"▶ Resume"}</Btn>

              </div>
              {/* round list */}
              <FL>All Rounds</FL>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {selWkt.rounds.map((r,i) => (

                    <div style={{ width:18, fontSize:13, fontFamily:"monospace", fontWeight:700, color:i===rIdx?(r.isRest?TEAL:RED):LOW, flexShrink:0, textAlign:"center" }}>{done.has(i)?"✓":i+1}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:i===rIdx?TEXT:MID, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{r.label}</div>
                      <div style={{ fontSize:10, color:LOW, fontFamily:"monospace" }}>{r.phase} · {fmtT(r.duration)}</div>
                    </div>
                    <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(r.duration)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {selWkt && wktComplete && (
            <div style={{ textAlign:"center", padding:"32px 0" }}>
              <div style={{ fontSize:44, fontWeight:900, color:TEXT, marginBottom:6 }}>Session <span style={{ color:RED }}>Done</span></div>
              <div style={{ fontSize:13, color:MID, lineHeight:1.6, marginBottom:28 }}>Record how your body felt on a scale of 1–10. If it was above an 8 effort, rest tomorrow. If below 7, you went too easy. The sweet spot is 7–8 every session, every week.</div>
              <Btn onClick={resetWkt} style={{ width:"100%", padding:14 }}>↺ New Session</Btn>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Notifications Settings Panel ────────────────────────────────────
function NotifSettings({ onClose }) {
  const [perm, setPerm] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unavailable');
  const [habitReminder, setHabitReminder] = useS("notif_habit", false);
  const [eventReminders, setEventReminders] = useS("notif_events", true);

  const requestPerm = async () => {
    if (typeof window.requestNotifPermission === 'function') {
      const p = await window.requestNotifPermission();
      setPerm(p);
      if (p === 'granted' && habitReminder) {
        window.scheduleDailyHabitReminder && window.scheduleDailyHabitReminder(true);
      }
    }
  };

  const toggleHabit = (v) => {
    setHabitReminder(v);
    if (v && perm === 'granted') window.scheduleDailyHabitReminder && window.scheduleDailyHabitReminder(true);
  };

  const testNotif = () => {
    if (perm === 'granted' && window.scheduleNotification) {
      window.scheduleNotification('In The Lab 🧪', 'Notifications are working! Stay consistent.', 1000);
    }
  };

  const permColor = perm === 'granted' ? LIME : perm === 'denied' ? PINK : AMB;
  const permLabel = perm === 'granted' ? '✓ Granted' : perm === 'denied' ? '✗ Denied — enable in Settings' : perm === 'unavailable' ? 'Not supported on this device' : 'Not yet granted';

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', zIndex: 9999, display: 'flex', alignItems: 'flex-end' }}>
      <div style={{ background: CARD, borderTop: '1px solid ' + BORHI, borderRadius: '20px 20px 0 0', padding: '24px 24px 40px', width: '100%', maxHeight: '70vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <h2 style={{ fontSize: 18, fontWeight: 700 }}>🔔 Notifications</h2>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: MID, fontSize: 22, cursor: 'pointer' }}>✕</button>
        </div>

        {/* Permission status */}
        <div style={{ background: permColor + '18', border: '1px solid ' + permColor + '44', borderRadius: 10, padding: '12px 14px', marginBottom: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: permColor, marginBottom: 4 }}>Permission Status</div>
          <div style={{ fontSize: 13, color: TEXT }}>{permLabel}</div>
          {perm !== 'granted' && perm !== 'denied' && perm !== 'unavailable' && (
            <button onClick={requestPerm} style={{ marginTop: 10, background: LIME, color: '#fff', border: 'none', borderRadius: 8, padding: '8px 16px', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>
              Enable Notifications
            </button>
          )}
          {perm === 'denied' && (
            <div style={{ fontSize: 11, color: MID, marginTop: 8 }}>
              Go to iPhone Settings → Safari → Notifications → Allow for this site
            </div>
          )}
        </div>

        {/* Note about iOS */}
        <div style={{ background: AMB + '18', border: '1px solid ' + AMB + '33', borderRadius: 10, padding: '12px 14px', marginBottom: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: AMB, marginBottom: 4 }}>📱 iPhone Note</div>
          <div style={{ fontSize: 12, color: MID, lineHeight: 1.6 }}>
            For the best experience, add this app to your Home Screen first (Share → Add to Home Screen), then open it from there before enabling notifications.
          </div>
        </div>

        {/* Toggles */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 20 }}>
          {[
            { label: 'Daily Habit Reminder', desc: 'Reminds you at 9am to check your habits', val: habitReminder, set: toggleHabit },
            { label: 'Planned Event Alerts', desc: '15 min & 1 hour before scheduled events', val: eventReminders, set: setEventReminders },
          ].map(item => (
            <div key={item.label} style={{ background: SURF, border: '1px solid ' + BOR, borderRadius: 10, padding: '14px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 2 }}>{item.label}</div>
                <div style={{ fontSize: 11, color: MID }}>{item.desc}</div>
              </div>
              <div onClick={() => perm === 'granted' && item.set(!item.val)} style={{ width: 48, height: 28, borderRadius: 14, background: (item.val && perm === 'granted') ? LIME : BOR, position: 'relative', cursor: perm === 'granted' ? 'pointer' : 'not-allowed', transition: 'background .2s', flexShrink: 0, opacity: perm === 'granted' ? 1 : 0.5 }}>
                <div style={{ position: 'absolute', top: 3, left: (item.val && perm === 'granted') ? 23 : 3, width: 22, height: 22, borderRadius: '50%', background: '#fff', transition: 'left .2s', boxShadow: '0 1px 3px rgba(0,0,0,0.4)' }} />
              </div>
            </div>
          ))}
        </div>

        {perm === 'granted' && (
          <button onClick={testNotif} style={{ width: '100%', background: SURF, border: '1px solid ' + BOR, borderRadius: 10, padding: 12, color: MID, fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
            Send Test Notification
          </button>
        )}
      </div>
    </div>
  );
}

      <style>{[
        "@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');",
        "*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }",
        "html,body,#root { overflow:hidden; }",
        "::-webkit-scrollbar { width:3px; height:3px; }",
        "::-webkit-scrollbar-track { background:" + SURF + "; }",
        "::-webkit-scrollbar-thumb { background:" + LIME + "; border-radius:2px; }",
        "input::placeholder, textarea::placeholder { color:#5a4422; }",
        "option { background:#181200; color:#ffffff; }",
        ".tab-btn { -webkit-tap-highlight-color: transparent; }",
      ].join(" ")}</style>

      {/* ── Top header bar ── */}
      <div style={{ background: SURF, borderBottom: "1px solid " + BOR, display: "flex", alignItems: "center", padding: "0 16px", height: 52, flexShrink: 0, paddingTop: "var(--sat, 0px)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
          <Vial size={22} />
          <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 14, letterSpacing: "0.06em", background: "linear-gradient(90deg,#ff7a00,#ffcc00,#ff7a00)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>IN THE LAB</div>
        </div>
        <div style={{ fontSize: 12, color: MID, marginRight: 12 }}>{currentLabel}</div>
        <button onClick={() => setShowNotif(true)} className="tab-btn" style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", padding: "6px", color: MID }}>🔔</button>
      </div>

      {/* ── Content ── */}
      <div style={{ flex: 1, overflow: "hidden" }}>
        {tab === "home" ? <Home go={go} /> : <Panel />}
      </div>

      {/* ── Bottom tab bar ── */}
      <div style={{ background: SURF, borderTop: "1px solid " + BOR, display: "flex", alignItems: "stretch", flexShrink: 0, paddingBottom: "var(--sab, 0px)" }}>
        {PRIMARY.map(t => {
          const isMore = t.id === "_more";
          const active = isMore ? (showMore || moreActive) : tab === t.id;
          return (
            <button key={t.id} className="tab-btn" onClick={() => { if (isMore) { setShowMore(!showMore); } else { setTab(t.id); setShowMore(false); } }}
              style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "8px 0", gap: 3, background: "transparent", border: "none", cursor: "pointer", borderTop: "2px solid " + (active ? LIME : "transparent"), minHeight: 56 }}>
              <span style={{ fontSize: 22 }}>{t.icon}</span>
              <span style={{ fontSize: 10, color: active ? LIME : LOW, fontWeight: active ? 700 : 400, fontFamily: "inherit" }}>{t.label}</span>
            </button>
          );
        })}
      </div>

      {/* ── More drawer ── */}
      {showMore && (
        <div onClick={() => setShowMore(false)} style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.6)" }}>
          <div onClick={e => e.stopPropagation()} style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: CARD, borderTop: "1px solid " + BORHI, borderRadius: "20px 20px 0 0", padding: "20px 20px 40px", paddingBottom: "calc(20px + var(--sab, 0px))" }}>
            <div style={{ width: 36, height: 4, borderRadius: 2, background: BOR, margin: "0 auto 18px" }} />
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12 }}>
              {MORE_TABS.map(t => (
                <button key={t.id} className="tab-btn" onClick={() => go(t.id)} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6, padding: "14px 8px", background: tab === t.id ? LIME + "18" : SURF, border: "1px solid " + (tab === t.id ? LIME + "55" : BOR), borderRadius: 12, cursor: "pointer" }}>
                  <span style={{ fontSize: 24 }}>{t.icon}</span>
                  <span style={{ fontSize: 11, color: tab === t.id ? LIME : MID, fontWeight: tab === t.id ? 700 : 400, fontFamily: "inherit" }}>{t.label}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── Notifications panel ── */}
      {showNotif && <NotifSettings onClose={() => setShowNotif(false)} />}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
