// INJURY PREVENTION
// ═════════════════════════════════════════════════════════════════════
function InjuryPrevention() {
  const GRN  = "#22c55e";
  const ORG  = "#f97316";
  const RD   = "#ef4444";

  const BODY_PARTS = [
    { id:"lower-back", label:"Lower Back", risk:"High", riskCol:RD,   covered:"Nothing yet",                                    adds:"McGill Big 3 — the only evidence-based lower back protocol for athletes",  why:"Lower back pain is the #1 complaint in recreational players 30+. Every jump landing, defensive stance, and rebound contest loads the lumbar spine. Most players never train it directly until something goes wrong." },
    { id:"rotator",    label:"Rotator Cuff", risk:"High", riskCol:RD, covered:"Wall press isometric (shooting stability)",        adds:"External rotation, Y-T-W raises, scapular stability work",                  why:"The rotator cuff is 4 small muscles that stabilize every shooting motion. Impingement here is the most common upper-body injury in basketball — it starts as shoulder soreness after games and ends as reduced shooting range." },
    { id:"groin",      label:"Groin / Adductors", risk:"High", riskCol:RD, covered:"Lateral leg swings (game activation)",        adds:"Copenhagen plank, adductor squeeze, lateral lunge holds",                  why:"Groin strains are the most common in-game muscle pull in basketball. The adductors control every lateral cut and change of direction. They're almost never trained directly — which is why they tear." },
    { id:"ankle",      label:"Ankles", risk:"Med", riskCol:ORG,       covered:"Skater hops, isometric calf hold, mobility calf stretch", adds:"Single-leg balance progression, peroneal strengthening, proprioception drills", why:"Ankle sprains are the most common basketball injury overall. Recurrence rate after one sprain is 70%+ without dedicated stability work. Peroneal muscle strength is the key — it's what stops the ankle rolling." },
    { id:"knee",       label:"Knees", risk:"Med", riskCol:ORG,        covered:"Wall sit, isometric split squat, glute bridge",    adds:"Valgus collapse training, single-leg landing mechanics, VMO activation",   why:"Knee injuries in recreational basketball are almost always caused by valgus collapse on landing — the knee caving inward. This is a neuromuscular pattern, not a strength issue. It's 100% trainable." },
    { id:"back-hip",   label:"Hip Flexors", risk:"Med", riskCol:ORG,  covered:"Kneeling hip flexor stretch, 90/90, worlds greatest", adds:"Loaded hip flexor strengthening — most players only stretch, never strengthen", why:"Tight hip flexors get stretched in the mobility routine. But tight + weak hip flexors are a tear risk. Strengthening them through their full range is what actually prevents injury, not just stretching." },
    { id:"hamstring",  label:"Hamstrings", risk:"Low", riskCol:GRN,   covered:"Seated hamstring stretch, glute bridge",           adds:"Nordic curl progression — the single most researched hamstring injury prevention tool", why:"The Nordic curl has the strongest evidence base of any injury prevention exercise in sport. A 51% reduction in hamstring injuries in a 2019 Cochrane meta-analysis. Most people have never done one." },
    { id:"shoulder",   label:"Shoulders", risk:"Low", riskCol:GRN,    covered:"Wall press isometric",                             adds:"Full rotator cuff circuit with external rotation focus",                    why:"Already partially covered. Adding external rotation specifically targets the infraspinatus and teres minor — the muscles most commonly torn in overhead athletes." },
  ];

  const SESSIONS = [
    { id:"lower", name:"Lower Body + Back", icon:"🦵", duration:"~10 min", accent:CYN, exercises:[
      { name:"McGill Curl-Up",          targets:"Lumbar Spine · Deep Core",   duration:60, sets:"3 × 8 reps",       rpe:5, cue:"Lie on your back. One knee bent, one leg flat. Hands under your lower back to preserve the natural curve — DO NOT flatten it. Lift just your head and shoulders, not a full crunch. Hold 8 seconds per rep. This protects the lumbar discs while maximally activating the deep stabilizers. It's the only core exercise Stuart McGill — the world's leading spine researcher — recommends for athletes with lower back pain." },
      { name:"Side Plank",              targets:"Quadratus Lumborum · Obliques", duration:70, sets:"30s each side", rpe:6, cue:"Elbow under shoulder, feet stacked. Keep your hips square — don't let them rotate forward or backward. The QL (quadratus lumborum) is the most commonly injured lower back muscle in basketball. This is the single best exercise to build it. If too hard: drop your bottom knee to the floor." },
      { name:"Bird-Dog",                targets:"Multifidus · Glute Med · Core", duration:60, sets:"8 reps each side", rpe:5, cue:"On all fours. Extend opposite arm and leg simultaneously. Hold 8–10 seconds per rep. Move SLOW — the benefit comes from the stability demand, not the movement. Keep your spine completely neutral throughout. The multifidus is the deep spinal stabilizer that atrophies fastest after a back injury." },
      { name:"Copenhagen Plank",        targets:"Adductors · Groin",           duration:70, sets:"20s each side",   rpe:7, cue:"Lie on your side. Place your top foot on an elevated surface (chair, couch). Lift your bottom foot off the ground, supported only by your top leg's adductors. Hold. This single exercise reduces groin strain incidence by 41% in the Copenhagen Adductor study — the strongest evidence base of any groin prevention exercise." },
      { name:"Nordic Curl Progression", targets:"Hamstrings · Posterior Chain", duration:75, sets:"3 × 5 reps",     rpe:8, cue:"Anchor your feet (under a couch/door). Start kneeling tall. Lower your body forward toward the floor as SLOWLY as possible — this is the eccentric that builds hamstring strength. Catch yourself with your hands at the bottom. Push back up. Research shows 51% reduction in hamstring injuries with just 2–3 sessions per week. Go slow — the benefit is in resisting the fall, not the push." },
    ]},
    { id:"upper", name:"Upper Body + Rotator Cuff", icon:"💪", duration:"~8 min", accent:VIO, exercises:[
      { name:"External Rotation Hold",  targets:"Infraspinatus · Teres Minor · Rotator Cuff", duration:60, sets:"3 × 15s each arm", rpe:5, cue:"Elbow bent at 90°, pinned to your side. Rotate your forearm away from your body (externally). Hold a light weight or resistance — use a water bottle if needed. Don't let the elbow drift away from your ribs. The infraspinatus and teres minor are the two most commonly injured rotator cuff muscles. They're almost never trained directly." },
      { name:"Y-T-W Raises",            targets:"Lower Trap · Rhomboids · Posterior Shoulder", duration:60, sets:"2 × 10 each position", rpe:5, cue:"Lie face down or lean forward at 45°. Y = arms at 30° from your head. T = arms directly out to the side. W = elbows bent 90°, pull toward hips. Use minimal weight or just bodyweight. These three positions target the muscles that stabilize the shoulder blade — the foundation of a healthy rotator cuff and a consistent shooting motion." },
      { name:"Wall Slides",             targets:"Serratus Anterior · Scapular Stability",    duration:45, sets:"2 × 12 reps",    rpe:4, cue:"Stand with your back and arms against a wall — elbows and wrists both touching. Slide your arms up overhead and back down like a snow angel. Keep contact the entire time. Trains the serratus anterior — the often-missed muscle that keeps the shoulder blade flat against the ribcage. Weakness here causes shoulder impingement." },
      { name:"Single-Leg Balance Drill", targets:"Ankle Stabilisers · Peroneal Muscles",    duration:70, sets:"30s each foot · 2 rounds", rpe:5, cue:"Stand on one foot with a slight knee bend. Hold 30 seconds — eyes open first. Progress to: eyes closed, catching a ball, standing on a folded towel (simulates unstable surface). The peroneal muscles on the outside of the shin are what prevent ankle rolling. They only get trained through balance challenges, not strength exercises." },
      { name:"Valgus Control Landing",  targets:"VMO · Hip Abductors · Knee Alignment",    duration:75, sets:"3 × 8 each leg",  rpe:6, cue:"Stand on one leg. Hop forward or laterally and stick the landing for 3 full seconds. Your knee must track directly over your 2nd toe — NO caving inward. If it caves: strengthen your glute med (side-lying clam shells) first. This drill trains the neuromuscular pattern that prevents ACL tears. Knee valgus on landing is the mechanism behind 80% of non-contact ACL injuries." },
    ]},
  ];

  const RISK_CARDS = [
    { icon:"🦴", title:"The 34-Year-Old Risk Profile", col:RD, body:"Collagen synthesis slows by ~1% per year after 30. Your tendons and ligaments are stiffer, slower to adapt, and take 3× longer to recover than at 22. The injuries that sideline recreational players in their mid-30s are almost never traumatic — they're gradual overuse injuries that were preventable." },
    { icon:"🏀", title:"Why Basketball Is High Risk", col:ORG, body:"Basketball has one of the highest injury rates of any recreational sport. The combination of cutting, jumping, landing, and contact loads the ankle, knee, groin, and lower back simultaneously. Most recreational players warm up for 2 minutes and then go full speed — this is when most injuries happen." },
    { icon:"📊", title:"What the Research Shows", col:CYN, body:"A 2022 systematic review found that structured prevention programs reduce basketball injury rates by 38–52%. The key finding: 10 minutes of targeted prehab, 3× per week, produces the same reduction as 30 minutes done once a week. Consistency beats duration." },
    { icon:"😴", title:"Sleep Debt Multiplies Risk", col:AMB, body:"Sleeping under 6 hours increases injury risk by 1.7× — confirmed across multiple sports medicine studies. With broken sleep from kids, your reaction time, proprioception, and landing mechanics are all impaired before you step on the court. The injury prevention work here partially compensates for this." },
  ];

  const [inner, setInner]   = useState("map");
  const [selPart, setSelPart] = useState(null);
  const [selSess, setSelSess] = useState(null);
  const [idx, setIdx]         = useState(0);
  const [timeLeft, setTimeLeft] = useState(0);
  const [running, setRunning]   = useState(false);
  const [done, setDone]         = useState(new Set());
  const [complete, setComplete] = useState(false);
  const iRef = useRef(null);

  const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current=null; setRunning(false); };
  const startSession = (sess) => { stopT(); setSelSess(sess); setIdx(0); setTimeLeft(sess.exercises[0].duration); setDone(new Set()); setComplete(false); setInner("routine"); };
  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(selSess.exercises[i].duration); };
  const resetSess = () => { stopT(); setSelSess(null); setIdx(0); setDone(new Set()); setComplete(false); };

  useEffect(() => {
    if (!running || !selSess) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current=null;
          setDone(d => { const nd=new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx+1 < selSess.exercises.length) { setIdx(idx+1); setTimeLeft(selSess.exercises[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 800);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx, selSess]);

  const ex  = selSess ? selSess.exercises[idx] : null;
  const exPct = ex ? (ex.duration-timeLeft)/ex.duration*100 : 0;
  const acc = selSess ? selSess.accent : CYN;

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>🛡 Injury Prevention</h2>
        <div style={{ fontSize:11, color:MID }}>Age 34 protocol</div>
      </div>

      {/* Inner tabs */}
      <div style={{ display:"flex", gap:4, background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:4, marginBottom:16 }}>
        {[["map","Body Map"],["routine","Routine"],["education","Science"]].map(([id,lbl]) => (
          <button key={id} onClick={()=>setInner(id)} style={{ flex:1, padding:"8px 4px", borderRadius:7, border:"none", background:inner===id?RD:"transparent", color:inner===id?"#fff":LOW, fontWeight:700, fontSize:10, textTransform:"uppercase", letterSpacing:"0.04em", cursor:"pointer" }}>{lbl}</button>
        ))}
      </div>

      {/* ── BODY MAP ── */}
      {inner==="map" && (
        <div>
          <div style={{ fontSize:12, color:MID, lineHeight:1.6, marginBottom:14 }}>Tap any body part to see your risk level, what's already covered in the app, and what this section adds specifically.</div>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:16 }}>
            {[["High",RD],["Medium",ORG],["Low",GRN]].map(([l,c]) => (
              <div key={l} style={{ display:"flex", alignItems:"center", gap:5, fontSize:11, color:MID }}>
                <div style={{ width:8, height:8, borderRadius:"50%", background:c }} />{l} Risk
              </div>
            ))}
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:16 }}>
            {BODY_PARTS.map(p => (
              <div key={p.id}>
                <div onClick={()=>setSelPart(selPart===p.id?null:p.id)} style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 16px", background:selPart===p.id?p.riskCol+"18":CARD, border:"1px solid "+(selPart===p.id?p.riskCol+"66":BOR), borderRadius:selPart===p.id?"10px 10px 0 0":10, cursor:"pointer", transition:"all .2s" }}>
                  <div style={{ width:10, height:10, borderRadius:"50%", background:p.riskCol, flexShrink:0 }} />
                  <div style={{ flex:1, fontSize:14, fontWeight:600 }}>{p.label}</div>
                  <div style={{ fontSize:10, fontWeight:700, color:p.riskCol, textTransform:"uppercase", letterSpacing:"0.08em", marginRight:8 }}>{p.risk}</div>
                  <div style={{ fontSize:12, color:LOW, transition:"transform .25s", transform:selPart===p.id?"rotate(180deg)":"none" }}>▼</div>
                </div>
                {selPart===p.id && (
                  <div style={{ background:SURF, border:"1px solid "+p.riskCol+"44", borderTop:"none", borderRadius:"0 0 10px 10px", padding:"12px 16px 14px" }}>
                    <div style={{ fontSize:12, color:MID, lineHeight:1.6, marginBottom:10 }}>{p.why}</div>
                    <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                      <div style={{ background:GRN+"12", border:"1px solid "+GRN+"33", borderRadius:8, padding:"8px 12px" }}>
                        <div style={{ fontSize:9, color:GRN, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:3 }}>✓ Already in your app</div>
                        <div style={{ fontSize:12, color:MID }}>{p.covered}</div>
                      </div>
                      <div style={{ background:p.riskCol+"12", border:"1px solid "+p.riskCol+"33", borderRadius:8, padding:"8px 12px" }}>
                        <div style={{ fontSize:9, color:p.riskCol, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:3 }}>+ This section adds</div>
                        <div style={{ fontSize:12, color:MID }}>{p.adds}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── ROUTINE ── */}
      {inner==="routine" && (
        <div>
          {!selSess && (
            <div>
              <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+RD, borderRadius:12, padding:"12px 14px", marginBottom:14, fontSize:12, color:MID, lineHeight:1.6 }}>
                <span style={{ color:RD, fontWeight:700 }}>Frequency: </span>Alternate sessions — Lower Body Monday/Thursday, Upper Body Wednesday/Saturday. 10 minutes beats 0 minutes every time.
              </div>
              <FL>Choose Session</FL>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {SESSIONS.map(s => (
                  <div key={s.id} onClick={()=>startSession(s)} style={{ display:"flex", alignItems:"center", gap:16, padding:"16px 18px", background:CARD, border:"1px solid "+BOR, borderRadius:14, cursor:"pointer", position:"relative", overflow:"hidden" }}>
                    <div style={{ position:"absolute", left:0, top:0, bottom:0, width:3, background:s.accent }} />
                    <div style={{ fontSize:28, flexShrink:0 }}>{s.icon}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:15, fontWeight:700, marginBottom:3 }}>{s.name}</div>
                      <div style={{ fontSize:12, color:MID }}>{s.duration} · {s.exercises.length} exercises</div>
                    </div>
                    <div style={{ fontSize:18, color:LOW }}>›</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {selSess && !complete && ex && (
            <div>
              {/* back */}
              <button onClick={resetSess} style={{ background:"none", border:"none", color:LIME, fontWeight:700, fontSize:13, cursor:"pointer", padding:"0 0 12px", display:"flex", alignItems:"center", gap:6 }}>‹ Sessions</button>
              {/* progress */}
              <PBar pct={done.size/selSess.exercises.length*100} col={acc} h={3} />
              <div style={{ height:10 }} />
              {/* dots */}
              <div style={{ display:"flex", gap:5, marginBottom:14 }}>
                {selSess.exercises.map((_,i) => <div key={i} onClick={()=>jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background:done.has(i)?LIME:i===idx?acc:BOR, border:"1px solid "+(i===idx?acc:BOR), cursor:"pointer", boxShadow:i===idx?"0 0 6px "+acc+"88":"none", transition:"all .2s" }} />)}
              </div>
              {/* main card */}
              <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:14, overflow:"hidden", marginBottom:12 }}>
                <div style={{ height:3, background:BOR }}>
                  <div style={{ height:"100%", width:exPct+"%", background:acc, transition:"width 1s linear" }} />
                </div>
                <div style={{ padding:18 }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
                    <span style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", padding:"3px 10px", borderRadius:99, border:"1px solid "+acc+"55", color:acc, background:acc+"18" }}>{ex.targets}</span>
                    <span style={{ fontSize:11, color:LOW }}>Exercise {idx+1}/{selSess.exercises.length}</span>
                  </div>
                  <div style={{ fontSize:22, fontWeight:800, marginBottom:6 }}>{ex.name}</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:14 }}>
                    <span style={{ fontSize:10, padding:"3px 9px", borderRadius:99, border:"1px solid "+BOR, color:LOW }}>{ex.sets}</span>
                    {/* RPE */}
                    <div style={{ display:"flex", gap:3, alignItems:"center", padding:"3px 9px", background:SURF, borderRadius:99, border:"1px solid "+BOR }}>
                      <span style={{ fontSize:10, color:LOW, marginRight:3 }}>RPE</span>
                      {Array.from({length:10},(_,i) => <div key={i} style={{ width:7, height:7, borderRadius:"50%", background:i<ex.rpe?(i>=7?RD:acc):BOR }} />)}
                    </div>
                  </div>
                  <div style={{ display:"flex", alignItems:"flex-end", gap:14, marginBottom:12 }}>
                    <div style={{ fontSize:60, fontWeight:900, fontFamily:"monospace", color:timeLeft<=5?RD:timeLeft<=12?ORG:TEXT, lineHeight:1, minWidth:105, transition:"color .3s" }}>{fmtT(timeLeft)}</div>
                    <div style={{ flex:1, paddingBottom:4 }}>
                      <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"7px 12px" }}>
                        <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Sets / Format</div>
                        <div style={{ fontSize:14, fontWeight:700 }}>{ex.sets}</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ height:3, background:BOR, borderRadius:99, overflow:"hidden", marginBottom:12 }}>
                    <div style={{ height:"100%", width:exPct+"%", background:acc, borderRadius:99, transition:"width 1s linear" }} />
                  </div>
                  <div style={{ background:SURF, borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+acc }}>
                    <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>How to do it</div>
                    <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{ex.cue}</div>
                  </div>
                </div>
              </div>
              {/* next */}
              {idx < selSess.exercises.length-1 && (
                <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
                  <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{selSess.exercises[idx+1].name}</div>
                  <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(selSess.exercises[idx+1].duration)}</div>
                </div>
              )}
              {/* controls */}
              <div style={{ display:"flex", gap:8, marginBottom:16 }}>
                <Btn onClick={()=>jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
                <Btn onClick={()=>setRunning(r=>!r)} style={{ flex:1, padding:12, background:running?SURF:acc, color:running?TEXT:idx===0&&!running?"#fff":"#fff" }}>{running?"⏸ Pause":timeLeft===ex.duration?"▶ Start":"▶ Resume"}</Btn>
                <Btn onClick={()=>{ setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<selSess.exercises.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
              </div>
              {/* list */}
              <FL>All Exercises</FL>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {selSess.exercises.map((e,i) => (
                  <div key={i} onClick={()=>jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:i===idx?acc+"18":CARD, border:"1px solid "+(i===idx?acc+"66":BOR), borderRadius:10, cursor:"pointer", opacity:done.has(i)?0.4:1, transition:"all .15s" }}>
                    <div style={{ width:22, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color:i===idx?acc:LOW, flexShrink:0 }}>{done.has(i)?"✓":i+1}</div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:600, color:i===idx?TEXT:MID, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{e.name}</div>
                      <div style={{ fontSize:11, color:LOW }}>{e.targets} · RPE {e.rpe}/10</div>
                    </div>
                    <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{done.has(i)?"✓":fmtT(e.duration)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {selSess && complete && (
            <div style={{ textAlign:"center", padding:"32px 0" }}>
              <div style={{ fontSize:52, marginBottom:12 }}>🛡</div>
              <div style={{ fontSize:26, fontWeight:700, color:GRN, marginBottom:8 }}>Session Done</div>
              <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:28 }}>Connective tissue adapts slowly — 6–8 weeks of consistent sessions is when you'll feel the difference. The injuries you prevent are invisible. Keep going.</div>
              <Btn onClick={resetSess} style={{ width:"100%", padding:14 }}>↺ Choose Session</Btn>
            </div>
          )}
        </div>
      )}

      {/* ── SCIENCE ── */}
      {inner==="education" && (
        <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
          {RISK_CARDS.map((c,i) => (
            <div key={i} style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+c.col, borderRadius:12, padding:"14px 16px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                <span style={{ fontSize:20 }}>{c.icon}</span>
                <div style={{ fontSize:14, fontWeight:700, color:TEXT }}>{c.title}</div>
              </div>
              <div style={{ fontSize:13, color:MID, lineHeight:1.65 }}>{c.body}</div>
            </div>
          ))}
          <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+GRN, borderRadius:12, padding:"14px 16px" }}>
            <div style={{ fontSize:14, fontWeight:700, color:TEXT, marginBottom:10 }}>The Minimum Effective Dose</div>
            {[["3×/week","10 min sessions — all that's needed for measurable injury reduction"],["6–8 weeks","Time before connective tissue fully adapts — stick with it"],["38–52%","Injury rate reduction from structured prehab programs (2022 systematic review)"],["1.7×","Increased injury risk from sleeping under 6 hours — biggest modifiable risk factor"]].map(([stat,desc]) => (
              <div key={stat} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"8px 0", borderBottom:"1px solid "+BOR }}>
                <div style={{ fontSize:16, fontWeight:700, color:GRN, fontFamily:"monospace", minWidth:64, flexShrink:0 }}>{stat}</div>
                <div style={{ fontSize:12, color:MID, lineHeight:1.5 }}>{desc}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// MIND GAME
// ═════════════════════════════════════════════════════════════════════
function MindGame() {
  const GOLD2 = "#c8a84a";

  const WORD_OPTIONS = ["Next","Reset","Clear","Breathe","Lock In","Move On","Focus","Present","Flush"];

  const SCENARIOS = [
    { icon:"🎯", name:"The Elbow Pull-Up", desc:"Feel the catch, plant, and fire your mid-range", steps:[
      { title:"Ground yourself",  dur:30, text:"Close your eyes. Feel your feet on the floor. Three slow breaths — in through the nose, out through the mouth. Let your shoulders drop. You're calm. You're in control." },
      { title:"See the court",    dur:45, text:"See the court in front of you. The hardwood. The paint. The lines. Feel the ball in your hands — its texture, its weight. You're at the elbow, defender behind you. You've been here a thousand times." },
      { title:"The catch",        dur:45, text:"The pass comes. Your feet hit the floor as the ball arrives — right foot slightly forward. You're already set. Elbow under the ball. Eyes find the rim. You feel no rush. Time slows." },
      { title:"The shot",         dur:45, text:"You go up. The release is clean — wrist snaps down, fingers point at the basket. The ball has perfect backspin. It's going in before it leaves your hand. You know this shot. You've made this shot." },
      { title:"The make",         dur:30, text:"It drops through. Clean. You don't celebrate — you get back on defense. This is who you are: composed, consistent, ready for the next play. Say your reset word once, exhale, and open your eyes." },
    ]},
    { icon:"🛡️", name:"Defensive Stop", desc:"See yourself locked in, taking the charge", steps:[
      { title:"Settle in",        dur:30, text:"Breathe deeply. Three counts in, four counts out. You're calm, focused. This is where you love to be — defending." },
      { title:"See your man",     dur:45, text:"You see your player at the top of the key. You're in a low stance — heels down, weight centered. You can feel the readiness in your legs. Your hands are up and active. You're locked in." },
      { title:"The drive",        dur:45, text:"He attacks. Your feet move before your mind does — reactive, explosive. You stay in front. You force him baseline. You feel no panic, only presence. Your feet are quick. Your stance is solid." },
      { title:"The contest",      dur:45, text:"He pulls up. You close out — hand up, body under control. Not fouling. Just contesting. The shot goes up. It's a difficult look. You boxed out before it even left his hand." },
      { title:"The rebound",      dur:30, text:"It bounces off the rim. You grab it. Your team erupts. You feel nothing but focus — you find the outlet and push. This is who you are on defense. Say your reset word, exhale, open your eyes." },
    ]},
    { icon:"⚡", name:"Fourth Quarter Mindset", desc:"Train your brain to be sharper when it counts", steps:[
      { title:"Find your center", dur:30, text:"Breathe slowly. In for four counts, out for six. Your body may be tired in the fourth — but your mind is sharp. This is where you're built different." },
      { title:"See the scoreboard",dur:40, text:"It's the fourth quarter. Your team is down a few. Your legs are heavy but you've trained for this — the conditioning, the isometrics, the plyos. Your body has done this work. Trust it." },
      { title:"Your next possession",dur:50,text:"You get the ball on the wing. The defense sags. You attack the elbow — one dribble, pull-up. You've drilled this a hundred times before games. Your footwork is automatic. You don't think. You just play." },
      { title:"Pressure",          dur:45, text:"They foul. Two free throws. You stand at the line. You breathe. You say your word. You bounce the ball three times — the same routine every single time. The crowd fades. The only thing that exists is the rim. You shoot with the same motion you drilled at home." },
      { title:"The outcome",       dur:30, text:"You've already won the mental game before the game started. Results come from process. You committed to the work. Whatever happens tonight — you played the right way. Say your word. Exhale. Open your eyes and go compete." },
    ]},
    { icon:"🔥", name:"Bad Start Reset", desc:"Flush the first quarter and start over mentally", steps:[
      { title:"Acknowledge it",    dur:30, text:"Close your eyes. The first quarter was rough. That's real and that's okay. You're not erasing it — you're acknowledging it and choosing to leave it there. Every great player has bad halves." },
      { title:"The breath",        dur:40, text:"Say your trigger word out loud. Then exhale fully — every bit of air out. Feel the tension leave your chest with it. The last play no longer exists. Only the next one does. Inhale slowly. Your body resets." },
      { title:"Your identity",     dur:45, text:"Remember who you are — you've been through harder things than a bad quarter. You have four kids depending on you, a job, and you still show up to put in the work. You are not a bad quarter. You are the process." },
      { title:"The adjustment",    dur:40, text:"What's one thing you can control right now? Your effort. Your attention on defense. Your ball movement. You don't need to score 20 to have a good second half. Pick one thing and commit to it completely." },
      { title:"Come back out",     dur:30, text:"You open your eyes. You're not the same player who walked into halftime. You're already past it. The slate is clean. Breathe in, say your word, and walk back on that court with your chin up. Time to go to work." },
    ]},
  ];

  const PREGAME_STEPS = [
    { name:"Intention",           time:"2 min · in the car",      affirmation:"I control my effort, my attention, and my attitude. Nothing else.",       text:"Before you arrive, ask yourself: what is one thing I want to do well tonight — not a result, a behavior. Defend my man for the whole shot clock. Make the extra pass every time. Attack the right elbow pull-up. One thing. Say it out loud." },
    { name:"Trigger Word Warm-Up",time:"1 min · anywhere",        affirmation:"My reset is automatic. I have practiced this.",                            text:"Do 5 mental reset reps right now. Say your word, exhale sharply. Repeat 5 times. You're priming the circuit before you need it. The first time it fires in a game should never actually be the first time." },
    { name:"Body Scan",           time:"2 min · quiet space",     affirmation:"My body is ready. I trust my preparation.",                                text:"Close your eyes. Start at your feet and scan upward — are your calves tight? Your hips? Your shoulders? Breathe into each tight area and release. You want to play loose, not tense." },
    { name:"Visualization",       time:"3–5 min · locker room",   affirmation:"I have shot this shot a thousand times. I know this feeling.",             text:"Pick one scenario from the Visualize tab. Close your eyes and run it — feel the ball, see the rim, feel your footwork. Research shows this activates the same neural pathways as physical practice." },
    { name:"Lock In",             time:"30 sec · tip-off",        affirmation:"I am ready. I have done the work. Let's go.",                              text:"Just before the opening tip, say your trigger word one final time. Take one sharp exhale. Then play. You've done everything you can to prepare. Now stop thinking and just compete." },
  ];

  const todayKey = () => new Date().toISOString().split("T")[0];
  const fmtDate  = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  const fmtT     = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

  // Persisted state
  const [triggerWord, setTriggerWord] = useS("mindgame_word","");
  const [resetMap,    setResetMap]    = useS("mindgame_resets",{});
  const [sessions,    setSessions]    = useS("mindgame_sessions",[]);
  const [bestStreak,  setBestStreak]  = useS("mindgame_best",0);
  const [totalResets, setTotalResets] = useS("mindgame_total",0);
  const [pgDoneMap,   setPgDoneMap]   = useS("mindgame_pgdone",{});

  // UI state
  const [inner,       setInner]       = useState("reset");
  const [customWord,  setCustomWord]  = useState("");
  const [flashWord,   setFlashWord]   = useState(false);

  // Breath circle
  const [breathPhase, setBreathPhase] = useState("idle"); // idle | inhale | exhale
  const [breathCount, setBreathCount] = useState(0);
  const [breathProg,  setBreathProg]  = useState(0); // 0–502 dashoffset
  const [drillMode,   setDrillMode]   = useState(false);
  const [drillReps,   setDrillReps]   = useState(0);
  const breathRef = useRef(null);

  // Visualization
  const [selScenario, setSelScenario] = useState(null);
  const [visStep,     setVisStep]     = useState(0);
  const [visTimeLeft, setVisTimeLeft] = useState(0);
  const [visRunning,  setVisRunning]  = useState(false);
  const visRef = useRef(null);

  // Pre-game
  const [openPP, setOpenPP] = useState(null);
  const pgDoneToday = pgDoneMap[todayKey()] || [];

  // Streak
  const calcStreak = () => {
    let s = 0; const d = new Date();
    for (let i=0;i<365;i++) {
      const k = d.toISOString().split("T")[0];
      if (resetMap[k]) { s++; d.setDate(d.getDate()-1); }
      else if (i===0) { d.setDate(d.getDate()-1); }
      else break;
    }
    return s;
  };
  const streak = calcStreak();

  // ── Trigger reset ──
  const triggerReset = () => {
    if (!triggerWord) return;
    setFlashWord(true);
    setTimeout(() => setFlashWord(false), 1500);
    setBreathPhase("inhale");
    setBreathProg(502);
    clearInterval(breathRef.current);
    let prog = 502;
    breathRef.current = setInterval(() => {
      prog -= 502/40;
      setBreathProg(Math.max(0, prog));
      if (prog <= 0) {
        clearInterval(breathRef.current);
        setBreathPhase("exhale");
        setTimeout(() => setBreathPhase("idle"), 800);
      }
    }, 100);
    setBreathCount(p => p+1);
    const today = todayKey();
    setResetMap(p => ({ ...p, [today]: (p[today]||0)+1 }));
    setTotalResets(p => p+1);
    if (drillMode) {
      const next = drillReps+1;
      setDrillReps(next);
      if (next >= 5) {
        setSessions(p => [{ date:today, word:triggerWord, count:5 }, ...p].slice(0,50));
        setDrillMode(false); setDrillReps(0);
      }
    }
    const s = calcStreak();
    if (s > bestStreak) setBestStreak(s);
  };

  // ── Vis timer ──
  useEffect(() => {
    if (!visRunning || !selScenario) return;
    const total = selScenario.steps[visStep].dur;
    visRef.current = setInterval(() => {
      setVisTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(visRef.current);
          setVisRunning(false);
          setTimeout(() => {
            if (visStep < selScenario.steps.length-1) {
              setVisStep(s => s+1);
              setVisTimeLeft(selScenario.steps[visStep+1].dur);
              setVisRunning(true);
            }
          }, 800);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
    return () => clearInterval(visRef.current);
  }, [visRunning, visStep, selScenario]);

  const startScenario = s => { setSelScenario(s); setVisStep(0); setVisTimeLeft(s.steps[0].dur); setVisRunning(false); };
  const closeScenario = () => { clearInterval(visRef.current); setSelScenario(null); setVisRunning(false); };
  const jumpVisStep = i => { clearInterval(visRef.current); setVisRunning(false); setVisStep(i); setVisTimeLeft(selScenario.steps[i].dur); };
  const visStep_cur  = selScenario ? selScenario.steps[visStep] : null;
  const visPct       = visStep_cur ? (visStep_cur.dur - visTimeLeft) / visStep_cur.dur * 100 : 0;

  // ── Pre-game ──
  const markPP = i => {
    const today = todayKey();
    const cur = pgDoneMap[today] || [];
    if (cur.includes(i)) return;
    const next = [...cur, i];
    setPgDoneMap(p => ({ ...p, [today]: next }));
    if (i < PREGAME_STEPS.length-1) setTimeout(() => setOpenPP(i+1), 300);
  };

  // ── History grid ──
  const histDays = Array.from({length:28},(_,i) => {
    const d = new Date(); d.setDate(d.getDate()-(27-i));
    const k = d.toISOString().split("T")[0];
    return { key:k, done: !!(resetMap[k]>0), isToday: i===27 };
  });

  const ringCirc = 502;
  const ringOffset = ringCirc - breathProg;

  return (
    <div style={{ height:"100%", display:"flex", flexDirection:"column" }}>
      {/* Word flash overlay */}
      {flashWord && triggerWord && (
        <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", zIndex:50, pointerEvents:"none" }}>
          <div style={{ fontSize:56, fontWeight:300, fontStyle:"italic", color:GOLD2, textShadow:"0 0 40px rgba(200,168,74,0.6)", animation:"wordFlash 1.5s ease forwards" }}>{triggerWord}</div>
        </div>
      )}

      <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
        {/* Header */}
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
          <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>🧠 Mind Game</h2>
          <div onClick={()=>setInner("streak")} style={{ display:"flex", alignItems:"center", gap:5, background:GOLD2+"18", border:"1px solid "+GOLD2+"44", borderRadius:99, padding:"4px 12px", cursor:"pointer" }}>
            <span style={{ fontSize:12 }}>🔥</span>
            <span style={{ fontSize:11, fontFamily:"monospace", color:GOLD2, fontWeight:700 }}>{streak} day streak</span>
          </div>
        </div>
        <div style={{ fontSize:11, color:LOW, fontStyle:"italic", marginBottom:14 }}>The 6 inches between your ears</div>

        {/* Inner tabs */}
        <div style={{ display:"flex", gap:0, background:SURF, border:"1px solid "+BOR, borderRadius:10, overflow:"hidden", marginBottom:16 }}>
          {[["reset","Reset"],["visualize","Visualize"],["pregame","Pre-Game"],["streak","Streak"]].map(([id,lbl],i,arr) => (
            <button key={id} onClick={()=>setInner(id)} style={{ flex:1, padding:"9px 4px", border:"none", borderRight:i<arr.length-1?"1px solid "+BOR:"none", background:inner===id?GOLD2:"transparent", color:inner===id?"#0a0800":LOW, fontWeight:700, fontSize:10, textTransform:"uppercase", letterSpacing:"0.05em", cursor:"pointer", transition:"all .15s" }}>{lbl}</button>
          ))}
        </div>

        {/* ── RESET TAB ── */}
        {inner==="reset" && (
          <div>
            <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:12 }}>The moment something goes wrong on court — missed shot, turnover, bad call — your word fires. Say it out loud with a sharp exhale. It interrupts the negative spiral before it takes hold.</div>
            <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+GOLD2, borderRadius:10, padding:"11px 14px", marginBottom:14, fontSize:12, color:MID, fontStyle:"italic", lineHeight:1.55 }}>
              "Elite players use a trigger word paired with a sharp exhalation the moment a whistle blows — erasing the last play so the next one gets full attention."
              <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", marginTop:5, fontStyle:"normal", letterSpacing:"0.08em" }}>— ScienceDirect, Integrative Psychological Interventions, 2026</div>
            </div>

            {/* Word picker */}
            <div style={{ background:CARD, border:"1px solid "+(triggerWord?GOLD2+"55":BOR), borderRadius:12, padding:"18px 16px", marginBottom:14, textAlign:"center" }}>
              <div style={{ fontSize:44, fontWeight:300, fontStyle:"italic", color:triggerWord?GOLD2:LOW, letterSpacing:2, marginBottom:4, minHeight:56, transition:"all .3s" }}>{triggerWord||"not set"}</div>
              <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:16 }}>your trigger word</div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6, marginBottom:12 }}>
                {WORD_OPTIONS.map(w => (
                  <div key={w} onClick={()=>setTriggerWord(w)} style={{ background:triggerWord===w?GOLD2+"18":SURF, border:"1px solid "+(triggerWord===w?GOLD2:BOR), borderRadius:6, padding:"10px 4px", fontSize:15, color:triggerWord===w?GOLD2:MID, cursor:"pointer", textAlign:"center", transition:"all .15s" }}>{w}</div>
                ))}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <input value={customWord} onChange={e=>setCustomWord(e.target.value)} placeholder="or type your own…" maxLength={20} style={{ flex:1, background:SURF, border:"1px solid "+BOR, borderRadius:6, padding:"10px 14px", fontFamily:"Georgia,serif", fontSize:16, fontStyle:"italic", color:TEXT, outline:"none" }} onKeyDown={e=>{ if(e.key==="Enter"&&customWord.trim()){setTriggerWord(customWord.trim());setCustomWord("");} }} />
                <Btn onClick={()=>{ if(customWord.trim()){setTriggerWord(customWord.trim());setCustomWord("");} }} style={{ padding:"10px 14px", flexShrink:0 }}>Set</Btn>
              </div>
            </div>

            {/* Breath circle */}
            <FL>Practice the Reset</FL>
            <div style={{ fontSize:13, color:MID, lineHeight:1.6, marginBottom:14 }}>Tap the circle to trigger a reset rep. Say your word out loud and breathe out sharply. The more you practice this, the more automatically it fires in a game.</div>
            <div style={{ textAlign:"center", padding:"8px 0 16px" }}>
              <div onClick={triggerReset} style={{ position:"relative", width:180, height:180, margin:"0 auto 16px", cursor:"pointer" }}>
                <svg width="180" height="180" viewBox="0 0 180 180" style={{ position:"absolute", inset:0, transform:"rotate(-90deg)" }}>
                  <circle cx="90" cy="90" r="80" fill="none" stroke={BOR} strokeWidth="2" />
                  <circle cx="90" cy="90" r="80" fill="none" stroke={GOLD2} strokeWidth="2" strokeLinecap="round"
                    strokeDasharray={ringCirc} strokeDashoffset={ringOffset}
                    style={{ transition:"stroke-dashoffset 0.1s linear", filter:"drop-shadow(0 0 6px rgba(200,168,74,0.5))" }} />
                </svg>
                <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <div style={{ width: breathPhase==="inhale"?140:80, height: breathPhase==="inhale"?140:80, borderRadius:"50%", background:`radial-gradient(ellipse at 40% 35%, rgba(200,168,74,${breathPhase==="inhale"?0.2:0.3}), rgba(200,168,74,0.06))`, border:`1px solid rgba(200,168,74,${breathPhase==="inhale"?0.2:0.3})`, display:"flex", alignItems:"center", justifyContent:"center", transition:"all 1s cubic-bezier(.4,0,.2,1)" }}>
                    {triggerWord && breathPhase!=="idle" && <span style={{ fontSize:12, fontStyle:"italic", color:GOLD2, textAlign:"center", padding:"0 6px", lineHeight:1.2 }}>{triggerWord}</span>}
                  </div>
                </div>
              </div>
              <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.2em", marginBottom:8, minHeight:18 }}>
                {breathPhase==="inhale"?"inhale…":breathPhase==="exhale"?"exhale + say your word":"tap to trigger a reset"}
              </div>
              {breathCount > 0 && <div style={{ fontSize:48, fontWeight:300, color:TEXT, letterSpacing:-2, lineHeight:1, marginBottom:8 }}>{breathCount}</div>}
              <div style={{ fontSize:13, fontStyle:"italic", color:LOW, marginBottom:16 }}>say your word · exhale · next play</div>
              <Btn onClick={triggerReset} style={{ width:"100%", padding:14, background:"transparent", border:"1px solid "+GOLD2, color:GOLD2, fontSize:18, fontStyle:"italic", fontWeight:300, marginBottom:8 }}>🔁 Trigger Reset</Btn>
              <Btn onClick={()=>{ setDrillMode(true); setDrillReps(0); }} v="sec" style={{ width:"100%", padding:11 }}>Run 5-rep drill {drillMode?`— rep ${drillReps+1}/5`:""}</Btn>
            </div>

            {/* Practice log */}
            {sessions.length > 0 && (
              <div style={{ marginTop:8 }}>
                <FL>Recent Practice</FL>
                <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                  {sessions.slice(0,5).map((s,i) => (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:CARD, border:"1px solid "+BOR, borderRadius:8 }}>
                      <span style={{ fontSize:16, flexShrink:0 }}>🔁</span>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:15, fontStyle:"italic", color:AMB }}>"{s.word}"</div>
                        <div style={{ fontSize:10, fontFamily:"monospace", color:LOW, letterSpacing:"0.06em" }}>{fmtDate(s.date)}</div>
                      </div>
                      <div style={{ fontSize:11, color:LOW, fontFamily:"monospace" }}>{s.count} reps</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── VISUALIZE TAB ── */}
        {inner==="visualize" && (
          <div>
            <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:12 }}><strong style={{ color:TEXT }}>Research shows 5 minutes of vivid mental rehearsal activates the same motor pathways as physical practice.</strong> Use these scenarios in the locker room, in the car, or at home before a game. Eyes closed, as detailed as possible.</div>

            {!selScenario && (
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                <FL>Choose a scenario</FL>
                {SCENARIOS.map((s,i) => (
                  <div key={i} onClick={()=>startScenario(s)} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:10, padding:"14px 16px", display:"flex", alignItems:"flex-start", gap:12, cursor:"pointer" }}>
                    <div style={{ fontSize:20, flexShrink:0, marginTop:1 }}>{s.icon}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:16, fontWeight:500, color:TEXT, marginBottom:3 }}>{s.name}</div>
                      <div style={{ fontSize:13, fontStyle:"italic", color:LOW, lineHeight:1.4 }}>{s.desc}</div>
                    </div>
                    <div style={{ fontSize:18, color:LOW, flexShrink:0, marginTop:2 }}>›</div>
                  </div>
                ))}
              </div>
            )}

            {selScenario && (
              <div>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                  <Btn onClick={closeScenario} v="sec" style={{ padding:"8px 12px", fontSize:13 }}>← Back</Btn>
                  <div style={{ flex:1, fontSize:17, fontStyle:"italic", color:AMB }}>{selScenario.icon} {selScenario.name}</div>
                </div>
                {/* Timer card */}
                <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:12, padding:"14px 16px", textAlign:"center", marginBottom:14 }}>
                  <div style={{ fontSize:9, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:8 }}>Step {visStep+1} of {selScenario.steps.length}</div>
                  <div style={{ fontSize:52, fontWeight:700, fontFamily:"monospace", letterSpacing:-2, color:visTimeLeft<=5?LOW:TEXT, lineHeight:1, marginBottom:10 }}>{fmtT(visTimeLeft)}</div>
                  <div style={{ height:2, background:BOR, borderRadius:99, overflow:"hidden" }}>
                    <div style={{ height:"100%", width:visPct+"%", background:GOLD2, transition:"width 1s linear" }} />
                  </div>
                </div>
                {/* Steps */}
                {selScenario.steps.map((st,i) => (
                  <div key={i} style={{ background:CARD, border:"1px solid "+(i===visStep?GOLD2+"66":BOR), borderRadius:10, overflow:"hidden", marginBottom:8 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:12, padding:"13px 16px", borderBottom:i===visStep?"1px solid "+BOR:"none" }}>
                      <div style={{ fontSize:20, fontWeight:700, fontFamily:"monospace", color:i===visStep?GOLD2:BOR, minWidth:24 }}>{i+1}</div>
                      <div style={{ flex:1, fontSize:15, fontWeight:500, color:i===visStep?TEXT:LOW }}>{st.title}</div>
                      <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", letterSpacing:"0.06em" }}>{st.dur}s</div>
                    </div>
                    {i===visStep && <div style={{ padding:"14px 16px", fontSize:14, fontStyle:"italic", color:MID, lineHeight:1.7 }}>{st.text}</div>}
                  </div>
                ))}
                <div style={{ display:"flex", gap:8, marginTop:12 }}>
                  <Btn onClick={()=>jumpVisStep(Math.max(0,visStep-1))} v="sec" style={{ padding:"12px 14px" }} disabled={visStep===0}>← Prev</Btn>
                  <Btn onClick={()=>setVisRunning(r=>!r)} style={{ flex:1, padding:12, background:visRunning?SURF:GOLD2, color:visRunning?TEXT:"#0a0800" }}>{visRunning?"⏸ Pause":visTimeLeft===selScenario.steps[visStep].dur?"▶ Start":"▶ Resume"}</Btn>
                  <Btn onClick={()=>jumpVisStep(Math.min(selScenario.steps.length-1,visStep+1))} v="sec" style={{ padding:"12px 14px" }} disabled={visStep===selScenario.steps.length-1}>Next →</Btn>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── PRE-GAME TAB ── */}
        {inner==="pregame" && (
          <div>
            <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:14 }}>Complete these 5 steps in the 20 minutes before tip-off. You don't need to be alone — some of these work in the car, in the locker room, anywhere. Tap each to expand.</div>
            <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:20 }}>
              {PREGAME_STEPS.map((s,i) => {
                const isDone = pgDoneToday.includes(i);
                const isOpen = openPP===i;
                return (
                  <div key={i} style={{ background:CARD, border:"1px solid "+(isDone?"#4a8a5a66":BOR), borderRadius:10, overflow:"hidden", cursor:"pointer", transition:"border-color .2s" }}>
                    <div onClick={()=>setOpenPP(isOpen?null:i)} style={{ display:"flex", alignItems:"center", gap:12, padding:"14px 16px" }}>
                      <div style={{ fontSize:22, fontWeight:700, fontFamily:"monospace", color:isDone?"#4a8a5a":BOR, minWidth:24 }}>{i+1}</div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:16, fontWeight:500, color:TEXT, marginBottom:2 }}>{s.name}</div>
                        <div style={{ fontSize:10, fontFamily:"monospace", color:LOW, letterSpacing:"0.06em" }}>{s.time}</div>
                      </div>
                      <div style={{ width:22, height:22, borderRadius:"50%", border:"1px solid "+(isDone?"#4a8a5a":BOR), display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, color:isDone?"#4a8a5a":"transparent", background:isDone?"rgba(74,138,90,0.1)":"transparent", flexShrink:0 }}>{isDone?"✓":""}</div>
                    </div>
                    {isOpen && (
                      <div style={{ borderTop:"1px solid "+BOR, padding:"12px 16px 16px" }}>
                        <div style={{ fontSize:14, fontStyle:"italic", color:MID, lineHeight:1.7, marginBottom:12 }}>{s.text}</div>
                        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"12px 14px", fontSize:16, fontStyle:"italic", color:AMB, lineHeight:1.5, textAlign:"center", marginBottom:12 }}>{s.affirmation}</div>
                        <button onClick={()=>markPP(i)} style={{ width:"100%", background:isDone?"rgba(74,138,90,0.1)":GOLD2+"18", border:"1px solid "+(isDone?"rgba(74,138,90,0.2)":"rgba(200,168,74,0.2)"), borderRadius:6, padding:10, fontFamily:"monospace", fontSize:10, letterSpacing:"0.15em", textTransform:"uppercase", color:isDone?"#4a8a5a":GOLD2, cursor:"pointer" }}>{isDone?"✓ Done":"✓ Mark Complete"}</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{ textAlign:"center", fontSize:14, fontStyle:"italic", color:LOW }}>When you walk on that court, you've already done the work.</div>
          </div>
        )}

        {/* ── STREAK TAB ── */}
        {inner==="streak" && (
          <div>
            <div style={{ display:"flex", gap:8, marginBottom:16 }}>
              {[["Day Streak",streak],["Total Resets",totalResets],["Best Streak",bestStreak]].map(([l,v]) => (
                <div key={l} style={{ flex:1, background:CARD, border:"1px solid "+BOR, borderRadius:8, padding:"12px 8px", textAlign:"center" }}>
                  <div style={{ fontSize:32, fontWeight:300, color:GOLD2, lineHeight:1, marginBottom:2 }}>{v}</div>
                  <div style={{ fontSize:9, fontFamily:"monospace", color:LOW, letterSpacing:"0.1em", textTransform:"uppercase" }}>{l}</div>
                </div>
              ))}
            </div>
            <div style={{ fontSize:9, fontFamily:"monospace", color:LOW, textTransform:"uppercase", letterSpacing:"0.06em", textAlign:"center", marginBottom:6 }}>Last 28 days</div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:16 }}>

              <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:8 }}>Every time you practice your trigger word, you're building a neural pathway. Research calls this <span style={{ color:AMB, fontStyle:"italic" }}>automatic self-regulation</span> — the ability to interrupt a negative emotional state and redirect attention without conscious effort. NBA players and elite athletes use this same mechanism.</div>

            </div>
            <Btn onClick={()=>{ if(window.confirm("Clear all history?")){ setResetMap({}); setSessions([]); setTotalResets(0); setBestStreak(0); setPgDoneMap({}); } }} v="sec" style={{ width:"100%", padding:11 }}>Clear history</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

  const today = td();

  const markDone = (id) => setTrainLog(p => ({ ...p, [today]: { ...(p[today] || {}), [id]: true } }));
  const ITEMS = [
    { id:"mobility",     icon:"🧘", label:"Mobility",        desc:"15-min recovery routine",       col:TEAL,      Component:Mobility },
    { id:"shooting",     icon:"🎯", label:"Form Shooting",   desc:"B.E.E.F. mechanics + drills",   col:AMB,       Component:FormShooting },
    { id:"isometric",    icon:"⚡", label:"Isometric",       desc:"5-min tendon strength",         col:CYN,       Component:Isometric },
    { id:"ballhandling", icon:"🏀", label:"Ball Handling",   desc:"10-min handle lab",             col:"#c8762a", Component:BallHandling },
    { id:"activation",   icon:"🔥", label:"Game Activation",   desc:"10-min pre-game protocol",      col:LIME,      Component:GameActivation },
    { id:"plyometric",   icon:"💥", label:"Plyometric",         desc:"10-min explosive circuit",      col:"#ffe620", Component:Plyometric },
    { id:"pregame",      icon:"🏀", label:"Pre-Game Activation",desc:"9-min shoot & handle warm-up",  col:"#e8a820", Component:PreGameActivation },
    { id:"conditioning", icon:"💪", label:"Conditioning",        desc:"HIIT protocols + weekly plan",  col:"#c41b1b", Component:Conditioning },
    { id:"injury",       icon:"🛡", label:"Injury Prevention",   desc:"Prehab for the 34-year-old",   col:"#22c55e", Component:InjuryPrevention },
    { id:"mindgame",     icon:"🧠", label:"Mind Game",            desc:"Trigger word, visualization & pre-game mental protocol", col:"#c8a84a", Component:MindGame },
  ];
  const doneCount = ITEMS.filter(i => todayLog[i.id]).length;
  if (sub) {

    return (

          <button onClick={()=>setSub(null)} style={{ background:"none", border:"none", color:LIME, fontWeight:700, fontSize:14, cursor:"pointer", padding:"4px 0", display:"flex", alignItems:"center", gap:6 }}>‹ Activities</button>
          <div style={{ fontSize:13, color:MID, fontWeight:600, flex:1 }}>{item.icon} {item.label}</div>
          <button onClick={()=>markDone(sub)} disabled={isDone} style={{ background: isDone ? "rgba(240,180,41,.15)" : LIME, color: isDone ? LIME : "#1a0805", border: "none", borderRadius: 7, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: isDone ? "default" : "pointer" }}>{isDone ? "✓ Done today" : "Mark Complete"}</button>
        </div>
        <div style={{ flex:1, overflow:"hidden" }}><C /></div>
      </div>
    );
  }
  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:18 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>🏃 Activities</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>{doneCount}/{ITEMS.length} today</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {ITEMS.map(item => {
          const isDone = !!todayLog[item.id];
          return (
          <div key={item.id} onClick={()=>setSub(item.id)} style={{ display:"flex", alignItems:"center", gap:16, padding:"16px 18px", background:CARD, border:"1px solid "+(isDone ? "rgba(240,180,41,.4)" : BOR), borderRadius:14, cursor:"pointer", position:"relative", overflow:"hidden", transition:"border-color .2s" }}>
            <div style={{ position:"absolute", left:0, top:0, bottom:0, width:3, background:item.col, borderRadius:"3px 0 0 3px" }} />
            <div style={{ fontSize:32, flexShrink:0 }}>{item.icon}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:16, fontWeight:700, marginBottom:3 }}>{item.label}</div>
              <div style={{ fontSize:12, color:MID }}>{item.desc}</div>
            </div>
            {isDone && <div style={{ fontSize:16, flexShrink:0 }}>✅</div>}
            <div style={{ fontSize:18, color:LOW, flexShrink:0 }}>›</div>
          </div>
        );})}
      </div>
    </div>
  );
}

const TABS = [
  { id: "home",     label: "Home",        vial: true },
  { id: "habits",   label: "Habits",      icon: "✅" },
  { id: "tasks",    label: "Tasks",       icon: "📋" },

];

// ─── Settings Panel (Notifications + Data Backup) ─────────────────────
function exportAllData() {
  const data = {};
  Object.keys(localStorage).filter(k => k.startsWith("itl_")).forEach(k => {
    try { data[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch (_) {}
  });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "average-joes-backup-" + td() + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importAllData(file, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k, v]) => write(k, v));
      cb(true);
    } catch (err) { cb(false); }
  };
  reader.readAsText(file);
}
function SettingsPanel({ onClose }) {
  const [perm, setPerm] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unavailable');
  const [habitReminder, setHabitReminder] = useS("notif_habit", false);
  const [eventReminders, setEventReminders] = useS("notif_events", true);
  const [importMsg, setImportMsg] = useState("");
  const fileRef = useRef(null);

  const requestPerm = async () => {
    if (typeof window.requestNotifPermission === 'function') {
      const p = await window.requestNotifPermission();
      setPerm(p);
      if (p === 'granted' && habitReminder) {
        window.scheduleDailyHabitReminder && window.scheduleDailyHabitReminder(true);
      }
    }
  };

  const toggleHabit = (v) => {
    setHabitReminder(v);
    if (v && perm === 'granted') window.scheduleDailyHabitReminder && window.scheduleDailyHabitReminder(true);
  };

  const testNotif = () => {
    if (perm === 'granted' && window.scheduleNotification) {
      window.scheduleNotification('Average Joe\'s 🏀', 'Notifications are working! Stay consistent.', 1000);
    }
  };

  const onImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    importAllData(file, (ok) => {
      setImportMsg(ok ? "✓ Restored! Reloading…" : "✗ That file couldn't be read.");
      if (ok) setTimeout(() => window.location.reload(), 1200);
    });
  };

  const permColor = perm === 'granted' ? LIME : perm === 'denied' ? PINK : AMB;
  const permLabel = perm === 'granted' ? '✓ Granted' : perm === 'denied' ? '✗ Denied — enable in Settings' : perm === 'unavailable' ? 'Not supported on this device' : 'Not yet granted';

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)', zIndex: 9999, display: 'flex', alignItems: 'flex-end' }}>
      <div style={{ background: CARD, borderTop: '1px solid ' + BORHI, borderRadius: '20px 20px 0 0', padding: '24px 24px 40px', width: '100%', maxHeight: '80vh', overflowY: 'auto' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <h2 style={{ fontSize: 18, fontWeight: 700 }}>⚙️ Settings</h2>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: MID, fontSize: 22, cursor: 'pointer' }}>✕</button>
        </div>

        <FL>Notifications</FL>
        {/* Permission status */}
        <div style={{ background: permColor + '18', border: '1px solid ' + permColor + '44', borderRadius: 10, padding: '12px 14px', marginBottom: 16 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: permColor, marginBottom: 4 }}>Permission Status</div>
          <div style={{ fontSize: 13, color: TEXT }}>{permLabel}</div>
          {perm !== 'granted' && perm !== 'denied' && perm !== 'unavailable' && (
            <button onClick={requestPerm} style={{ marginTop: 10, background: LIME, color: '#1a0805', border: 'none', borderRadius: 8, padding: '8px 16px', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>
              Enable Notifications
            </button>
          )}
          {perm === 'denied' && (
            <div style={{ fontSize: 11, color: MID, marginTop: 8 }}>
              Go to iPhone Settings → Safari → Notifications → Allow for this site
            </div>
          )}
        </div>

        {/* Toggles */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 20 }}>
          {[
            { label: 'Daily Habit Reminder', desc: 'Reminds you at 9am to check your habits', val: habitReminder, set: toggleHabit },
            { label: 'Planned Event Alerts', desc: '15 min & 1 hour before scheduled events', val: eventReminders, set: setEventReminders },
          ].map(item => (
            <div key={item.label} style={{ background: SURF, border: '1px solid ' + BOR, borderRadius: 10, padding: '14px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 2 }}>{item.label}</div>
                <div style={{ fontSize: 11, color: MID }}>{item.desc}</div>
              </div>
              <div onClick={() => perm === 'granted' && item.set(!item.val)} style={{ width: 48, height: 28, borderRadius: 14, background: (item.val && perm === 'granted') ? LIME : BOR, position: 'relative', cursor: perm === 'granted' ? 'pointer' : 'not-allowed', transition: 'background .2s', flexShrink: 0, opacity: perm === 'granted' ? 1 : 0.5 }}>
                <div style={{ position: 'absolute', top: 3, left: (item.val && perm === 'granted') ? 23 : 3, width: 22, height: 22, borderRadius: '50%', background: '#fff', transition: 'left .2s', boxShadow: '0 1px 3px rgba(0,0,0,0.4)' }} />
              </div>
            </div>
          ))}
        </div>

        {perm === 'granted' && (
          <button onClick={testNotif} style={{ width: '100%', background: SURF, border: '1px solid ' + BOR, borderRadius: 10, padding: 12, color: MID, fontSize: 13, fontWeight: 600, cursor: 'pointer', marginBottom: 24 }}>
            Send Test Notification
          </button>
        )}

        <FL>Data Backup</FL>
        <div style={{ background: SURF, border: '1px solid ' + BOR, borderRadius: 10, padding: '14px 16px', marginBottom: 12 }}>
          <div style={{ fontSize: 12, color: MID, lineHeight: 1.6, marginBottom: 12 }}>
            Everything — habits, games, scrimmages, training log — lives only on this device. Export a backup regularly so you never lose your progress.
          </div>
          <button onClick={exportAllData} style={{ width: '100%', background: LIME, color: '#1a0805', border: 'none', borderRadius: 8, padding: 12, fontWeight: 700, fontSize: 13, cursor: 'pointer', marginBottom: 10 }}>
            ⬇ Export Backup (.json)
          </button>
          <button onClick={() => fileRef.current && fileRef.current.click()} style={{ width: '100%', background: 'transparent', color: MID, border: '1px solid ' + BOR, borderRadius: 8, padding: 12, fontWeight: 600, fontSize: 13, cursor: 'pointer' }}>
            ⬆ Restore from Backup
          </button>
          <input ref={fileRef} type="file" accept="application/json" onChange={onImportFile} style={{ display: 'none' }} />
          {importMsg && <div style={{ fontSize: 12, color: importMsg[0] === '✓' ? LIME : PINK, marginTop: 10, textAlign: 'center' }}>{importMsg}</div>}
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState("home");
  const [showMore, setShowMore] = useState(false);
  const [showNotif, setShowNotif] = useState(false);
  const go = useCallback((id) => { setTab(id); setShowMore(false); }, []);
  const Panel = PANELS[tab];

  // Init notification scheduling on mount
  useEffect(() => {
    const habitOn = read("notif_habit", false);
    if (habitOn && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      window.scheduleDailyHabitReminder && window.scheduleDailyHabitReminder(true);
    }
    // Schedule any upcoming reminders set on tasks/habits
    const evs = read("evs", {});
    const eventOn = read("notif_events", true);
    if (eventOn && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      Object.entries(evs).forEach(([date, arr]) => {
        (arr || []).forEach(ev => {
          if (!ev.time) return;
          const eventDt = date + 'T' + ev.time;
          if (window.scheduleEventNotification) window.scheduleEventNotification(ev.title, eventDt, [60, 15]);
        });
      });
    }
  }, []);

  // Bottom nav: 5 primary tabs always visible, rest in "More"
  const PRIMARY = [
    { id: "home",    icon: "🏠", label: "Home" },
    { id: "habits",  icon: "✅", label: "Habits" },
    { id: "bball",   icon: "🏀", label: "Ball" },
    { id: "_more",   icon: "⋯",  label: "More" },
  ];

  const MORE_TABS = [
    { id: "tasks",      icon: "📋", label: "Tasks" },
    { id: "activities", icon: "🏃", label: "Activities" },
  ];

  const moreActive = MORE_TABS.some(t => t.id === tab);
  const currentLabel = (([...PRIMARY.filter(t => t.id !== "_more"), ...MORE_TABS].find(t => t.id === tab)) || {}).label || "Home";

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100vh", height: "100dvh", background: BG, color: TEXT, fontFamily: "'DM Sans','Segoe UI',sans-serif", overflow: "hidden" }}>
      <style>{[
        "@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Anton&display=swap');",
        "*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }",
        "html,body,#root { overflow:hidden; }",
        "::-webkit-scrollbar { width:3px; height:3px; }",
        "::-webkit-scrollbar-track { background:" + SURF + "; }",
        "::-webkit-scrollbar-thumb { background:" + LIME + "; border-radius:2px; }",
        "input::placeholder, textarea::placeholder { color:#5a4422; }",
        "option { background:#181200; color:#ffffff; }",
        ".tab-btn { -webkit-tap-highlight-color: transparent; }",
      ].join(" ")}</style>

      {/* ── Top header bar ── */}
      <div style={{ background: SURF, borderBottom: "1px solid " + BOR, display: "flex", alignItems: "center", padding: "0 16px", height: 52, flexShrink: 0, paddingTop: "var(--sat, 0px)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1 }}>
          <Vial size={22} />
          <div style={{ fontFamily: "'Anton',sans-serif", fontWeight: 400, fontSize: 17, letterSpacing: "0.04em", background: "linear-gradient(90deg,#ffcf40,#e2432b,#ffcf40)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>AVERAGE JOE'S</div>
        </div>
        <div style={{ fontSize: 12, color: MID, marginRight: 12 }}>{currentLabel}</div>
        <button onClick={() => setShowNotif(true)} className="tab-btn" style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", padding: "6px", color: MID }}>⚙️</button>
      </div>

      {/* ── Content ── */}
      <div style={{ flex: 1, overflow: "hidden" }}>
        {tab === "home" ? <Home go={go} /> : <Panel />}
      </div>

      {/* ── Bottom tab bar ── */}
      <div style={{ background: SURF, borderTop: "1px solid " + BOR, display: "flex", alignItems: "stretch", flexShrink: 0, paddingBottom: "var(--sab, 0px)" }}>
        {PRIMARY.map(t => {
          const isMore = t.id === "_more";
          const active = isMore ? (showMore || moreActive) : tab === t.id;
          return (
            <button key={t.id} className="tab-btn" onClick={() => { if (isMore) { setShowMore(!showMore); } else { setTab(t.id); setShowMore(false); } }}
              style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "8px 0", gap: 3, background: "transparent", border: "none", cursor: "pointer", borderTop: "2px solid " + (active ? LIME : "transparent"), minHeight: 56 }}>
              <span style={{ fontSize: 22 }}>{t.icon}</span>
              <span style={{ fontSize: 10, color: active ? LIME : LOW, fontWeight: active ? 700 : 400, fontFamily: "inherit" }}>{t.label}</span>
            </button>
          );
        })}
      </div>

      {/* ── More drawer ── */}
      {showMore && (
        <div onClick={() => setShowMore(false)} style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.6)" }}>
          <div onClick={e => e.stopPropagation()} style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: CARD, borderTop: "1px solid " + BORHI, borderRadius: "20px 20px 0 0", padding: "20px 20px 40px", paddingBottom: "calc(20px + var(--sab, 0px))" }}>

                  <span style={{ fontSize: 24 }}>{t.icon}</span>

                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── Notifications panel ── */}
      {showNotif && <SettingsPanel onClose={() => setShowNotif(false)} />}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
