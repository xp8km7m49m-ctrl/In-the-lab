      {/* ── MECHANICS ── */}
      {inner === "mechanics" && (
        <div>
          <div style={{ background:"#1a0e00", border:"1px solid "+AMB+"44", borderRadius:14, padding:18, marginBottom:14, position:"relative", overflow:"hidden" }}>
            <div style={{ position:"absolute", right:-10, bottom:-20, fontSize:72, fontWeight:900, color:"rgba(255,150,0,0.05)", fontFamily:"monospace", letterSpacing:-4, pointerEvents:"none" }}>B.E.E.F</div>
            <div style={{ fontSize:10, color:AMB, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:6 }}>The Framework</div>
            <div style={{ fontSize:18, fontWeight:700, color:TEXT, marginBottom:6 }}>B.E.E.F. — Every Shot</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>Used by coaches from youth leagues to the NBA, B.E.E.F. is a four-point checklist you run through on every shot. Without a hoop, it becomes your only feedback mechanism.</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {BEEF.map((b,i) => (
              <div key={i} onClick={() => setOpen(open===i ? null : i)} style={{ background:CARD, border:"1px solid "+(open===i ? AMB+"88" : BOR), borderRadius:12, overflow:"hidden", cursor:"pointer", transition:"border-color .2s" }}>
                <div style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 16px" }}>
                  <div style={{ fontSize:30, fontWeight:900, color:AMB, fontFamily:"monospace", lineHeight:1, minWidth:30 }}>{b.letter}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:15, fontWeight:700 }}>{b.word}</div>
                    <div style={{ fontSize:12, color:LOW, marginTop:2 }}>{b.tagline}</div>
                  </div>
                  <div style={{ color:LOW, fontSize:13, transition:"transform .25s", transform: open===i ? "rotate(180deg)" : "none" }}>▼</div>
                </div>
                {open===i && (
                  <div style={{ borderTop:"1px solid "+BOR, padding:"12px 16px 14px" }}>
                    <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:10 }}>{b.detail}</div>
                    <div style={{ background:AMB+"18", border:"1px solid "+AMB+"44", borderRadius:8, padding:"10px 12px", fontSize:12, color:AMB, lineHeight:1.5 }}><strong>At-Home Drill: </strong>{b.tip}</div>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ── DRILLS ── */}
      {inner === "drills" && (
        <div>
          {complete ? (
            <div style={{ textAlign:"center", padding:"32px 0" }}>
              <div style={{ fontSize:56, marginBottom:14 }}>🏀</div>
              <div style={{ fontSize:24, fontWeight:700, color:AMB, marginBottom:8 }}>Shot Work Done</div>
              <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:24 }}>Every rep is now stored in your muscle memory. Form reps without a net build cleaner mechanics than shooting at a basket.</div>
              <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:24 }}>
                {[["6","Drills"],["~200","Reps"],["🔁","Daily"]].map(([v,l]) => (
                  <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:10, padding:"12px 18px", textAlign:"center" }}>
                    <div style={{ fontSize:22, fontWeight:700, color:AMB, fontFamily:"monospace" }}>{v}</div>
                    <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:2 }}>{l}</div>
                  </div>
                ))}
              </div>
              <Btn onClick={resetDrills} style={{ width:"100%", padding:14 }}>↺ Run Again</Btn>
            </div>
          ) : (
            <div>
              <PBar pct={ovrPct} col={AMB} h={3} />
              <div style={{ height:12 }} />
              {/* dots */}
              <div style={{ display:"flex", gap:5, marginBottom:14 }}>
                {DRILLS.map((_,i) => <div key={i} onClick={() => jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background: done.has(i) ? LIME : i===idx ? AMB : BOR, border:"1px solid "+(i===idx ? AMB : BOR), cursor:"pointer", boxShadow: i===idx ? "0 0 6px "+AMB+"88" : "none", transition:"all .2s" }} />)}
              </div>
              {/* timer card */}
              <div style={{ background:"#1a0e00", borderRadius:14, padding:18, marginBottom:10, border:"1px solid "+AMB+"33", position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", top:-40, right:-40, width:160, height:160, borderRadius:"50%", border:"22px solid "+AMB+"12", pointerEvents:"none" }} />
                <div style={{ fontSize:10, color:AMB, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>{dr.phase}</div>
                <div style={{ fontSize:22, fontWeight:800, color:TEXT, marginBottom:12 }}>{dr.name}</div>
                <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:12 }}>
                  <div style={{ fontSize:56, fontWeight:900, fontFamily:"monospace", color: timeLeft<=5 ? "#ef4444" : timeLeft<=15 ? AMB : TEXT, lineHeight:1, minWidth:100 }}>{fmtT(timeLeft)}</div>
                  <div style={{ flex:1, background:"rgba(255,255,255,0.06)", borderRadius:8, padding:"8px 12px" }}>
                    <div style={{ fontSize:9, color:"rgba(255,255,255,0.35)", textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:3 }}>Focus</div>
                    <div style={{ fontSize:14, fontWeight:700, color:TEXT }}>{dr.focus}</div>
                    <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginTop:2 }}>Drill {idx+1} of {DRILLS.length}</div>
                  </div>
                </div>
                <PBar pct={drPct} col={AMB} h={2} />
                <div style={{ marginTop:12, background:"rgba(255,255,255,0.05)", borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+AMB }}>
                  <div style={{ fontSize:9, color:"rgba(255,255,255,0.3)", textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>// How to do it</div>
                  <div style={{ fontSize:12, color:"rgba(255,255,255,0.75)", lineHeight:1.55 }}>{dr.cue}</div>
                </div>
              </div>
              {/* controls */}
              <div style={{ display:"flex", gap:8, marginBottom:12 }}>
                <Btn onClick={() => jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
                <Btn onClick={() => setRunning(r=>!r)} style={{ flex:1, padding:12 }}>{running ? "⏸ Pause" : timeLeft===dr.duration ? "▶ Start" : "▶ Resume"}</Btn>
                <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<DRILLS.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
              </div>
              {/* next */}
              {idx < DRILLS.length-1 && (
                <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:14, display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
                  <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{DRILLS[idx+1].name}</div>
                  <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(DRILLS[idx+1].duration)}</div>
                </div>
              )}
              {/* list */}
              <FL>Full Session</FL>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {DRILLS.map((d,i) => (
                  <div key={i} onClick={() => jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background: i===idx ? AMB+"18" : CARD, border:"1px solid "+(i===idx ? AMB+"66" : BOR), borderRadius:10, cursor:"pointer", opacity: done.has(i) ? 0.4 : 1, transition:"all .15s" }}>
                    <div style={{ width:22, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color: i===idx ? AMB : LOW, flexShrink:0 }}>{done.has(i) ? "✓" : i+1}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:600, color: i===idx ? TEXT : MID }}>{d.name}</div>
                      <div style={{ fontSize:11, color:LOW }}>{d.phase} · {d.focus}</div>
                    </div>
                    <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(d.duration)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── MISTAKES ── */}
      {inner === "mistakes" && (
        <div>
          <div style={{ background:"#1a0e00", border:"1px solid "+AMB+"44", borderRadius:14, padding:18, marginBottom:14 }}>
            <div style={{ fontSize:10, color:AMB, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:6 }}>At-Home Diagnosis</div>
            <div style={{ fontSize:18, fontWeight:700, color:TEXT, marginBottom:6 }}>5 Most Common Form Killers</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>Without a coach watching you, these are the errors that sneak in and become permanent habits. Use a mirror or phone camera to self-diagnose.</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {MISTAKES.map((m,i) => (
              <div key={i} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"12px 14px", background:CARD, border:"1px solid "+BOR, borderRadius:12 }}>
                <div style={{ fontSize:18, flexShrink:0, marginTop:1 }}>{m.icon}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:"#f87171", marginBottom:3 }}>✗ {m.bad}</div>
                  <div style={{ fontSize:12, color:MID, lineHeight:1.5 }}><span style={{ color:LIME, fontWeight:700 }}>Fix: </span>{m.fix}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ISOMETRIC ROUTINE
// ═════════════════════════════════════════════════════════════════════
function Isometric() {
  const EXERCISES = [
    { name: "Wall Sit", icon: "🦵", targets: ["Quads", "Patellar Tendon", "Glutes"], highlight: "Patellar Tendon", hold: "45s hold", sets: "1 set", rpe: 7, duration: 45, science: "Tendon rehab", col: CYN, cue: "Back flat on wall, thighs parallel to floor — or as low as you can go without pain. Drive your feet into the floor like you're trying to push it away. Squeeze your quads as hard as possible. 45s at high effort promotes collagen synthesis in the patellar tendon, reducing jumper's knee pain for hours after." },
    { name: "Isometric Split Squat", icon: "⚡", targets: ["Single-Leg Quads", "Hip Stability", "Knee Tendon"], highlight: "Hip Stability", hold: "35s each leg", sets: "1 set per side", rpe: 7, duration: 70, science: "COD strength", col: "#06b6d4", cue: "Step into a lunge, lower until front thigh is near parallel. Hold still. No bouncing. Front knee tracks over your 2nd toe. The most important isometric for change-of-direction speed — research on pro basketball players showed significant COD improvement after a season of this drill alone." },
    { name: "Isometric Glute Bridge", icon: "🍑", targets: ["Glutes", "Hamstrings", "Lower Back"], highlight: "Glutes", hold: "45s hold", sets: "1 set", rpe: 6, duration: 45, science: "Hip strength", col: LIME, cue: "Lie on your back, feet flat, drive hips up to a straight line from shoulders to knees. Squeeze glutes as hard as possible at the top. Weak hip strength is the #2 cause of basketball knee pain — building this takes stress off the knee joint on every landing." },
    { name: "Plank Hold", icon: "🧱", targets: ["Core", "Shoulders", "Spinal Stability"], highlight: "Core", hold: "45s hold", sets: "1 set", rpe: 6, duration: 45, science: "Core stability", col: VIO, cue: "Elbows under shoulders, body in a straight line. Don't let your hips sag or pike. Pull your belly button toward your spine and squeeze your glutes. Core stability transfers directly to balance on defense — the reason elite defenders stay grounded when bumped." },
    { name: "Isometric Calf Raise Hold", icon: "🦶", targets: ["Calves", "Achilles Tendon", "Ankle Stability"], highlight: "Achilles Tendon", hold: "30s each foot", sets: "1 set per side", rpe: 7, duration: 60, science: "Achilles rehab", col: AMB, cue: "Rise up onto the ball of ONE foot. Hold at the top. Push your weight through your 1st and 2nd toe. The Achilles tendon is the most commonly ruptured tendon in recreational basketball players over 30. This isometric builds tendon stiffness and dramatically reduces rupture risk." },
    { name: "Wall Press Isometric", icon: "💪", targets: ["Shoulders", "Chest", "Serratus"], highlight: "Shoulders", hold: "40s hold", sets: "1 set", rpe: 6, duration: 40, science: "Shooting strength", col: PINK, cue: "Place both palms flat on a wall, arms extended. Press INTO the wall as hard as you can — the wall doesn't move, but your muscles fire maximally. Keep shoulder blades wide and stable. This builds the shoulder stability that improves late-game shooting accuracy when you're fatigued." },
  ];
  const TOTAL = EXERCISES.reduce((s,e)=>s+e.duration,0);
  const [idx, setIdx] = useState(0);
  const [timeLeft, setTimeLeft] = useState(EXERCISES[0].duration);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(new Set());
  const [complete, setComplete] = useState(false);
  const iRef = useRef(null);
  const ex = EXERCISES[idx];

  const fmtT = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current = null; setRunning(false); };
  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(EXERCISES[i].duration); };
  const resetAll = () => { stopT(); setIdx(0); setTimeLeft(EXERCISES[0].duration); setDone(new Set()); setComplete(false); };

  useEffect(() => {
    if (!running) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx + 1 < EXERCISES.length) { setIdx(idx+1); setTimeLeft(EXERCISES[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 900);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx]);

  const ovrPct = EXERCISES.slice(0,idx).reduce((s,e)=>s+e.duration,0) / TOTAL * 100;
  const exPct  = ex ? (ex.duration - timeLeft) / ex.duration * 100 : 0;

  if (complete) return (
    <div style={{ height:"100%", overflowY:"auto", padding:"32px 24px", textAlign:"center" }}>
      <div style={{ fontSize:56, marginBottom:14 }}>⚡</div>
      <div style={{ fontSize:26, fontWeight:700, color:CYN, marginBottom:8 }}>Tendons Loaded</div>
      <div style={{ fontSize:13, color:MID, lineHeight:1.7, marginBottom:28, maxWidth:320, margin:"0 auto 28px" }}>5 minutes of science-backed isometric work. Research shows measurable tendon strength gains and knee pain reduction in 4–6 weeks.</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center", marginBottom:32 }}>
        {[["6","Exercises"],["5:00","Duration"],["∞","Daily"]].map(([v,l]) => (
          <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:12, padding:"14px 20px", textAlign:"center" }}>
            <div style={{ fontSize:22, fontWeight:700, color:CYN, fontFamily:"monospace" }}>{v}</div>
            <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:3 }}>{l}</div>
          </div>
        ))}
      </div>
      <Btn onClick={resetAll} style={{ width:"100%", padding:14 }}>↺ Run Again</Btn>
    </div>

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>⚡ Isometric Routine</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>5 min · 6 exercises</div>
      </div>

      {/* Research callout */}
      <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+CYN, borderRadius:12, padding:"12px 16px", marginBottom:14, display:"flex", gap:10, alignItems:"flex-start" }}>
        <div style={{ fontSize:16, flexShrink:0 }}>🔬</div>
        <div style={{ fontSize:12, color:MID, lineHeight:1.55 }}><span style={{ color:CYN, fontWeight:600 }}>Science-backed: </span>Isometric holds at 70%+ effort promote collagen synthesis in tendons. 4–6 weeks of daily practice shows measurable strength gains and pain reduction in recreational athletes.</div>
      </div>

      <PBar pct={ovrPct} col={CYN} h={3} />
      <div style={{ height:12 }} />

      {/* dots */}
      <div style={{ display:"flex", gap:5, marginBottom:16 }}>
        {EXERCISES.map((_,i) => <div key={i} onClick={() => jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background: done.has(i) ? LIME : i===idx ? ex.col : BOR, border:"1px solid "+(i===idx ? ex.col : BOR), cursor:"pointer", boxShadow: i===idx ? "0 0 8px "+ex.col+"66" : "none", transition:"all .25s" }} />)}
      </div>

      {/* timer card */}
      <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:16, overflow:"hidden", marginBottom:12 }}>
        {/* top progress bar */}
        <div style={{ height:3, background:BOR, overflow:"hidden" }}>
          <div style={{ height:"100%", width:exPct+"%", background:"linear-gradient(90deg,"+ex.col+","+ex.col+"88)", transition:"width 1s linear" }} />
        </div>
        <div style={{ padding:18 }}>
          {/* target pills */}
          <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:12 }}>
            {ex.targets.map(t => (
              <span key={t} style={{ fontFamily:"monospace", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", padding:"3px 10px", borderRadius:99, border:"1px solid "+(t===ex.highlight ? ex.col+"55" : BOR), color: t===ex.highlight ? ex.col : LOW, background: t===ex.highlight ? ex.col+"18" : "transparent" }}>{t}</span>
            ))}
            <span style={{ fontFamily:"monospace", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", padding:"3px 10px", borderRadius:99, border:"1px solid "+CYN+"44", color:CYN, background:CYN+"12" }}>⚗ {ex.science}</span>
          </div>
          <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>Exercise {idx+1} of {EXERCISES.length}</div>
          <div style={{ fontSize:24, fontWeight:800, marginBottom:14 }}>{ex.icon} {ex.name}</div>

          {/* timer + hold */}
          <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:14 }}>
            <div style={{ fontSize:60, fontWeight:700, fontFamily:"monospace", color: timeLeft<=5 ? "#ef4444" : timeLeft<=12 ? AMB : TEXT, lineHeight:1, minWidth:110, transition:"color .3s" }}>{fmtT(timeLeft)}</div>
            <div style={{ flex:1 }}>
              <div style={{ background:SURF, borderRadius:8, padding:"8px 12px", marginBottom:6 }}>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:3 }}>Hold</div>
                <div style={{ fontSize:14, fontWeight:700 }}>{ex.hold} · {ex.sets}</div>
              </div>
              {/* RPE dots */}
              <div style={{ display:"flex", gap:3, alignItems:"center" }}>

          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>Muscle Tension</div>

            </div>
          </div>

          {/* cue */}
          <div style={{ background:SURF, borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+ex.col }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:4 }}>Coaching Cue</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{ex.cue}</div>
          </div>
        </div>
      </div>

      {/* next */}
      {idx < EXERCISES.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{EXERCISES[idx+1].icon} {EXERCISES[idx+1].name}</div>
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(EXERCISES[idx+1].duration)}</div>
        </div>
      )}

      {/* controls */}
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        <Btn onClick={() => jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={() => setRunning(r=>!r)} style={{ flex:1, padding:12, background: running ? "#334155" : CYN, color: running ? TEXT : "#000" }}>{running ? "⏸ Pause" : timeLeft===ex.duration ? "▶ Start" : "▶ Resume"}</Btn>
        <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<EXERCISES.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
      </div>

      {/* list */}
      <FL>Full Routine</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {EXERCISES.map((e,i) => (
          <div key={i} onClick={() => jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background: i===idx ? e.col+"18" : CARD, border:"1px solid "+(i===idx ? e.col+"66" : BOR), borderRadius:10, cursor:"pointer", opacity: done.has(i) ? 0.4 : 1, transition:"all .15s" }}>
            <div style={{ fontSize:16, flexShrink:0 }}>{e.icon}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:600, color: i===idx ? TEXT : MID }}>{e.name}</div>
              <div style={{ fontSize:11, color:LOW }}>{e.hold} · RPE {e.rpe}/10</div>
            </div>
            <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{done.has(i) ? "✓" : fmtT(e.duration)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// BALL HANDLING
// ═════════════════════════════════════════════════════════════════════
function BallHandling() {
  const COURT = "#c8762a";
  const DRILLS = [
    { name: "Stationary Pound Dribble", phase: "Warm-Up",     duration: 60, reps: "30s each hand",         cue: "Get low — athletic stance, knees bent. Dribble hard and fast below the knee. Keep your eyes UP, not on the ball. This trains your hand to know where the ball is without looking, essential for reading the defense." },
    { name: "Crossover",                phase: "Warm-Up",     duration: 60, reps: "Continuous · 1 min",    cue: "Push the ball low across your body, don't let it rise above your waist. Stay in a wide stance. Snap it side to side with your fingertips, not your palm. As you get comfortable, add a slight shoulder fake before each cross." },
    { name: "Between the Legs",         phase: "Foundation",  duration: 75, reps: "Slow then fast",        cue: "Step your right foot forward, push ball through. Then left foot forward. Go slow to groove the pattern first — 20 seconds slow, then attack the pace. This is the move you'll use off the dribble when a defender crowds you." },
    { name: "Behind the Back",          phase: "Foundation",  duration: 75, reps: "Continuous · alternate", cue: "Guide the ball with one hand, catch with the other. Keep it below your back — high behind-the-back dribbles get stripped easily. Use a slight forward lean. Don't rush this; feel the ball wrap around you." },
    { name: "Figure 8 (No Dribble)",   phase: "Touch + IQ",  duration: 60, reps: "3 sets · switch direction", cue: "Weave the ball around your legs in a figure 8 — no dribbling. This is pure hand speed and coordination. Feel awkward? Good. That's your brain forming new connections. Switch direction each 20 seconds." },
    { name: "Two-Ball Pound Dribble",  phase: "Touch + IQ",  duration: 60, reps: "Simultaneous · 1 min",  cue: "Both balls dribble at the same time, same height. Your weaker hand will struggle — that's the point. Keep your eyes forward. No second ball? Do 30s left hand only — your weak hand needs the solo reps." },
    { name: "Speed Dribble + Retreat", phase: "Game Speed",   duration: 75, reps: "4 reps each direction", cue: "Hard dribble forward 5 steps, then retreat crossover back. This simulates attacking a closeout and pulling back. Stay low through the retreat step — this is where most guys stand up and get the ball stolen." },
    { name: "Combo Finish",            phase: "Game Speed",   duration: 75, reps: "5 reps each combo",    cue: "Chain 3 moves: cross → between legs → behind back → finish. Go at 80% speed — fast enough to feel game-like, slow enough to stay sharp. End each rep with an imaginary pull-up or layup. See the move before you do it." },
  ];
  const PHASES = ["Warm-Up", "Foundation", "Touch + IQ", "Game Speed"];
  const TOTAL = DRILLS.reduce((s,d)=>s+d.duration,0);

  const [idx, setIdx] = useState(0);
  const [timeLeft, setTimeLeft] = useState(DRILLS[0].duration);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(new Set());
  const [complete, setComplete] = useState(false);
  const iRef = useRef(null);
  const dr = DRILLS[idx];

  const fmtT = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current = null; setRunning(false); };
  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(DRILLS[i].duration); };
  const resetAll = () => { stopT(); setIdx(0); setTimeLeft(DRILLS[0].duration); setDone(new Set()); setComplete(false); };

  useEffect(() => {
    if (!running) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx + 1 < DRILLS.length) { setIdx(idx+1); setTimeLeft(DRILLS[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 900);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx]);

  const ovrPct = DRILLS.slice(0,idx).reduce((s,d)=>s+d.duration,0) / TOTAL * 100;
  const drPct  = dr ? (dr.duration - timeLeft) / dr.duration * 100 : 0;

  if (complete) return (
    <div style={{ height:"100%", overflowY:"auto", padding:"32px 24px", textAlign:"center" }}>
      <div style={{ fontSize:64, marginBottom:14 }}>🏀</div>
      <div style={{ fontSize:26, fontWeight:700, color:COURT, marginBottom:6 }}>Work Done</div>
      <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:28, maxWidth:320, margin:"0 auto 28px" }}>10 minutes of deliberate handle work. Do this 3× a week and you'll notice a real difference in comfort under pressure within 4–6 weeks.</div>
      <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:32 }}>
        {[["8","Drills"],["10","Minutes"],["🔥","Locked In"]].map(([v,l]) => (
          <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:10, padding:"12px 18px", textAlign:"center" }}>
            <div style={{ fontSize:22, fontWeight:700, color:COURT, fontFamily:"monospace" }}>{v}</div>
            <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:2 }}>{l}</div>
          </div>
        ))}
      </div>
      <Btn onClick={resetAll} style={{ width:"100%", padding:14 }}>↺ Run It Again</Btn>
    </div>
  );

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>🏀 Ball Handling</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>10 min · 8 drills</div>
      </div>

      {/* Phase strip */}
      <div style={{ display:"flex", gap:4, marginBottom:14 }}>
        {PHASES.map(p => {
          const pDrills = DRILLS.filter(d=>d.phase===p);
          const allDone = pDrills.every(d=>done.has(DRILLS.indexOf(d)));
          const isCur   = dr.phase === p;
          return (
            <div key={p} style={{ flex: pDrills.reduce((s,d)=>s+d.duration,0), height:5, borderRadius:99, background: allDone ? LIME : isCur ? COURT : BOR, transition:"background .4s", cursor:"default", title:p }} title={p} />
          );
        })}
      </div>

      <PBar pct={ovrPct} col={COURT} h={3} />
      <div style={{ height:14 }} />

      {/* timer block */}
      <div style={{ background:"#1a1207", borderRadius:16, padding:22, marginBottom:12, position:"relative", overflow:"hidden", border:"1px solid "+COURT+"33" }}>
        <div style={{ position:"absolute", top:-40, right:-40, width:180, height:180, borderRadius:"50%", border:"28px solid rgba(200,118,42,0.1)", pointerEvents:"none" }} />
        <div style={{ position:"absolute", bottom:-60, left:-30, width:150, height:150, borderRadius:"50%", border:"18px solid rgba(200,118,42,0.06)", pointerEvents:"none" }} />
        <div style={{ fontSize:10, color:COURT, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.2em", marginBottom:6 }}>{dr.phase}</div>
        <div style={{ fontSize:24, fontWeight:800, color:TEXT, textTransform:"uppercase", lineHeight:1.1, marginBottom:14 }}>{dr.name}</div>
        <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:12 }}>
          <div style={{ fontSize:64, fontWeight:900, fontFamily:"monospace", color: timeLeft<=10 ? "#ff3333" : timeLeft<=20 ? "#ff6b2b" : TEXT, letterSpacing:-2, lineHeight:1, minWidth:130 }}>{fmtT(timeLeft)}</div>
          <div style={{ flex:1 }}>
            <div style={{ background:"rgba(200,118,42,0.15)", border:"1px solid rgba(200,118,42,0.3)", borderRadius:10, padding:"8px 12px", marginBottom:6 }}>
              <div style={{ fontSize:10, color:COURT, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Reps / Sets</div>
              <div style={{ fontSize:16, fontWeight:800, color:TEXT }}>{dr.reps}</div>
            </div>
            <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)" }}>Drill {idx+1} of {DRILLS.length}</div>
          </div>
        </div>
        {/* inner progress */}
        <div style={{ height:3, background:"rgba(255,255,255,0.1)", borderRadius:99, overflow:"hidden", marginBottom:12 }}>
          <div style={{ height:"100%", width:drPct+"%", background:"linear-gradient(90deg,"+COURT+",#ffaa44)", borderRadius:99, transition:"width 1s linear" }} />
        </div>
        {/* cue */}
        <div style={{ background:"rgba(255,255,255,0.05)", borderRadius:10, padding:"10px 12px", borderLeft:"3px solid "+COURT }}>
          <div style={{ fontSize:10, color:"rgba(255,255,255,0.35)", textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>🎙 Coaching Cue</div>
          <div style={{ fontSize:12.5, color:"rgba(255,255,255,0.85)", lineHeight:1.5 }}>{dr.cue}</div>
        </div>
      </div>

      {/* controls */}
      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
        <Btn onClick={() => jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"12px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={() => setRunning(r=>!r)} style={{ flex:1, padding:13, fontSize:15, background: running ? "#4a3a20" : COURT, color:TEXT }}>{running ? "⏸ Pause" : timeLeft===dr.duration ? "▶ Start" : "▶ Resume"}</Btn>
        <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<DRILLS.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"12px 16px" }}>Skip ›</Btn>
      </div>

      {/* next */}
      {idx < DRILLS.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:16, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:700, textTransform:"uppercase" }}>{DRILLS[idx+1].name}</div>
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(DRILLS[idx+1].duration)}</div>
        </div>
      )}

      {/* list */}
      <FL>Full Routine</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {DRILLS.map((d,i) => (
          <div key={i} onClick={() => jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"11px 14px", background: i===idx ? COURT+"18" : CARD, border:"1px solid "+(i===idx ? COURT+"66" : BOR), borderRadius:10, cursor:"pointer", opacity: done.has(i) ? 0.45 : 1, transition:"all .15s" }}>
            <div style={{ fontSize:16, fontWeight:800, fontFamily:"monospace", color: i===idx ? COURT : BOR, width:24, textAlign:"center", flexShrink:0 }}>{done.has(i) ? "✓" : i+1}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:700, textTransform:"uppercase", color: i===idx ? TEXT : MID, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{d.name}</div>
              <div style={{ fontSize:11, color:LOW, marginTop:1 }}>{d.phase} · {d.reps}</div>
            </div>
            <div style={{ fontSize:13, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(d.duration)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

            <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
              <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"7px 12px" }}>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Reps / Duration</div>
                <div style={{ fontSize:15, fontWeight:700 }}>{ex.work}</div>
              </div>
              <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"7px 12px" }}>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Activates</div>
                <div style={{ fontSize:13, fontWeight:600 }}>{ex.activates}</div>
              </div>
            </div>
          </div>
          <div style={{ background:SURF, borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+pc }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>Execution</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{ex.cue}</div>
          </div>
        </div>
      </div>
      {idx < EXERCISES.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{EXERCISES[idx+1].name}</div>
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(EXERCISES[idx+1].duration)}</div>
        </div>
      )}
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        <Btn onClick={()=>jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={()=>setRunning(r=>!r)} style={{ flex:1, padding:12 }}>{running?"⏸ Pause":timeLeft===ex.duration?"▶ Start":"▶ Resume"}</Btn>
        <Btn onClick={()=>{ setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<EXERCISES.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
      </div>
      <FL>Full Protocol</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {EXERCISES.map((e,i) => {
          const col = PHASE_COLS[e.phase];
          return (
            <div key={i} onClick={()=>jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:i===idx?col+"18":CARD, border:"1px solid "+(i===idx?col+"66":BOR), borderRadius:10, cursor:"pointer", opacity:done.has(i)?0.4:1, transition:"all .15s" }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:col, flexShrink:0 }} />
              <div style={{ width:20, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color:i===idx?col:LOW, flexShrink:0 }}>{done.has(i)?"✓":i+1}</div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:13, fontWeight:600, color:i===idx?TEXT:MID }}>{e.pap?"⚡ ":""}{e.name}</div>
                <div style={{ fontSize:11, color:LOW }}>{PHASE_NAMES[e.phase]} · {e.activates}</div>
              </div>
              <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(e.duration)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// PLYOMETRIC ROUTINE
// ═════════════════════════════════════════════════════════════════════
function Plyometric() {
  const SPARK = "#ffe620";
  const PHASES = ["Activation","Vertical Power","Lateral Speed","First Step"];
  const EXERCISES = [
    { name:"Ankle Hops",           phase:"Activation",     duration:40, work:"2 × 20s",                  intensity:5,  transfer:"Tendon Stiffness",    science:"RSI Training",      rest:15, cue:"Feet shoulder-width, bounce using ONLY your ankles — knees stay almost straight. Shortest possible ground contact time, like the floor is hot. Trains tendon stiffness and reactive strength index, the primary predictor of explosive basketball performance." },
    { name:"Squat Jumps",          phase:"Vertical Power", duration:50, work:"3 × 15s on/10s off",        intensity:8,  transfer:"CMJ + Vertical",      science:"CMJ Training",      rest:20, cue:"Dip quickly into an athletic stance and explode UP — the dip must be FAST, not a slow squat. Uses the stretch-shortening cycle. Land soft, absorb in 0.5 seconds, immediately go again. Drive arms aggressively upward to add 3–4 inches to your jump." },
    { name:"Split Jump",           phase:"Vertical Power", duration:60, work:"3 × 20s alternating",       intensity:9,  transfer:"Single-Leg Power",    science:"Unilateral Force",  rest:20, cue:"Lunge stance. Drive off both feet and switch legs in the air — land in lunge with opposite foot forward. Exposes side-to-side power differences. Keep torso tall. Land quietly — loud landings mean poor force absorption." },
    { name:"Lateral Bounds",       phase:"Lateral Speed",  duration:60, work:"3 × 20s",                   intensity:8,  transfer:"COD + Defense",       science:"Lateral Power",     rest:20, cue:"Push explosively off ONE foot to the side, stick the landing on the opposite single foot, hold 1 second, then bound back. Distance = power; stability = control. Directly trains lateral force production most players never develop." },
    { name:"180° Jump",            phase:"Lateral Speed",  duration:50, work:"3 × 15s",                   intensity:7,  transfer:"Rotational Power",    science:"Multi-Directional", rest:20, cue:"Jump and rotate 180° — land facing opposite direction, immediately jump and rotate back. Absorb each landing in athletic stance. Trains force production and redirection in multiple directions — exactly what happens boxing out or contesting from a scramble." },
    { name:"Power Skip",           phase:"First Step",     duration:60, work:"3 × forward + back",        intensity:7,  transfer:"First Step Explosive", science:"One-Leg Drive",     rest:20, cue:"Skip forward driving your knee as HIGH as possible — exaggerate it. Trains the single-leg explosiveness and knee drive of your first step off a dribble. Transfers directly to first-step quickness on offense and lateral closeouts on defense." },
    { name:"Continuous Max Jumps", phase:"First Step",     duration:50, work:"2 × 10 jumps, max effort",  intensity:10, transfer:"Peak Vertical",       science:"Max Intent",        rest:0,  cue:"Jump as HIGH as possible — 1 second reset between each rep. Full countermovement, full arm swing, 100% intent. Research shows 10 max-intent jumps per set improves height more than 30 moderate jumps. These must look and feel violent." },
  ];
  const TOTAL = EXERCISES.reduce((s,e)=>s+e.duration,0);
  const [idx, setIdx] = useState(0);
  const [timeLeft, setTimeLeft] = useState(EXERCISES[0].duration);
  const [running, setRunning] = useState(false);
  const [inRest, setInRest] = useState(false);
  const [restLeft, setRestLeft] = useState(0);
  const [done, setDone] = useState(new Set());
  const [complete, setComplete] = useState(false);
  const iRef = useRef(null);
  const ex = EXERCISES[idx];

  const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const stopT = useCallback(() => { clearInterval(iRef.current); iRef.current=null; setRunning(false); setInRest(false); }, []);
  const jumpTo = useCallback(i => { stopT(); setIdx(i); setTimeLeft(EXERCISES[i].duration); setInRest(false); }, [stopT]);
  const resetAll = () => { stopT(); setIdx(0); setTimeLeft(EXERCISES[0].duration); setDone(new Set()); setComplete(false); };

  const startRest = useCallback((sec, nextIdx) => {
    setInRest(true);
    setRestLeft(sec);
    iRef.current = setInterval(() => {
      setRestLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current=null;
          setInRest(false);
          setIdx(nextIdx);
          setTimeLeft(EXERCISES[nextIdx].duration);
          setRunning(true);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
  }, []);

  useEffect(() => {
    if (!running || inRest) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current=null;
          setRunning(false);
          setDone(d => { const nd=new Set(d); nd.add(idx); return nd; });
          const rest = EXERCISES[idx].rest;
          setTimeout(() => {
            if (idx+1 < EXERCISES.length) {
              if (rest > 0) { startRest(rest, idx+1); setRunning(true); }
              else { setIdx(idx+1); setTimeLeft(EXERCISES[idx+1].duration); setRunning(true); }
            } else { setComplete(true); }
          }, 600);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, inRest, idx, startRest]);

  const ovrPct = EXERCISES.slice(0,idx).reduce((s,e)=>s+e.duration,0)/TOTAL*100;
  const exPct  = ex ? (ex.duration-timeLeft)/ex.duration*100 : 0;

  if (complete) return (
    <div style={{ height:"100%", overflowY:"auto", padding:"32px 24px", textAlign:"center" }}>
      <div style={{ fontSize:64, marginBottom:14 }}>⚡</div>
      <div style={{ fontSize:26, fontWeight:700, color:SPARK, marginBottom:8 }}>Power Built</div>
      <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:28, maxWidth:320, margin:"0 auto 28px" }}>10 minutes of research-backed explosive training. Do 3× a week and expect measurable improvement in vertical, first step, and lateral speed within 4–6 weeks.</div>
      <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:32 }}>
        {[["7","Exercises"],["10","Minutes"],["3×","Per Week"]].map(([v,l]) => (
          <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:12, padding:"14px 20px", textAlign:"center" }}>
            <div style={{ fontSize:22, fontWeight:700, color:SPARK, fontFamily:"monospace" }}>{v}</div>
            <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:3 }}>{l}</div>
          </div>
        ))}
      </div>
      <Btn onClick={resetAll} style={{ width:"100%", padding:14 }}>↺ Run Again</Btn>
    </div>
  );

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>💥 Plyometric Circuit</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>10 min · 7 exercises</div>
      </div>
      <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+CYN, borderRadius:12, padding:"11px 14px", marginBottom:12, display:"flex", gap:10, alignItems:"flex-start" }}>
        <div style={{ fontSize:14, flexShrink:0 }}>🔬</div>
        <div style={{ fontSize:11, color:MID, lineHeight:1.55 }}><span style={{ color:CYN, fontWeight:600 }}>2024 Research: </span>Fast, reactive hops with minimal ground contact produce the best on-court transfer for explosive rebounds, first steps, and vertical jump. <span style={{ color:SPARK }}>48–72hr recovery required</span> between sessions.</div>
      </div>
      <div style={{ display:"flex", gap:5, marginBottom:12 }}>
        {PHASES.map(p => {
          const pExes = EXERCISES.filter(e=>e.phase===p);
          const allDone = pExes.every(e=>done.has(EXERCISES.indexOf(e)));
          const isCur = ex.phase===p;
          return <div key={p} style={{ flex:pExes.reduce((s,e)=>s+e.duration,0), height:5, borderRadius:99, background:allDone?LIME:isCur?SPARK:BOR, transition:"background .4s" }} title={p} />;
        })}
      </div>
      <PBar pct={ovrPct} col={SPARK} h={3} />
      <div style={{ height:10 }} />
      <div style={{ display:"flex", gap:5, marginBottom:14 }}>
        {EXERCISES.map((_,i) => <div key={i} onClick={()=>jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background:done.has(i)?LIME:i===idx?SPARK:BOR, border:"1px solid "+(i===idx?SPARK:BOR), cursor:"pointer", boxShadow:i===idx?"0 0 8px "+SPARK+"88":"none", transition:"all .25s" }} />)}
      </div>
      {inRest && (
        <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:16, padding:"28px 20px", textAlign:"center", marginBottom:12 }}>
          <div style={{ fontSize:11, color:LOW, textTransform:"uppercase", letterSpacing:"0.2em", marginBottom:8 }}>// Rest Period</div>
          <div style={{ fontSize:72, fontWeight:900, fontFamily:"monospace", color:CYN, letterSpacing:-4, lineHeight:1, marginBottom:8 }}>{fmtT(restLeft)}</div>
          <div style={{ fontSize:13, color:MID }}>Next up: <span style={{ color:TEXT, fontWeight:600 }}>{idx+1 < EXERCISES.length ? EXERCISES[idx+1].name : "—"}</span></div>
        </div>
      )}
      {!inRest && (
        <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:14, overflow:"hidden", marginBottom:12 }}>
          <div style={{ height:3, background:BOR, overflow:"hidden" }}>
            <div style={{ height:"100%", width:exPct+"%", background:"linear-gradient(90deg,"+SPARK+",#ffee88)", transition:"width 1s linear" }} />
          </div>
          <div style={{ padding:18 }}>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>
              <span style={{ fontSize:10, fontWeight:600, padding:"3px 10px", borderRadius:99, border:"1px solid "+SPARK+"44", color:SPARK, background:SPARK+"12" }}>{ex.transfer}</span>
              <span style={{ fontSize:10, fontWeight:600, padding:"3px 10px", borderRadius:99, border:"1px solid "+CYN+"44", color:CYN, background:CYN+"12" }}>⚗ {ex.science}</span>
              <span style={{ fontSize:10, fontWeight:600, padding:"3px 10px", borderRadius:99, border:"1px solid "+AMB+"44", color:AMB }}>Intent {ex.intensity}/10</span>
            </div>
            <div style={{ fontSize:11, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>Exercise {idx+1} of {EXERCISES.length}</div>
            <div style={{ fontSize:26, fontWeight:800, textTransform:"uppercase", marginBottom:14 }}>{ex.name}</div>
            <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:12 }}>
              <div style={{ fontSize:60, fontWeight:900, fontFamily:"monospace", color:timeLeft<=5?"#ef4444":timeLeft<=15?"#ffaa33":TEXT, letterSpacing:-2, lineHeight:1, minWidth:110, transition:"color .3s" }}>{fmtT(timeLeft)}</div>
              <div style={{ flex:1, display:"flex", flexDirection:"column", gap:7 }}>
                <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"7px 12px" }}>
                  <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Sets / Work</div>
                  <div style={{ fontSize:15, fontWeight:700 }}>{ex.work}</div>
                </div>
                <div style={{ display:"flex", gap:3, alignItems:"center" }}>
                  <div style={{ fontSize:9, color:LOW, marginRight:2 }}>Intent</div>
                  {Array.from({length:10},(_,i) => <div key={i} style={{ width:10, height:14, borderRadius:2, background:i<ex.intensity?(i>=7?"#ff3b3b":SPARK):BOR }} />)}
                </div>
              </div>
            </div>
            <div style={{ height:3, background:BOR, borderRadius:99, overflow:"hidden", marginBottom:12 }}>
              <div style={{ height:"100%", width:exPct+"%", background:"linear-gradient(90deg,"+SPARK+",#ffee88)", borderRadius:99, transition:"width 1s linear" }} />
            </div>
            <div style={{ background:SURF, borderRadius:10, padding:"10px 12px", borderLeft:"3px solid "+SPARK }}>
              <div style={{ fontSize:9, color:SPARK, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>// Execution</div>
              <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{ex.cue}</div>
            </div>
          </div>
        </div>
      )}
      <div style={{ display:"flex", gap:8, marginBottom:12 }}>
        <Btn onClick={()=>jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={()=>setRunning(r=>!r)} style={{ flex:1, padding:13, background:running?SURF:SPARK, color:running?TEXT:"#000" }}>{running||inRest?"⏸ Pause":timeLeft===ex.duration?"▶ Start":"▶ Resume"}</Btn>
        <Btn onClick={()=>{ stopT(); setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<EXERCISES.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
      </div>
      {!inRest && idx < EXERCISES.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:16, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:700, textTransform:"uppercase" }}>{EXERCISES[idx+1].name}</div>
          {EXERCISES[idx].rest > 0 && <span style={{ fontSize:10, color:CYN, flexShrink:0 }}>{fmtT(EXERCISES[idx].rest)} rest</span>}
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(EXERCISES[idx+1].duration)}</div>
        </div>
      )}
      <FL>Full Circuit</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {EXERCISES.map((e,i) => (
          <div key={i} onClick={()=>jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:i===idx?SPARK+"18":CARD, border:"1px solid "+(i===idx?SPARK+"66":BOR), borderRadius:10, cursor:"pointer", opacity:done.has(i)?0.4:1, transition:"all .15s" }}>
            <div style={{ width:22, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color:i===idx?SPARK:LOW, flexShrink:0 }}>{done.has(i)?"✓":i+1}</div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:13, fontWeight:700, textTransform:"uppercase", color:i===idx?TEXT:MID, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{e.name}</div>
              <div style={{ fontSize:11, color:LOW }}>{e.phase} · Intent {e.intensity}/10{e.rest>0?" · "+fmtT(e.rest)+" rest":""}</div>
            </div>
            <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(e.duration)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// PRE-GAME ACTIVATION
// ═════════════════════════════════════════════════════════════════════
function PreGameActivation() {
  const GOLD = "#e8a820";
  const PHASE_COLS = { "Ball Handling": GOLD, "Finishing": "#c8882a", "Mid-Range": "#3a9a5a", "Game Speed": "#e84040" };
  const DRILLS = [
    { id:"bh-warmup",    name:"Stationary Handle Warm-Up", phase:"Ball Handling", type:"handle",   duration:60,  format:"30s each hand",            target:"Both hands alternate",         targetDesc:"30s left · 30s right",                   shotSpot:null,         shotSpot2:null,        cue:"Low pound dribble, eyes up. Start slow — let your hands wake up. Alternate between low tight dribbles and slightly wider controlled ones. This primes your hand-eye coordination and gets the nervous system talking to your fingers before you need them under pressure. No looking at the ball." },
    { id:"bh-crossover", name:"Crossover + Between Legs",  phase:"Ball Handling", type:"handle",   duration:75,  format:"Combo · continuous",        target:"3 crosses → between legs",     targetDesc:"Repeat pattern for full duration",       shotSpot:null,         shotSpot2:null,        cue:"Three quick crossovers, then one between the legs. Build a rhythm. This activates the handle patterns you'll use in game — the combo mimics getting a defender on your hip and breaking their ankles before a drive. Stay low, stay athletic." },
    { id:"finish-layup", name:"Both-Hand Layups",          phase:"Finishing",     type:"handle",   duration:90,  format:"10 each hand",              target:"10L + 10R layups",             targetDesc:"Focus on off-hand finish",               shotSpot:null,         shotSpot2:null,        cue:"Drive from the wing, finish at the rim. Right-hand off right foot, left-hand off left foot. Your off-hand finish needs 3× the reps your dominant hand does — it's where you're losing layups in games. Slow it down to groove the touch, then speed up by rep 7." },
    { id:"finish-rev",   name:"Reverse Layup",             phase:"Finishing",     type:"handle",   duration:75,  format:"5 each side",               target:"10 total reverse layups",      targetDesc:"Under & up, use the board",              shotSpot:null,         shotSpot2:null,        cue:"Drive the baseline, duck under the backboard, lay it up on the far side using the glass. This is the most underused finishing move in recreational basketball — nobody expects it and it's nearly unblockable. Use a soft touch — kiss it off the square." },
    { id:"mid-elbow",    name:"Elbow Pull-Up",             phase:"Mid-Range",     type:"shooting", duration:90,  format:"Make 5 or time runs",        target:"Both elbows",                  targetDesc:"Left elbow → Right elbow",               shotSpot:"Elbow R",    shotSpot2:"Elbow L",   cue:"Dribble to the elbow, stop on a dime, set your feet, fire. The highest-percentage mid-range shot in basketball. Feet should land together, knees bent into the shot. Your elbow forms before you even plant your feet. Three dribbles max before the shot." },
    { id:"mid-wing",     name:"Wing Mid-Range Jumper",     phase:"Mid-Range",     type:"shooting", duration:90,  format:"Make 5 or time runs",        target:"Right wing → Left wing",       targetDesc:"Catch & shoot off a spin pass",          shotSpot:"Wing R",     shotSpot2:"Wing L",    cue:"Spin the ball to yourself, step into it on the wing (12–15 feet). Feet hit as the ball arrives. Your feet should be ready BEFORE the ball gets there. Focus on same-time rhythm: catch, plant, up." },
    { id:"mid-base",     name:"Baseline Fadeaway",         phase:"Mid-Range",     type:"shooting", duration:90,  format:"Make 5 or time runs",        target:"Right baseline → Left baseline",targetDesc:"Drive baseline, pull up or fadeaway",    shotSpot:"Baseline R", shotSpot2:"Baseline L", cue:"Drive the baseline hard, pull up at the block extended. You can go straight pull-up or use a slight fadeaway. Use the backboard from this angle — the glass gives you a bigger target from the baseline than going straight at the front rim." },
    { id:"game-speed",   name:"Game-Speed Combo",          phase:"Game Speed",    type:"shooting", duration:90,  format:"Clock running — go fast",     target:"Any mid-range spot",           targetDesc:"Handle → drive → finish or pull-up",    shotSpot:"Hi-Post",    shotSpot2:null,        cue:"Free flow — dribble at game speed, make a move, finish or pull up from any mid-range spot. No setup, no slow pace. This is your game simulation: your body and hands are now warm, your shot is grooved. Play like the game has already started." },
  ];
  const TOTAL = DRILLS.reduce((s,d)=>s+d.duration,0);
  const [idx, setIdx]     = useState(0);
  const [timeLeft, setTimeLeft] = useState(DRILLS[0].duration);
  const [running, setRunning]   = useState(false);
  const [done, setDone]         = useState(new Set());
  const [complete, setComplete] = useState(false);
  const [shots, setShots]       = useState(() => { const m={}; DRILLS.forEach(d=>{ if(d.type==="shooting") m[d.id]={makes:0,att:0}; }); return m; });
  const iRef = useRef(null);
  const dr = DRILLS[idx];
  const pc = PHASE_COLS[dr.phase] || GOLD;

  const fmtT = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current=null; setRunning(false); };
  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(DRILLS[i].duration); };
  const resetAll = () => { stopT(); setIdx(0); setTimeLeft(DRILLS[0].duration); setDone(new Set()); setComplete(false); setShots(()=>{ const m={}; DRILLS.forEach(d=>{ if(d.type==="shooting") m[d.id]={makes:0,att:0}; }); return m; }); };

  useEffect(() => {
    if (!running) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current=null;
          setDone(d => { const nd=new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx+1 < DRILLS.length) { setIdx(idx+1); setTimeLeft(DRILLS[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 800);
          return 0;
        }
        return prev-1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx]);

  const logShot = (make) => {
    setShots(prev => {
      const cur = prev[dr.id] || {makes:0,att:0};
      return { ...prev, [dr.id]: { makes: cur.makes+(make?1:0), att: cur.att+1 } };
    });
  };

  const ovrPct = DRILLS.slice(0,idx).reduce((s,d)=>s+d.duration,0)/TOTAL*100;
  const exPct  = (dr.duration-timeLeft)/dr.duration*100;
  const curShot = shots[dr.id] || {makes:0,att:0};
  const shotPct = curShot.att > 0 ? Math.round(curShot.makes/curShot.att*100) : 0;
  const shotMsg = ["take your first shot","keep going","finding rhythm","looking good","locked in 🔥","unconscious 🔥🔥"][Math.min(Math.floor(shotPct/20),5)];

  if (complete) {
    const shootingDrills = DRILLS.filter(d=>d.type==="shooting");
    let totMakes=0, totAtt=0;
    shootingDrills.forEach(d=>{ const s=shots[d.id]||{makes:0,att:0}; totMakes+=s.makes; totAtt+=s.att; });
    return (
      <div style={{ height:"100%", overflowY:"auto", padding:"24px 16px 32px" }}>
        <div style={{ textAlign:"center", marginBottom:24 }}>
          <div style={{ fontSize:52, marginBottom:10 }}>🏀</div>
          <div style={{ fontSize:26, fontWeight:800, color:GOLD, marginBottom:6 }}>Game Time</div>
          <div style={{ fontSize:12, color:MID, lineHeight:1.65 }}>Body warm, hands warm, shot grooved, handle sharp. You're not hoping to get warm in Q1 — you already are.</div>
        </div>
        <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:12, padding:16, marginBottom:14 }}>
          <FL>Shot Session Summary</FL>
          {shootingDrills.map(d => {
            const s = shots[d.id]||{makes:0,att:0};
            const p = s.att>0 ? Math.round(s.makes/s.att*100)+"%" : "—";
            return (
              <div key={d.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:"1px solid "+BOR }}>
                <div style={{ flex:1, fontSize:13, color:MID }}>{d.name}</div>
                <div style={{ fontSize:14, fontWeight:700, fontFamily:"monospace", color:GOLD }}>{s.makes}/{s.att}</div>
                <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", minWidth:36, textAlign:"right" }}>{p}</div>
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:10, marginBottom:20 }}>
          {[["Total Shots", totAtt],["Makes", totMakes],["Pct", totAtt>0?Math.round(totMakes/totAtt*100)+"%":"—"]].map(([l,v])=>(
            <div key={l} style={{ flex:1, background:CARD, border:"1px solid "+BOR, borderRadius:10, padding:"12px 10px", textAlign:"center" }}>
              <div style={{ fontSize:24, fontWeight:700, color:GOLD, fontFamily:"monospace" }}>{v}</div>
              <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:2 }}>{l}</div>
            </div>
          ))}
        </div>
        <Btn onClick={resetAll} style={{ width:"100%", padding:14 }}>↺ Run It Again</Btn>
      </div>
    );
  }

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>🏀 Pre-Game Activation</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>~9 min · 8 drills</div>
      </div>

      {/* Phase strip */}
      <div style={{ display:"flex", background:SURF, border:"1px solid "+BOR, borderRadius:10, overflow:"hidden", marginBottom:12 }}>
        {Object.entries(PHASE_COLS).map(([p,col],pi,arr) => {
          const phDrills = DRILLS.filter(d=>d.phase===p);
          const allDone = phDrills.every(d=>done.has(DRILLS.indexOf(d)));
          const isCur = dr.phase===p;
          return (
            <div key={p} style={{ flex:1, textAlign:"center", padding:"9px 4px", borderRight:pi<arr.length-1?"1px solid "+BOR:"none", background:isCur?col+"18":"transparent" }}>
              <div style={{ fontSize:9, color:allDone?LIME:isCur?col:LOW, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.04em" }}>{allDone?"✓ ":""}{p.split(" ")[0]}</div>
            </div>
          );
        })}
      </div>

      <PBar pct={ovrPct} col={pc} h={3} />
      <div style={{ height:10 }} />

      {/* dots */}
      <div style={{ display:"flex", gap:5, marginBottom:14 }}>
        {DRILLS.map((_,i) => <div key={i} onClick={()=>jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background:done.has(i)?LIME:i===idx?PHASE_COLS[DRILLS[i].phase]:BOR, border:"1px solid "+(i===idx?PHASE_COLS[DRILLS[i].phase]:BOR), cursor:"pointer", boxShadow:i===idx?"0 0 6px "+PHASE_COLS[DRILLS[i].phase]+"88":"none", transition:"all .2s" }} />)}
      </div>

      {/* main card */}
      <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:14, overflow:"hidden", marginBottom:12 }}>
        <div style={{ height:3, background:BOR, overflow:"hidden" }}>
          <div style={{ height:"100%", width:exPct+"%", background:pc, transition:"width 1s linear" }} />
        </div>
        <div style={{ padding:18 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
            <span style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.1em", padding:"3px 10px", borderRadius:99, border:"1px solid "+pc+"55", color:pc, background:pc+"18" }}>{dr.phase}</span>
            <span style={{ fontSize:11, color:LOW }}>Drill {idx+1}/{DRILLS.length}</span>
          </div>
          <div style={{ fontSize:22, fontWeight:800, marginBottom:12 }}>{dr.name}</div>

          {/* Shot tracker for shooting drills */}
          {dr.type==="shooting" && (
            <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:12, marginBottom:12 }}>
              <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:8 }}>// Shot Tracker</div>
              <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:6 }}>
                <div style={{ fontSize:44, fontWeight:800, fontFamily:"monospace", color:GOLD, letterSpacing:-2, lineHeight:1, minWidth:80 }}>{curShot.makes}<span style={{ fontSize:22, color:LOW, fontWeight:300 }}>/{curShot.att}</span></div>
                <div style={{ flex:1, display:"flex", flexDirection:"column", gap:6 }}>
                  <button onClick={()=>logShot(true)} style={{ background:"#1a4a2a", border:"1px solid #2a7a3a", borderRadius:8, color:"#6dff88", fontWeight:700, fontSize:13, padding:"8px 0", cursor:"pointer" }}>✓ Make</button>
                  <button onClick={()=>logShot(false)} style={{ background:"#3a1a1a", border:"1px solid #8b2a2a", borderRadius:8, color:"#ff8080", fontWeight:700, fontSize:13, padding:"8px 0", cursor:"pointer" }}>✗ Miss</button>
                </div>
              </div>
              <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", textAlign:"center" }}>{curShot.att>0?shotPct+"% — "+shotMsg:"0% — take your first shot"}</div>
            </div>
          )}

          {/* Target box for non-shooting drills */}
          {dr.type!=="shooting" && (
            <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:12, marginBottom:12, display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ fontSize:32, fontWeight:800, fontFamily:"monospace", color:GOLD, letterSpacing:-2, lineHeight:1, flexShrink:0 }}>{dr.target.split(" ")[0]}</div>
              <div>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Target</div>
                <div style={{ fontSize:14, fontWeight:700 }}>{dr.target}</div>
                <div style={{ fontSize:11, color:LOW, marginTop:2 }}>{dr.targetDesc}</div>
              </div>
            </div>
          )}

          {/* Timer + format */}
          <div style={{ display:"flex", alignItems:"flex-end", gap:14, marginBottom:12 }}>
            <div style={{ fontSize:60, fontWeight:900, fontFamily:"monospace", color:timeLeft<=5?"#ef4444":timeLeft<=15?GOLD:TEXT, lineHeight:1, minWidth:105, transition:"color .3s" }}>{fmtT(timeLeft)}</div>
            <div style={{ flex:1, paddingBottom:4 }}>
              <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:8, padding:"7px 12px" }}>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:2 }}>Format</div>
                <div style={{ fontSize:14, fontWeight:700 }}>{dr.format}</div>
              </div>
            </div>
          </div>
          <div style={{ height:3, background:BOR, borderRadius:99, overflow:"hidden", marginBottom:12 }}>
            <div style={{ height:"100%", width:exPct+"%", background:pc, borderRadius:99, transition:"width 1s linear" }} />
          </div>
          <div style={{ background:SURF, borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+pc }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:4 }}>Coaching Cue</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{dr.cue}</div>
          </div>
        </div>
      </div>

      {/* next */}
      {idx < DRILLS.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{DRILLS[idx+1].name}</div>
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(DRILLS[idx+1].duration)}</div>
        </div>
      )}

      {/* controls */}
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        <Btn onClick={()=>jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={()=>setRunning(r=>!r)} style={{ flex:1, padding:12, background:running?SURF:GOLD, color:running?TEXT:"#0a0800" }}>{running?"⏸ Pause":timeLeft===dr.duration?"▶ Start":"▶ Resume"}</Btn>
        <Btn onClick={()=>{ setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<DRILLS.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
      </div>

      {/* list */}
      <FL>Full Session</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {DRILLS.map((d,i) => {
          const col = PHASE_COLS[d.phase]||GOLD;
          return (
            <div key={i} onClick={()=>jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background:i===idx?col+"18":CARD, border:"1px solid "+(i===idx?col+"66":BOR), borderRadius:10, cursor:"pointer", opacity:done.has(i)?0.4:1, transition:"all .15s" }}>
              <div style={{ width:6, height:6, borderRadius:"50%", background:col, flexShrink:0 }} />
              <div style={{ width:20, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color:i===idx?col:LOW, flexShrink:0 }}>{done.has(i)?"✓":i+1}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color:i===idx?TEXT:MID, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{d.name}</div>
                <div style={{ fontSize:11, color:LOW }}>{d.phase} · {d.type==="shooting"?d.target:d.format}</div>
              </div>
              <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(d.duration)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}
