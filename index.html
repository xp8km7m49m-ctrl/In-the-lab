<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Average Joe's" />
  <meta name="theme-color" content="#150705" />
  <title>Average Joe's Basketball</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- React + Babel loaded from CDN — no build step needed -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; background: #150705; overflow: hidden; -webkit-text-size-adjust: 100%; }
    #root { height: 100%; height: 100dvh; }
    /* iPhone safe areas */
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    /* Prevent iOS bounce */
    body { position: fixed; width: 100%; }
  </style>

  <!-- Service Worker for push notifications -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          window.__swReg = reg;
          console.log('SW registered');
        }).catch(err => console.log('SW failed:', err));
      });
    }

    // Global notification helper called from React
    window.scheduleNotification = function(title, body, delayMs) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      setTimeout(function() {
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'NOTIFY', title: title, body: body });
          } else {
            new Notification(title, { body: body, icon: '/icon.png' });
          }
        } catch(e) { try { new Notification(title, { body: body }); } catch(_) {} }
      }, Math.max(0, delayMs || 0));
    };

    window.requestNotifPermission = function() {
      if (!('Notification' in window)) return Promise.resolve('denied');
      return Notification.requestPermission();
    };

    // Schedule daily habit reminder (9am)
    window.scheduleDailyHabitReminder = function(enabled) {
      if (!enabled) return;
      const now = new Date();
      const target = new Date();
      target.setHours(9, 0, 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
      const delay = target - now;
      setTimeout(() => {
        window.scheduleNotification('Time to check your habits! ✅', "Open Average Joe's and start your daily habits.", 0);
        window.scheduleDailyHabitReminder(true); // reschedule for tomorrow
      }, delay);
    };

    // Schedule a one-time event notification
    window.scheduleEventNotification = function(title, eventTimeStr, minsBeforeArr) {
      minsBeforeArr = minsBeforeArr || [60, 15];
      const eventTime = new Date(eventTimeStr);
      if (isNaN(eventTime)) return;
      minsBeforeArr.forEach(minsBefore => {
        const fireAt = new Date(eventTime.getTime() - minsBefore * 60000);
        const delay = fireAt - Date.now();
        if (delay > 0) {
          window.scheduleNotification(
            (minsBefore === 0 ? 'Starting now: ' : minsBefore + 'm: ') + title,
            'Tap to open Average Joe\'s',
            delay
          );
        }
      });
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useRef, useCallback, useEffect } = React;


// ─── Storage ──────────────────────────────────────────────────────────
const S = {};
function write(k, v) {
  S[k] = v;
  try { localStorage.setItem("itl_" + k, JSON.stringify(v)); } catch (_) {}
}
function read(k, def) {
  if (k in S) return S[k];
  try { const r = localStorage.getItem("itl_" + k); if (r !== null) { S[k] = JSON.parse(r); return S[k]; } } catch (_) {}
  S[k] = def; return def;
}
function useS(k, def) {
  const [v, sv] = useState(() => read(k, def));
  const set = useCallback((x) => sv((p) => { const n = typeof x === "function" ? x(p) : x; write(k, n); return n; }), [k]);
  return [v, set];
}

// ─── Helpers ──────────────────────────────────────────────────────────
const fmtDate = (d) => (d || new Date()).toISOString().slice(0, 10);
const td = () => fmtDate();
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const num = (v) => parseFloat(v) || 0;
const fmt = (n) => Number(n).toLocaleString();

// ─── Colors ───────────────────────────────────────────────────────────
const BG    = "#150705";       // near-black maroon
const SURF  = "#200a08";       // dark surface
const CARD  = "#2b0f0b";       // card background
const BOR   = "#4a1a12";       // border
const BORHI = "#6b2a1c";       // highlighted border
const LIME  = "#f0b429";       // PRIMARY ACCENT — badge gold
const VIO   = "#e2432b";       // secondary — burnt red-orange
const PINK  = "#d81e2c";       // danger / red accent (logo red)
const AMB   = "#ffcf40";       // gold / yellow (banner gold)
const CYN   = "#e6b566";       // warm cream-gold
const TEAL  = "#f2d9a8";       // light cream (skin tone)
const TEXT  = "#fff6e6";       // warm off-white text
const MID   = "#d9b98a";       // warm tan mid-tone
const LOW   = "#8a4a2a";       // muted warm brown

// ─── Base UI ──────────────────────────────────────────────────────────
const IS = { background: "#250d09", color: TEXT, border: "1px solid " + BOR, borderRadius: 7, padding: "8px 12px", fontSize: 13, width: "100%", fontFamily: "inherit" };

function In({ style, ...p }) { return <input style={{ ...IS, ...style }} {...p} />; }
function Ta({ style, ...p }) { return <textarea style={{ ...IS, resize: "vertical", lineHeight: 1.6, ...style }} {...p} />; }
function Sel({ style, ...p }) { return <select style={{ ...IS, ...style }} {...p} />; }

const BV = { p: { bg: LIME, col: "#1a0805" }, sec: { bg: SURF, col: MID, bor: BOR }, ghost: { bg: "transparent", col: MID, bor: BOR }, vio: { bg: VIO, col: "#fff" }, pink: { bg: PINK, col: "#fff" }, amb: { bg: AMB, col: "#1a0805" }, cyn: { bg: CYN, col: "#1a0805" }, teal: { bg: TEAL, col: "#1a0805" }, danger: { bg: "rgba(216,30,44,0.12)", col: PINK, bor: "rgba(216,30,44,0.3)" } };

function Btn({ children, onClick, v = "p", style, disabled }) {
  const s = BV[v] || BV.p;
  return (
    <button onClick={onClick} disabled={disabled} style={{ background: s.bg, color: s.col, border: s.bor ? "1px solid " + s.bor : "none", borderRadius: 8, padding: "8px 18px", fontWeight: 700, fontSize: 13, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, fontFamily: "inherit", ...style }}>
      {children}
    </button>
  );
}

function Chip({ children, on, click, col }) {
  const c = col || LIME;
  return (
    <button onClick={click} style={{ background: on ? c + "20" : SURF, color: on ? c : MID, border: "1px solid " + (on ? c + "55" : BOR), borderRadius: 6, padding: "4px 12px", fontSize: 12, fontWeight: on ? 700 : 400, cursor: "pointer", fontFamily: "inherit" }}>
      {children}
    </button>
  );
}

function Box({ done, col, click }) {
  const c = col || LIME;
  return (
    <div onClick={click} style={{ width: 20, height: 20, borderRadius: 5, flexShrink: 0, cursor: "pointer", border: "2px solid " + (done ? c : BOR), background: done ? c : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#fff" }}>
      {done ? "✓" : ""}
    </div>
  );
}

function PBar({ pct, col, h }) {
  return (
    <div style={{ height: h || 4, background: BOR, borderRadius: 2, overflow: "hidden" }}>
      <div style={{ height: "100%", width: Math.min(100, pct || 0) + "%", background: col || LIME, borderRadius: 2, transition: "width .4s" }} />
    </div>
  );
}

function Stat({ label, value, col, sub }) {
  const c = col || LIME;
  return (
    <div style={{ background: "#0d0403", borderTop: "3px solid " + c, borderRadius: "2px 2px 8px 8px", padding: "11px 10px 12px", textAlign: "center", boxShadow: "0 2px 8px rgba(0,0,0,.3)" }}>
      <div style={{ fontSize: 25, fontWeight: 400, fontFamily: "'Anton',sans-serif", color: c, letterSpacing: "0.01em", textShadow: "0 0 12px " + c + "40" }}>{value}</div>
      <div style={{ fontSize: 9, color: LOW, marginTop: 4, letterSpacing: "0.09em", textTransform: "uppercase", fontFamily: "monospace" }}>{label}</div>
      {sub && <div style={{ fontSize: 9, color: c, marginTop: 3, opacity: 0.85, fontFamily: "monospace" }}>{sub}</div>}
    </div>
  );
}

function SH({ children, right }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
      <h2 style={{ fontSize: 18, fontWeight: 700 }}>{children}</h2>
      {right}
    </div>
  );
}

function FL({ children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 9, marginTop: 2 }}>
      <div style={{ fontSize: 12, fontWeight: 400, letterSpacing: "0.08em", textTransform: "uppercase", color: AMB, fontFamily: "'Anton',sans-serif", whiteSpace: "nowrap" }}>{children}</div>
      <div style={{ flex: 1, height: 0, borderTop: "2px dashed " + BOR }} />
    </div>
  );
}

function Modal({ onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.72)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: CARD, border: "1px solid " + BORHI, borderRadius: 14, padding: 24, width: 360, maxWidth: "93vw", maxHeight: "85vh", overflowY: "auto" }}>
        {children}
      </div>
    </div>
  );
}

// ─── Ball Logo ────────────────────────────────────────────────────────
function Vial({ size = 26 }) {
  const s = size;
  return (
    <svg width={s} height={s} viewBox="0 0 28 28" fill="none" style={{ flexShrink: 0 }}>
      <circle cx="14" cy="14" r="12.5" fill="#e2432b" stroke="#1a0805" strokeWidth="1.6" />
      <path d="M1.5 14 H26.5 M14 1.5 V26.5" stroke="#1a0805" strokeWidth="1.4" />
      <path d="M4.2 5 Q14 14 4.2 23"  stroke="#1a0805" strokeWidth="1.4" fill="none" />
      <path d="M23.8 5 Q14 14 23.8 23" stroke="#1a0805" strokeWidth="1.4" fill="none" />
    </svg>
  );
}

// ─── Training Calendar Heatmap ─────────────────────────────────────────
function TrainingHeatmap({ trainLog }) {
  const WEEKS = 20;
  const scrollRef = useRef(null);
  const today = new Date();
  const dow = today.getDay();
  const start = new Date(today);
  start.setDate(start.getDate() - dow - (WEEKS - 1) * 7);

  const days = [];
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const ds = fmtDate(d);
    const day = trainLog[ds];
    const count = day ? Object.values(day).filter(Boolean).length : 0;
    days.push({ ds, date: d, count, future: d > today });
  }
  const weeksArr = [];
  for (let w = 0; w < WEEKS; w++) weeksArr.push(days.slice(w * 7, w * 7 + 7));

  let lastMonth = null;
  const monthLabels = weeksArr.map(week => {
    const m = week[0].date.getMonth();
    if (m !== lastMonth) { lastMonth = m; return week[0].date.toLocaleString("default", { month: "short" }); }
    return "";
  });

  const colorFor = c => c === 0 ? BOR : c === 1 ? "rgba(240,180,41,.42)" : c === 2 ? "rgba(240,180,41,.72)" : LIME;
  const totalDays = days.filter(d => !d.future && d.count > 0).length;

  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth; }, []);

  return (
    <div>
      <div style={{ fontSize: 11, color: LOW, fontFamily: "monospace", marginBottom: 8 }}>{totalDays} training days · last {WEEKS} weeks</div>
      <div ref={scrollRef} style={{ overflowX: "auto", paddingBottom: 4 }}>
        <div style={{ display: "inline-flex", gap: 3 }}>
          {weeksArr.map((week, wi) => (
            <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
              <div style={{ height: 12, fontSize: 9, color: LOW, fontFamily: "monospace", whiteSpace: "nowrap" }}>{monthLabels[wi]}</div>
              {week.map((d, di) => (
                <div key={di} title={d.ds + (d.future ? "" : " · " + d.count + " logged")} style={{ width: 11, height: 11, borderRadius: 3, background: d.future ? "transparent" : colorFor(d.count), border: d.future ? "1px dashed " + BOR : "none", flexShrink: 0 }} />
              ))}
            </div>
          ))}
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 8, fontSize: 9, color: LOW, fontFamily: "monospace" }}>
        <span>Less</span>
        {[BOR, "rgba(240,180,41,.42)", "rgba(240,180,41,.72)", LIME].map((c, i) => <div key={i} style={{ width: 10, height: 10, borderRadius: 2, background: c }} />)}
        <span>More</span>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
// HOME
// ═════════════════════════════════════════════════════════════════════
function Home({ go }) {
  const [prof, setProf] = useS("prof", { name: "", age: "", height: "", weight: "", pos: "", team: "", goal: "", bio: "", photo: "" });
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(prof);
  const ref = useRef(null);

  const [habits] = useS("habits", []);
  const [hc]     = useS("hc",     {});
  const [tasks]  = useS("tasks",  {});
  const [games]  = useS("games",  []);
  const [trainLog] = useS("trainingLog", {});

  const today = td();
  const hDone   = habits.filter(h => (hc[today] || {})[h.id]).length;
  const dayT    = tasks[today] || [];
  const tDone   = dayT.filter(t => t.done).length;
  const wins    = games.filter(g => num(g.myPts) > num(g.oppPts)).length;

  // Training streak: consecutive days (back from today) with any logged drill/routine
  const trainStreak = (() => {
    let n = 0, d = new Date();
    while (true) {
      const ds = fmtDate(d);
      const day = trainLog[ds];
      const hit = day && Object.values(day).some(Boolean);
      if (!hit) { if (ds === today) { d.setDate(d.getDate() - 1); continue; } break; }
      n++; d.setDate(d.getDate() - 1);
    }
    return n;
  })();
  const trainedToday = !!(trainLog[today] && Object.values(trainLog[today]).some(Boolean));

  const MILESTONES = [3, 7, 14, 30, 60, 100, 200, 365];
  const nextMilestone = MILESTONES.find(m => m > trainStreak) || null;
  const hitMilestone = [...MILESTONES].reverse().find(m => m <= trainStreak) || null;

  // Last 7 days consistency strip (trained + habit completion)
  const weekStrip = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const ds = fmtDate(d);
    const trained = !!(trainLog[ds] && Object.values(trainLog[ds]).some(Boolean));
    const habitPct = habits.length ? Math.round(Object.values(hc[ds] || {}).filter(Boolean).length / habits.length * 100) : 0;
    return { ds, day: "SMTWTFS"[d.getDay()], trained, habitPct, isToday: ds === today };
  });

  const up = k => e => setDraft(p => ({ ...p, [k]: e.target.value }));
  const save = () => { setProf(draft); setEditing(false); };
  const onPic = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => setDraft(p => ({ ...p, photo: ev.target.result })); r.readAsDataURL(f); };

  const NAVS = [
    { id: "habits",   icon: "✅", label: "Habits",        col: CYN,   info: hDone + "/" + habits.length + " done today" },
    { id: "tasks",    icon: "📋", label: "Tasks",         col: VIO,   info: tDone + "/" + dayT.length + " complete" },
    { id: "bball",    icon: "🏀", label: "Basketball",    col: PINK,  info: games.length ? wins + "-" + (games.length - wins) + " this season" : "Log a game or scrimmage" },
    { id: "activities",   icon: "🏃", label: "Activities",     col: LIME,  info: "10 routines — mobility, shooting & more" },
  ];

  return (
    <div style={{ height: "100%", overflowY: "auto", padding: "20px 20px 28px" }}>
      {/* ── Scoreboard — the hero ── */}
      <div style={{ background: "#0d0403", border: "1px solid rgba(240,180,41,.25)", boxShadow: "inset 0 0 0 1px rgba(0,0,0,.6), 0 4px 20px rgba(0,0,0,.4)", borderRadius: 10, padding: "16px 20px", marginBottom: 22, display: "flex", alignItems: "stretch" }}>
        <div style={{ flex: 1.3 }}>
          <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: "0.18em", color: LOW }}>TRAINING STREAK</div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <div style={{ fontFamily: "'Anton',sans-serif", fontSize: 52, lineHeight: 1.05, color: LIME, textShadow: "0 0 20px rgba(240,180,41,.5)" }}>{String(trainStreak).padStart(2, "0")}</div>
            <div style={{ fontFamily: "monospace", fontSize: 11, color: LOW }}>{trainStreak === 1 ? "DAY" : "DAYS"}</div>
          </div>
          <div style={{ fontFamily: "monospace", fontSize: 10, color: trainedToday ? LIME : MID, letterSpacing: "0.04em" }}>{trainedToday ? "🔥 LOCKED IN TODAY" : "→ TRAIN TODAY"}</div>
        </div>
        <div style={{ width: 1, background: "rgba(240,180,41,.18)", margin: "2px 18px" }} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", gap: 10 }}>
          <div>
            <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: "0.14em", color: LOW }}>RECORD</div>
            <div style={{ fontFamily: "'Anton',sans-serif", fontSize: 22, color: TEXT }}>{wins}-{Math.max(0, games.length - wins)}</div>
          </div>
          <div>
            <div style={{ fontFamily: "monospace", fontSize: 10, letterSpacing: "0.14em", color: LOW }}>LOGGED</div>
            <div style={{ fontFamily: "'Anton',sans-serif", fontSize: 22, color: VIO }}>{games.length}</div>
          </div>
        </div>
      </div>

      {/* player card */}
      <div style={{ background: "linear-gradient(135deg,#2b0f0b,#331209,#150705)", border: "1px solid " + BORHI, borderRadius: 16, padding: 24, marginBottom: 24, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -60, right: -60, width: 200, height: 200, borderRadius: "50%", background: "radial-gradient(circle,rgba(240,180,41,.09),transparent 70%)", pointerEvents: "none" }} />
        <div style={{ display: "flex", gap: 22, alignItems: "flex-start", flexWrap: "wrap", position: "relative" }}>
          {/* photo */}
          <div style={{ position: "relative", flexShrink: 0 }}>
            <div onClick={() => editing && ref.current && ref.current.click()} style={{ width: 100, height: 100, borderRadius: 12, overflow: "hidden", border: "2px solid " + (editing ? LIME : BORHI), background: SURF, display: "flex", alignItems: "center", justifyContent: "center", cursor: editing ? "pointer" : "default" }}>
              {prof.photo ? <img src={prof.photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <div style={{ textAlign: "center", color: LOW }}><div style={{ fontSize: 32 }}>👤</div>{editing && <div style={{ fontSize: 9, marginTop: 3, fontFamily: "monospace" }}>UPLOAD</div>}</div>}
            </div>
            {editing && <div onClick={() => ref.current && ref.current.click()} style={{ position: "absolute", bottom: -8, right: -8, background: LIME, borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, cursor: "pointer" }}>📷</div>}
            <input ref={ref} type="file" accept="image/*" onChange={onPic} style={{ display: "none" }} />
          </div>
          {/* info */}
          <div style={{ flex: 1, minWidth: 180 }}>
            {editing ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.name} onChange={up("name")} placeholder="Full Name" style={{ flex: 2, minWidth: 130, fontSize: 16, fontWeight: 700 }} />
                  <In value={draft.age} onChange={up("age")} placeholder="Age" style={{ width: 65 }} />
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.height} onChange={up("height")} placeholder="Height" />
                  <In value={draft.weight} onChange={up("weight")} placeholder="Weight (kg)" />
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.pos} onChange={up("pos")} placeholder="Position" />
                  <In value={draft.team} onChange={up("team")} placeholder="Team / School" />
                </div>
                <In value={draft.goal} onChange={up("goal")} placeholder="Main goal..." />
                <Ta value={draft.bio} onChange={up("bio")} placeholder="Short bio..." rows={2} />
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn onClick={save}>Save</Btn>
                  <Btn onClick={() => { setDraft(prof); setEditing(false); }} v="sec">Cancel</Btn>
                </div>
              </div>
            ) : (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                  <div>
                    <h1 style={{ fontSize: 24, fontWeight: 700 }}>{prof.name || "Your Name"}</h1>
                    {prof.pos && <div style={{ color: LIME, fontWeight: 600, fontSize: 13, marginTop: 2 }}>{prof.pos}{prof.team ? " · " + prof.team : ""}</div>}
                  </div>
                  <Btn onClick={() => { setDraft(prof); setEditing(true); }} v="ghost" style={{ fontSize: 12, padding: "5px 12px" }}>✏ Edit</Btn>
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                  {[prof.age && ["Age", prof.age], prof.height && ["Ht", prof.height], prof.weight && ["Wt", prof.weight + " kg"]].filter(Boolean).map(([l, val]) => (
                    <div key={l} style={{ background: "rgba(240,180,41,.1)", border: "1px solid rgba(240,180,41,.18)", borderRadius: 6, padding: "3px 10px", fontSize: 12 }}>
                      <span style={{ color: LOW }}>{l}: </span><span style={{ fontWeight: 600, fontFamily: "monospace" }}>{val}</span>
                    </div>
                  ))}
                </div>

        <Stat label="Tasks"    value={tDone + "/" + dayT.length}         col={VIO}   />

            <div style={{ width: 26, height: 26, borderRadius: "50%", background: d.trained ? LIME : "transparent", border: "2px solid " + (d.trained ? LIME : BOR), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>
              {d.trained ? "🏀" : ""}

            <span style={{ fontSize: 22, flexShrink: 0 }}>{item.icon}</span>

// HABITS
// ═════════════════════════════════════════════════════════════════════
function Habits() {
  const [habits, setHabits] = useS("habits", [
    { id: 1, name: "Morning Water",     icon: "💧", pri: "high" },
    { id: 2, name: "Meditate",          icon: "🧘", pri: "med"  },
    { id: 3, name: "Read 20min",        icon: "📚", pri: "med"  },
    { id: 4, name: "No Social Media AM",icon: "📵", pri: "low"  }
  ]);
  const [hc, setHc]       = useS("hc", {});
  const [newN, setNewN]   = useState("");
  const [newI, setNewI]   = useState("⭐");
  const [newP, setNewP]   = useState("med");
  const [adding, setAdding] = useState(false);
  const [viewDay, setViewDay] = useState(td());

  const EMOJIS = "⭐🏃💪🧠💧🥗😴📚🎯🙏🎨🎵💊🌅❄️".split("");
  const PC = { high: PINK, med: AMB, low: LIME };
  const PL = { high: "🔴 High", med: "🟡 Medium", low: "🟢 Low" };

  const dayComp = hc[viewDay] || {};
  const done    = habits.filter(h => dayComp[h.id]).length;
  const tog     = id => setHc(p => ({ ...p, [viewDay]: { ...(p[viewDay] || {}), [id]: !(p[viewDay] || {})[id] } }));
  const addH    = () => { if (!newN.trim()) return; setHabits(p => [...p, { id: Date.now(), name: newN, icon: newI, pri: newP }]); setNewN(""); setAdding(false); };

  // Navigate days
  const prevDay = () => { const d = new Date(viewDay + "T12:00:00"); d.setDate(d.getDate()-1); setViewDay(fmtDate(d)); };
  const nextDay = () => { const d = new Date(viewDay + "T12:00:00"); d.setDate(d.getDate()+1); setViewDay(fmtDate(d)); };
  const isToday = viewDay === td();
  const dayLabel = isToday ? "Today" : viewDay === fmtDate((() => { const d = new Date(); d.setDate(d.getDate()-1); return d; })()) ? "Yesterday" : new Date(viewDay + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  // Sort habits by priority then name
  const sorted = [...habits].sort((a, b) => {
    const PO = { high: 0, med: 1, low: 2 };
    return (PO[a.pri || "med"] - PO[b.pri || "med"]) || a.name.localeCompare(b.name);
  });

  // 7-day chart data
  const last7 = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6-i));
    const k = fmtDate(d), dc = hc[k] || {};
    return { l: DAYS[d.getDay()], p: habits.length ? Math.round(habits.filter(h => dc[h.id]).length / habits.length * 100) : 0, k };
  });

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 16px 16px" }}>

      {/* Day navigator */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexShrink: 0 }}>
        <button onClick={prevDay} style={{ background: SURF, border: "1px solid " + BOR, borderRadius: 8, padding: "8px 14px", color: MID, cursor: "pointer", fontSize: 16, fontFamily: "inherit" }}>‹</button>
        <div style={{ flex: 1, textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 17 }}>{dayLabel}</div>
          <div style={{ fontSize: 11, color: LOW, fontFamily: "monospace" }}>{viewDay}</div>
        </div>
        <button onClick={nextDay} style={{ background: SURF, border: "1px solid " + BOR, borderRadius: 8, padding: "8px 14px", color: MID, cursor: "pointer", fontSize: 16, fontFamily: "inherit" }}>›</button>
        <div style={{ background: "rgba(240,180,41,.12)", border: "1px solid rgba(240,180,41,.3)", borderRadius: 8, padding: "6px 14px", fontFamily: "monospace", fontWeight: 700, fontSize: 16, color: LIME }}>{done}/{habits.length}</div>
      </div>

      {/* Progress bar */}
      <PBar pct={habits.length ? done/habits.length*100 : 0} col={LIME} h={5} />
      <div style={{ height: 14 }} />

      {/* Habit list sorted by priority */}
      <div style={{ flex: 1, overflowY: "auto" }}>
        {["high","med","low"].map(pri => {
          const group = sorted.filter(h => (h.pri || "med") === pri);
          if (!group.length) return null;
          return (
            <div key={pri} style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: PC[pri] }} />
                <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: LOW, fontFamily: "monospace" }}>{PL[pri]}</span>
              </div>
              {group.map(h => {
                const isDone = !!dayComp[h.id];
                return (
                  <div key={h.id} onClick={() => tog(h.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", background: isDone ? "rgba(240,180,41,.08)" : CARD, border: "1px solid " + (isDone ? "rgba(240,180,41,.3)" : BOR), borderRadius: 10, marginBottom: 8, cursor: "pointer", transition: "all .15s" }}>
                    <span style={{ fontSize: 22, flexShrink: 0 }}>{h.icon}</span>
                    <span style={{ flex: 1, fontWeight: 500, fontSize: 15, textDecoration: isDone ? "line-through" : "none", color: isDone ? LOW : TEXT }}>{h.name}</span>
                    <Box done={isDone} col={PC[h.pri || "med"]} click={e => { e.stopPropagation(); tog(h.id); }} />
                    <button onClick={e => { e.stopPropagation(); setHabits(p => p.filter(x => x.id !== h.id)); }} style={{ background: "none", border: "none", color: LOW, fontSize: 18, cursor: "pointer", padding: "0 4px" }}>×</button>
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* 7-day mini chart */}
        <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: "14px 16px", marginBottom: 14 }}>
          <FL>7-Day Completion</FL>
          <div style={{ display: "flex", gap: 6, alignItems: "flex-end", height: 56 }}>
            {last7.map((x, i) => (
              <div key={i} onClick={() => setViewDay(x.k)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, height: "100%", justifyContent: "flex-end", cursor: "pointer" }}>
                <div style={{ width: "100%", height: (x.p || 2) + "%", minHeight: 3, background: x.k === viewDay ? LIME : LIME + "66", borderRadius: 3 }} />
                <div style={{ fontSize: 9, color: x.k === viewDay ? LIME : LOW, fontFamily: "monospace", fontWeight: x.k === viewDay ? 700 : 400 }}>{x.l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Add habit */}
        {adding ? (
          <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: 16 }}>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 12 }}>
              {EMOJIS.map(e => <span key={e} onClick={() => setNewI(e)} style={{ fontSize: 20, cursor: "pointer", padding: "4px 5px", borderRadius: 6, background: newI === e ? "rgba(240,180,41,.25)" : "transparent" }}>{e}</span>)}
            </div>
            <In value={newN} onChange={e => setNewN(e.target.value)} placeholder="Habit name" style={{ marginBottom: 10 }} onKeyDown={e => e.key === "Enter" && addH()} />
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              {["high","med","low"].map(p => (
                <button key={p} onClick={() => setNewP(p)} style={{ flex: 1, padding: "8px 0", borderRadius: 7, border: "1px solid " + (newP === p ? PC[p] : BOR), background: newP === p ? PC[p] + "22" : SURF, color: newP === p ? PC[p] : MID, fontWeight: newP === p ? 700 : 400, cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>{PL[p]}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={addH} style={{ flex: 1 }}>Add Habit</Btn>
              <Btn onClick={() => setAdding(false)} v="sec">Cancel</Btn>
            </div>
          </div>
        ) : (
          <button onClick={() => setAdding(true)} style={{ width: "100%", border: "1px dashed " + BOR, background: "none", color: LOW, borderRadius: 10, padding: 12, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>+ Add Habit</button>
        )}
      </div>
    </div>
  );
}

// TASKS
// ═════════════════════════════════════════════════════════════════════
function Tasks() {
  const [tasks, setTasks]     = useS("tasks", {});
  const [evs, setEvs]         = useS("evs", {});
  const [skipped, setSkipped] = useS("tasks_skipped", {}); // { "taskId_dateStr": true }
  const [text, setText]       = useState("");
  const [cat, setCat]         = useState("General");
  const [date, setDate]       = useState(td());
  const [time, setTime]       = useState("");
  const [rep, setRep]         = useState("none");

  const buildAllTasks = () => {
    const overdue = [], upcoming = [];
    const seen = new Set();
    const todayDs = td();
    Object.entries(tasks).forEach(function(entry) {
      var d = entry[0], arr = entry[1];
      (arr || []).forEach(function(t) {
        if (t.done || t._skipRecur) return;
        if (t.rep === "weekly") {
          var origin = new Date(d + "T12:00:00");
          for (var w = 0; w <= 8; w++) {
            var occ = new Date(origin); occ.setDate(origin.getDate() + w * 7);
            var occDs = fmtDate(occ);
            // only show up to 4 weeks ahead
            if (occDs > fmtDate(new Date(new Date().setDate(new Date().getDate() + 28)))) continue;
            var key = t.id + "_" + occDs;
            if (seen.has(key)) continue;
            // skip individually-dismissed occurrences
            if (skipped[key]) continue;
            seen.add(key);
            var item = Object.assign({}, t, { _date: occDs, _occKey: key, _isRecur: true });
            if (occDs < todayDs) overdue.push(item);
            else upcoming.push(item);
          }
        } else if (t.rep === "daily") {
          var origin2 = new Date(d + "T12:00:00");
          for (var dd = 0; dd <= 14; dd++) {
            var occ2 = new Date(origin2); occ2.setDate(origin2.getDate() + dd);
            var occDs2 = fmtDate(occ2);
            if (occDs2 > fmtDate(new Date(new Date().setDate(new Date().getDate() + 7)))) continue;
            var key2 = t.id + "_" + occDs2;
            if (seen.has(key2)) continue;
            if (skipped[key2]) continue;
            seen.add(key2);
            var item2 = Object.assign({}, t, { _date: occDs2, _occKey: key2, _isRecur: true });
            if (occDs2 < todayDs) overdue.push(item2);
            else upcoming.push(item2);
          }
        } else {
          var key3 = t.id + "_" + d;
          if (!seen.has(key3) && !skipped[key3]) {
            seen.add(key3);
            var item3 = Object.assign({}, t, { _date: d, _occKey: key3, _isRecur: false });
            if (d < todayDs) overdue.push(item3);
            else upcoming.push(item3);
          }
        }
      });
    });
    overdue.sort(function(a, b) { return a._date.localeCompare(b._date); });
    upcoming.sort(function(a, b) { return a._date.localeCompare(b._date); });
    return { overdue, upcoming };
  };

  const { overdue, upcoming } = buildAllTasks();

  const byDate = {};
  upcoming.forEach(function(t) { if (!byDate[t._date]) byDate[t._date] = []; byDate[t._date].push(t); });
  const sortedDates = Object.keys(byDate).sort();

  const dayHeading = function(ds) {
    var d = new Date(ds + "T12:00:00");
    var todayDs = td();
    var tomorrowD = new Date(); tomorrowD.setDate(tomorrowD.getDate() + 1);
    var tomorrowDs = fmtDate(tomorrowD);
    if (ds === todayDs) return "Today — " + DAYS_FULL[d.getDay()];
    if (ds === tomorrowDs) return "Tomorrow — " + DAYS_FULL[d.getDay()];
    return DAYS_FULL[d.getDay()] + " " + d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  };

  const add = () => {
    if (!text.trim()) return;
    const id = Date.now();
    const newTask = { id, text, cat, done: false, date, time, rep };
    setTasks(p => ({ ...p, [date]: [...(p[date] || []), newTask] }));
    if (time) {
      const planEv = { id: id + 1, title: "📋 " + text, color: VIO, time, dur: "30", rep: "none", _taskId: id };
      setEvs(p => ({ ...p, [date]: [...(p[date] || []), planEv] }));
      if (rep === "weekly") {
        var origin = new Date(date + "T12:00:00");
        for (var w = 1; w <= 4; w++) {
          var occ = new Date(origin); occ.setDate(origin.getDate() + w * 7);
          var occDs = fmtDate(occ);
          (function(ds) { setEvs(p => ({ ...p, [ds]: [...(p[ds] || []), Object.assign({}, planEv, { id: id + 1 + w })] })); })(occDs);
        }
      }
      if (rep === "daily") {
        var origin2 = new Date(date + "T12:00:00");
        for (var dd = 1; dd <= 7; dd++) {
          var occ2 = new Date(origin2); occ2.setDate(origin2.getDate() + dd);
          var occDs2 = fmtDate(occ2);
          (function(ds) { setEvs(p => ({ ...p, [ds]: [...(p[ds] || []), Object.assign({}, planEv, { id: id + 1 + dd })] })); })(occDs2);
        }
      }
    }
    setText(""); setTime("");
  };

  const tick = (t) => {
    if (t._isRecur) {
      // Only dismiss this specific occurrence — store skip key, leave series intact
      setSkipped(p => ({ ...p, [t._occKey]: true }));
    } else {
      // One-time task — mark done and remove
      setTasks(p => ({ ...p, [t._date]: (p[t._date] || []).map(x => x.id === t.id ? { ...x, done: true } : x) }));
      setEvs(p => { const u = {}; Object.entries(p).forEach(([d, arr]) => { u[d] = (arr || []).filter(ev => ev._taskId !== t.id); }); return u; });
      setTimeout(() => setTasks(p => ({ ...p, [t._date]: (p[t._date] || []).filter(x => x.id !== t.id) })), 500);
    }
  };

  const del = (t) => {
    // Delete entire series (or one-time task)
    const origDate = Object.keys(tasks).find(d => (tasks[d] || []).some(x => x.id === t.id));
    if (origDate) setTasks(p => ({ ...p, [origDate]: (p[origDate] || []).filter(x => x.id !== t.id) }));
    setEvs(p => { const u = {}; Object.entries(p).forEach(([d, arr]) => { u[d] = (arr || []).filter(ev => ev._taskId !== t.id); }); return u; });
    // Also clear any skips for this task
    setSkipped(p => { const u = {}; Object.entries(p).forEach(([k, v]) => { if (!k.startsWith(t.id + "_")) u[k] = v; }); return u; });
  };

  const TaskRow = ({ t, isOverdue }) => (
    <div key={t._occKey} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 14px", background: isOverdue ? "rgba(239,68,68,0.06)" : CARD, border: "1px solid " + (isOverdue ? "#ef444433" : BOR), borderRadius: 9, marginBottom: 6 }}>
      <Box done={false} col={isOverdue ? "#ef4444" : LIME} click={() => tick(t)} />
      <div style={{ flex: 1 }}>
        <div style={{ color: TEXT, fontSize: 14, fontWeight: 500 }}>{t.text}</div>
        <div style={{ fontSize: 10, color: LOW, fontFamily: "monospace", marginTop: 2 }}>
          {t.cat && t.cat !== "General" ? t.cat + " · " : ""}
          {t.time ? t.time + " · " : ""}
          {t.rep !== "none" ? "↻ " + t.rep : ""}
          {t.time && <span style={{ color: VIO, marginLeft: 4 }}>🔔</span>}
          {t._isRecur && <span style={{ color: LOW, marginLeft: 4, fontStyle: "italic" }}>recurring</span>}
        </div>
      </div>
      <button onClick={() => del(t)} style={{ background: "none", border: "none", color: LOW, cursor: "pointer", fontSize: 16, padding: "4px 6px" }}>×</button>
    </div>
  );

  const totalActive = overdue.length + upcoming.length;

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 16px 16px" }}>
      <SH right={<span style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 18, color: LIME }}>{totalActive} active</span>}>Tasks</SH>
      <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 10, padding: 12, marginBottom: 14, flexShrink: 0 }}>
        <In value={text} onChange={e => setText(e.target.value)} placeholder="What needs doing?" style={{ marginBottom: 8 }} onKeyDown={e => e.key === "Enter" && add()} />
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
          <Sel value={cat} onChange={e => setCat(e.target.value)} style={{ flex: 1, minWidth: 120 }}>
            {["General","Work","Health","Personal","Learning"].map(c => <option key={c}>{c}</option>)}
          </Sel>
          <Sel value={rep} onChange={e => setRep(e.target.value)} style={{ flex: 1, minWidth: 90 }}>
            <option value="none">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option>
          </Sel>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 120 }}>
            <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace", marginBottom: 3 }}>DATE</div>
            <In type="date" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div style={{ flex: 1, minWidth: 100 }}>
            <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace", marginBottom: 3 }}>TIME (optional reminder)</div>
            <In type="time" value={time} onChange={e => setTime(e.target.value)} />
          </div>
          <Btn onClick={add} style={{ padding: "9px 18px", flexShrink: 0 }}>+ Add</Btn>
        </div>
        {time && <div style={{ fontSize: 11, color: VIO, marginTop: 6 }}>🔔 Reminder {rep !== "none" ? "(" + rep + ")" : date}{time ? " at " + time : ""}</div>}
      </div>

      <div style={{ flex: 1, overflowY: "auto" }}>
        {/* ── Overdue section ── */}
        {overdue.length > 0 && (
          <div style={{ marginBottom: 22 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, paddingBottom: 6, borderBottom: "1px solid #ef444433" }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: "#ef4444", fontFamily: "monospace", textTransform: "uppercase", letterSpacing: "0.08em" }}>⚠ Overdue</span>

        <div>
          <div style={{ fontWeight: 700, fontSize: 15 }}>{labelPrefix}{g.opponent}</div>
          <div style={{ fontSize: 11, color: LOW, fontFamily: "monospace", marginTop: 2 }}>{g.date}</div>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontWeight: 800, fontSize: 22, fontFamily: "monospace", color: LIME }}>{g.myPts || 0}</span>
          <span style={{ color: LOW, fontSize: 14 }}>–</span>
          <span style={{ fontWeight: 800, fontSize: 22, fontFamily: "monospace", color: MID }}>{g.oppPts || 0}</span>

      </div>
      <div style={{ display: "flex", background: SURF, borderRadius: 8, overflow: "hidden" }}>

          <div key={l} style={{ flex: 1, textAlign: "center", padding: "10px 4px", borderRight: "1px solid " + BOR }}>

            <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace", marginTop: 2 }}>{l}</div>
          </div>
        ))}

      {g.notes && (
        <div style={{ marginTop: 10 }}>
          <button onClick={() => setOpen(!open)} style={{ background: "none", border: "none", color: AMB, cursor: "pointer", fontSize: 11, fontFamily: "monospace", padding: 0 }}>{open ? "▾ HIDE THOUGHTS" : "▸ SHOW THOUGHTS"}</button>

}

function LogSummary({ list }) {
  if (!list.length) return null;
  const w = list.filter(g => num(g.myPts) > num(g.oppPts)).length;
  const avg = f => (list.reduce((a, g) => a + num(g[f]), 0) / list.length).toFixed(1);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(80px,1fr))", gap: 8, marginBottom: 18 }}>
      <Stat label="Record" value={w + "-" + (list.length - w)} col={LIME} />
      <Stat label="PPG" value={avg("pts")} col={CYN} />
      <Stat label="RPG" value={avg("reb")} col={AMB} />
      <Stat label="APG" value={avg("ast")} col={VIO} />
    </div>
  );
}

function Bball() {
  const [bTab, setBTab] = useState("games");
  const [trainLog, setTrainLog] = useS("trainingLog", {});
  const [games, setGames]           = useS("games", []);
  const [scrimmages, setScrimmages] = useS("scrimmages", []);
  const [addG, setAddG] = useState(false);
  const [addS, setAddS] = useState(false);
  const EMPTY = { date: td(), opponent: "", myPts: "", oppPts: "", pts: "", reb: "", ast: "", stl: "", blk: "", notes: "" };
  const [ng, setNg] = useState(EMPTY);
  const [ns, setNs] = useState(EMPTY);

  const logDate = (d) => setTrainLog(p => ({ ...p, [d]: { ...(p[d] || {}), games: true } }));
  const saveG = () => { if (!ng.opponent.trim()) return; setGames(p => [{ ...ng, id: Date.now() }, ...p]); logDate(ng.date); setAddG(false); setNg({ ...EMPTY, date: td() }); };
  const saveS = () => { if (!ns.opponent.trim()) return; setScrimmages(p => [{ ...ns, id: Date.now() }, ...p]); logDate(ns.date); setAddS(false); setNs({ ...EMPTY, date: td() }); };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 24px 24px" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexShrink: 0, alignItems: "center", flexWrap: "wrap" }}>
        <h2 style={{ fontSize: 18, fontWeight: 700, marginRight: 6 }}>🏀 Basketball</h2>
        {[["games","🏟 Games"],["scrim","🔥 Scrimmages"]].map(([v, l]) => <Chip key={v} on={bTab === v} col={PINK} click={() => setBTab(v)}>{l}</Chip>)}
      </div>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {bTab === "games" && (
          <div>
            <Btn onClick={() => setAddG(!addG)} v="pink" style={{ marginBottom: 14 }}>{addG ? "✕ Cancel" : "+ Log Game"}</Btn>
            {addG && <LogEntryForm data={ng} setData={setNg} onSave={saveG} saveLabel="Save Game" oppPlaceholder="vs Team Name" />}
            <LogSummary list={games} />
            {games.length === 0 && !addG && <div style={{ color: LOW, textAlign: "center", padding: 48, fontSize: 14 }}>No games logged yet. Tap "+ Log Game" after your next one.</div>}
            {games.map(g => <LogEntryCard key={g.id} g={g} labelPrefix="vs " onDelete={() => setGames(p => p.filter(x => x.id !== g.id))} />)}
          </div>
        )}
        {bTab === "scrim" && (
          <div>
            <Btn onClick={() => setAddS(!addS)} v="vio" style={{ marginBottom: 14 }}>{addS ? "✕ Cancel" : "+ Log Scrimmage"}</Btn>
            {addS && <LogEntryForm data={ns} setData={setNs} onSave={saveS} saveLabel="Save Scrimmage" oppPlaceholder="Pickup run, open gym, practice squad..." />}
            <LogSummary list={scrimmages} />
            {scrimmages.length === 0 && !addS && <div style={{ color: LOW, textAlign: "center", padding: 48, fontSize: 14 }}>No scrimmages logged yet. Any pickup run or practice run goes here.</div>}
            {scrimmages.map(g => <LogEntryCard key={g.id} g={g} labelPrefix="" onDelete={() => setScrimmages(p => p.filter(x => x.id !== g.id))} />)}
          </div>
        )}
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
function Mobility() {
  const EXERCISES = [
    { name: "90/90 Hip Stretch",         phase: "Hips",      duration: 90,  sets: "45s each side",  target: "Hip Flexors & Rotators",        cue: "Sit with front shin parallel to you, back shin pointing behind. Sit tall, lean slightly forward over front leg. Directly counters hip tightness from cutting and jumping.", why: "🏀 Key for ballers" },
    { name: "Kneeling Hip Flexor",        phase: "Hips",      duration: 90,  sets: "45s each side",  target: "Hip Flexors / Psoas",            cue: "Drop to a lunge, back knee down. Drive hips forward gently until you feel a pull in the front of your back hip. Squeeze your glute on the back leg. Tight hip flexors are the #1 issue for basketball players.", why: "🔥 Top priority" },
    { name: "World's Greatest Stretch",   phase: "Hips",      duration: 120, sets: "60s each side",  target: "Thoracic Spine, Hips, Groin",   cue: "Step into a deep lunge. Plant both hands inside your front foot. Drop your back knee, then rotate your inside arm up to the ceiling. Follow your hand with your eyes.", why: "⚡ Most bang for buck" },
    { name: "Pigeon Pose",                phase: "Glutes",    duration: 120, sets: "60s each side",  target: "Glutes / Piriformis",            cue: "From plank, bring one shin forward horizontally in front of you. Sink hips toward the floor. Walk hands forward and rest. Releases deep glute muscles hammered by lateral cuts and defensive slides.", why: "🏀 Key for ballers" },
    { name: "Thoracic Spine Rotation",    phase: "Back",      duration: 90,  sets: "45s each side",  target: "Mid & Upper Back",              cue: "Lie on your side, knees bent at 90°. Keep bottom arm extended, top hand behind your head. Rotate your top elbow toward the floor behind you. Follow with your eyes.", why: "👤 Posture recovery" },
    { name: "Child's Pose + Lat Reach",   phase: "Back",      duration: 60,  sets: "Hold",           target: "Lower Back, Lats, Hips",        cue: "Kneel and sit back toward your heels, arms extended forward. Walk hands to one side to stretch the opposite lat. Hold 30s each side. Decompresses the spine after basketball impact.", why: "😌 Pure relief" },
    { name: "Seated Hamstring Stretch",   phase: "Legs",      duration: 90,  sets: "45s each side",  target: "Hamstrings",                    cue: "Sit with one leg out, one foot tucked in. Hinge at the hips and reach toward your foot — keep chest tall, don't round your back. Hamstrings absorb massive force in basketball.", why: "🚨 Injury prevention" },
    { name: "Standing Calf / Achilles",   phase: "Legs",      duration: 60,  sets: "30s each side",  target: "Calves, Achilles, Ankles",      cue: "Stand with toes on a slight elevation, heel hanging. Let the heel drop slowly. Also do a bent-knee version to hit the soleus. Protecting the Achilles tendon is crucial — it's the most common serious injury in recreational basketball.", why: "🚨 Injury prevention" },
    { name: "Diaphragmatic Breathing",    phase: "Wind Down", duration: 120, sets: "10 slow breaths", target: "Nervous System",               cue: "Lie on your back, one hand on chest, one on belly. Breathe IN through the nose for 4 counts — belly rises, chest stays still. OUT for 6 counts through the mouth. Activates the parasympathetic nervous system, lowering cortisol for better recovery.", why: "😴 Sleep quality boost" },
  ];
  const PHASES = ["Hips", "Glutes", "Back", "Legs", "Wind Down"];
  const PHASE_COL = { Hips: LIME, Glutes: CYN, Back: VIO, Legs: AMB, "Wind Down": TEAL };
  const TOTAL_TIME = EXERCISES.reduce((s, e) => s + e.duration, 0);

  const [idx, setIdx]         = useState(0);
  const [timeLeft, setTimeLeft] = useState(EXERCISES[0].duration);
  const [running, setRunning]   = useState(false);
  const [done, setDone]         = useState(new Set());
  const [complete, setComplete] = useState(false);
  const intervalRef = useRef(null);

  const ex = EXERCISES[idx];
  const circ = 2 * Math.PI * 54;
  const pct  = (ex.duration - timeLeft) / ex.duration;
  const offset = circ - pct * circ;
  const ringCol = pct > 0.75 ? TEAL : LIME;

  const fmtTime = s => { const m = Math.floor(s/60); const sc = s%60; return m + ":" + String(sc).padStart(2,"0"); };
  const totalDone = Array.from(done).length;
  const progressPct = EXERCISES.slice(0, idx).reduce((s, e) => s + e.duration, 0) / TOTAL_TIME * 100;

  const stopTimer = useCallback(() => {
    clearInterval(intervalRef.current);
    intervalRef.current = null;
    setRunning(false);
  }, []);

  const jumpTo = useCallback((i) => {
    stopTimer();
    setIdx(i);
    setTimeLeft(EXERCISES[i].duration);
    setRunning(false);
  }, [stopTimer]);

  const advanceExercise = useCallback((nextIdx) => {
    if (nextIdx < EXERCISES.length) {
      setIdx(nextIdx);
      setTimeLeft(EXERCISES[nextIdx].duration);
    } else {
      setComplete(true);
      setRunning(false);
    }
  }, []);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(intervalRef.current);
          intervalRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            setRunning(r => {
              if (r) return r; // already stopped
              return r;
            });
            advanceExercise(idx + 1);
            setRunning(true);
          }, 800);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running, idx, advanceExercise]);

  const toggle = () => setRunning(r => !r);
  const reset = () => { stopTimer(); setIdx(0); setTimeLeft(EXERCISES[0].duration); setDone(new Set()); setComplete(false); };

  if (complete) return (
    <div style={{ height: "100%", overflowY: "auto", padding: "32px 24px", textAlign: "center" }}>
      <div style={{ fontSize: 56, marginBottom: 16 }}>🔥</div>
      <h2 style={{ fontSize: 28, fontWeight: 700, color: TEAL, marginBottom: 8 }}>Session Complete</h2>
      <p style={{ color: MID, fontSize: 14, lineHeight: 1.7, marginBottom: 28, maxWidth: 320, margin: "0 auto 28px" }}>15 minutes done. Your joints and muscles will thank you tomorrow — especially those knees and hips.</p>
      <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 32 }}>
        {[["9", "Exercises"], ["15", "Minutes"], ["✓", "Recovered"]].map(([val, lbl]) => (
          <div key={lbl} style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: "14px 20px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: LIME, fontFamily: "monospace" }}>{val}</div>
            <div style={{ fontSize: 10, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 3 }}>{lbl}</div>
          </div>
        ))}
      </div>
      <Btn onClick={reset} style={{ width: "100%", padding: 14, fontSize: 15 }}>↺ Do It Again</Btn>
    </div>
  );

  return (
    <div style={{ height: "100%", overflowY: "auto", padding: "16px 16px 32px" }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <h2 style={{ fontSize: 18, fontWeight: 700, flex: 1 }}>🧘 Mobility</h2>
        <div style={{ fontSize: 11, color: MID, fontFamily: "monospace" }}>{fmtTime(TOTAL_TIME - EXERCISES.slice(0,idx).reduce((s,e)=>s+e.duration,0))} left</div>
      </div>

      {/* Overall progress bar */}
      <PBar pct={progressPct} col={LIME} h={4} />
      <div style={{ height: 14 }} />

      {/* Phase tabs */}
      <div style={{ display: "flex", gap: 5, marginBottom: 14, flexWrap: "wrap" }}>
        {PHASES.map(p => {
          const phExs = EXERCISES.filter(e => e.phase === p);
          const allDone = phExs.every(e => done.has(EXERCISES.indexOf(e)));
          const isCur = ex.phase === p;
          const col = allDone ? TEAL : isCur ? (PHASE_COL[p] || LIME) : null;
          return (
            <div key={p} style={{ padding: "4px 10px", borderRadius: 7, fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", border: "1px solid " + (col ? col + "66" : BOR), background: col ? col + "18" : SURF, color: col || LOW, cursor: "default" }}>
              {allDone ? "✓ " : ""}{p}
            </div>
          );
        })}
      </div>

      {/* Timer ring */}
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
        <div style={{ position: "relative", width: 128, height: 128 }}>
          <svg width="128" height="128" viewBox="0 0 128 128" style={{ position: "absolute", inset: 0, transform: "rotate(-90deg)" }}>
            <circle cx="64" cy="64" r="54" fill="none" stroke={BOR} strokeWidth="7" />
            <circle cx="64" cy="64" r="54" fill="none" stroke={ringCol} strokeWidth="7" strokeLinecap="round"
              strokeDasharray={circ} strokeDashoffset={offset}
              style={{ transition: "stroke-dashoffset 1s linear, stroke 0.3s", filter: "drop-shadow(0 0 5px " + ringCol + "99)" }} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <div style={{ fontSize: 34, fontWeight: 800, fontFamily: "monospace", lineHeight: 1 }}>{fmtTime(timeLeft)}</div>
            <div style={{ fontSize: 9, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 3 }}>{running ? "running" : timeLeft === ex.duration ? "ready" : "paused"}</div>
          </div>
        </div>
      </div>

      {/* Current exercise card */}
      <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 14, padding: "16px 18px", marginBottom: 12, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: 3, background: PHASE_COL[ex.phase] || LIME, borderRadius: "3px 0 0 3px" }} />
        <div style={{ fontSize: 10, color: PHASE_COL[ex.phase] || LIME, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>
          Exercise {idx+1} of {EXERCISES.length}
        </div>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 8 }}>{ex.name}</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          <span style={{ background: (PHASE_COL[ex.phase]||LIME)+"22", border: "1px solid "+(PHASE_COL[ex.phase]||LIME)+"44", borderRadius: 6, padding: "3px 10px", fontSize: 11, color: PHASE_COL[ex.phase]||LIME, fontWeight: 600 }}>{ex.sets}</span>
          <span style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 6, padding: "3px 10px", fontSize: 11, color: MID }}>{ex.target}</span>
          <span style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 6, padding: "3px 10px", fontSize: 11, color: MID }}>{ex.why}</span>
        </div>
        <p style={{ fontSize: 13, color: MID, lineHeight: 1.65 }}>{ex.cue}</p>
      </div>

      {/* Next up */}
      {idx < EXERCISES.length - 1 && (
        <div style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 10, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontSize: 10, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", flexShrink: 0 }}>Next</div>
          <div style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{EXERCISES[idx+1].name}</div>
          <div style={{ fontSize: 12, color: LOW, fontFamily: "monospace", flexShrink: 0 }}>{fmtTime(EXERCISES[idx+1].duration)}</div>
        </div>
      )}

      {/* Controls */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <Btn onClick={() => jumpTo(Math.max(0, idx-1))} v="sec" style={{ padding: "10px 16px" }} disabled={idx === 0}>‹ Back</Btn>
        <Btn onClick={toggle} style={{ flex: 1, padding: 12, fontSize: 15 }}>{running ? "⏸ Pause" : timeLeft === ex.duration ? "▶ Start" : "▶ Resume"}</Btn>
        <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); jumpTo(Math.min(EXERCISES.length-1, idx+1)); if(idx===EXERCISES.length-1){setComplete(true);} }} v="sec" style={{ padding: "10px 16px" }} disabled={idx === EXERCISES.length-1}>Skip ›</Btn>
      </div>

      {/* Exercise list */}
      <FL>Full Routine</FL>
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {EXERCISES.map((e, i) => {
          const isDone = done.has(i);
          const isCur  = i === idx;
          return (
            <div key={i} onClick={() => jumpTo(i)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: isCur ? (LIME+"12") : CARD, border: "1px solid "+(isCur ? LIME+"55" : BOR), borderRadius: 10, cursor: "pointer", opacity: isDone ? 0.45 : 1, transition: "all .15s" }}>
              <div style={{ width: 22, textAlign: "center", fontSize: 13, fontFamily: "monospace", fontWeight: 700, color: isCur ? LIME : LOW, flexShrink: 0 }}>{isDone ? "✓" : i+1}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: isCur ? TEXT : MID }}>{e.name}</div>
                <div style={{ fontSize: 11, color: LOW }}>{e.phase} · {e.target}</div>
              </div>
              <div style={{ fontSize: 12, color: LOW, fontFamily: "monospace", flexShrink: 0 }}>{fmtTime(e.duration)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const MISTAKES = [

    { icon: "✋", bad: "Guide Hand Interference", fix: "The off-hand pushes the ball at release, causing random left/right misses. Fix: Practice the one-hand-only drill daily. Your guide hand drops OFF the ball before release — it's a stabilizer, not a launcher." },
    { icon: "📉", bad: "Flat Arc (Line Drive)", fix: "Ball travels too flat — needs higher arc for a larger entry window into the basket. Optimal arc is 45–55°. Fix: Aim at a spot significantly above your target on the wall." },
    { icon: "👣", bad: "Jumping Sideways or Backward", fix: "Drifting on the jump shot kills consistency. Fix: Shoot at the ceiling and watch where you land. You should land within 2 inches of takeoff. Drift = wasted energy." },

              <div key={i} onClick={() => setOpen(open===i ? null : i)} style={{ background:CARD, border:"1px solid "+(open===i ? AMB+"88" : BOR), borderRadius:12, overflow:"hidden", cursor:"pointer", transition:"border-color .2s" }}>
                <div style={{ display:"flex", alignItems:"center", gap:14, padding:"14px 16px" }}>
                  <div style={{ fontSize:30, fontWeight:900, color:AMB, fontFamily:"monospace", lineHeight:1, minWidth:30 }}>{b.letter}</div>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:15, fontWeight:700 }}>{b.word}</div>
                    <div style={{ fontSize:12, color:LOW, marginTop:2 }}>{b.tagline}</div>
                  </div>
                  <div style={{ color:LOW, fontSize:13, transition:"transform .25s", transform: open===i ? "rotate(180deg)" : "none" }}>▼</div>
                </div>
                {open===i && (
                  <div style={{ borderTop:"1px solid "+BOR, padding:"12px 16px 14px" }}>

                  </div>

          </div>
        </div>

      {inner === "drills" && (
        <div>

            <div style={{ textAlign:"center", padding:"32px 0" }}>
              <div style={{ fontSize:56, marginBottom:14 }}>🏀</div>
              <div style={{ fontSize:24, fontWeight:700, color:AMB, marginBottom:8 }}>Shot Work Done</div>
              <div style={{ fontSize:13, color:MID, lineHeight:1.65, marginBottom:24 }}>Every rep is now stored in your muscle memory. Form reps without a net build cleaner mechanics than shooting at a basket.</div>
              <div style={{ display:"flex", gap:10, justifyContent:"center", marginBottom:24 }}>
                {[["6","Drills"],["~200","Reps"],["🔁","Daily"]].map(([v,l]) => (
                  <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:10, padding:"12px 18px", textAlign:"center" }}>
                    <div style={{ fontSize:22, fontWeight:700, color:AMB, fontFamily:"monospace" }}>{v}</div>

            </div>
          ) : (

              <PBar pct={ovrPct} col={AMB} h={3} />
              <div style={{ height:12 }} />

                <div style={{ fontSize:22, fontWeight:800, color:TEXT, marginBottom:12 }}>{dr.name}</div>
                <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:12 }}>

              </div>
              {/* next */}
              {idx < DRILLS.length-1 && (
                <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:14, display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
                  <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{DRILLS[idx+1].name}</div>
                  <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(DRILLS[idx+1].duration)}</div>

              )}
              {/* list */}
              <FL>Full Session</FL>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {DRILLS.map((d,i) => (
                  <div key={i} onClick={() => jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background: i===idx ? AMB+"18" : CARD, border:"1px solid "+(i===idx ? AMB+"66" : BOR), borderRadius:10, cursor:"pointer", opacity: done.has(i) ? 0.4 : 1, transition:"all .15s" }}>
                    <div style={{ width:22, textAlign:"center", fontSize:13, fontFamily:"monospace", fontWeight:700, color: i===idx ? AMB : LOW, flexShrink:0 }}>{done.has(i) ? "✓" : i+1}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13, fontWeight:600, color: i===idx ? TEXT : MID }}>{d.name}</div>
                      <div style={{ fontSize:11, color:LOW }}>{d.phase} · {d.focus}</div>
                    </div>
                    <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(d.duration)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── MISTAKES ── */}
      {inner === "mistakes" && (
        <div>
          <div style={{ background:"#1a0e00", border:"1px solid "+AMB+"44", borderRadius:14, padding:18, marginBottom:14 }}>
            <div style={{ fontSize:10, color:AMB, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.15em", marginBottom:6 }}>At-Home Diagnosis</div>
            <div style={{ fontSize:18, fontWeight:700, color:TEXT, marginBottom:6 }}>5 Most Common Form Killers</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>Without a coach watching you, these are the errors that sneak in and become permanent habits. Use a mirror or phone camera to self-diagnose.</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            {MISTAKES.map((m,i) => (
              <div key={i} style={{ display:"flex", gap:12, alignItems:"flex-start", padding:"12px 14px", background:CARD, border:"1px solid "+BOR, borderRadius:12 }}>
                <div style={{ fontSize:18, flexShrink:0, marginTop:1 }}>{m.icon}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:"#f87171", marginBottom:3 }}>✗ {m.bad}</div>
                  <div style={{ fontSize:12, color:MID, lineHeight:1.5 }}><span style={{ color:LIME, fontWeight:700 }}>Fix: </span>{m.fix}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ISOMETRIC ROUTINE

function Isometric() {
  const EXERCISES = [
    { name: "Wall Sit", icon: "🦵", targets: ["Quads", "Patellar Tendon", "Glutes"], highlight: "Patellar Tendon", hold: "45s hold", sets: "1 set", rpe: 7, duration: 45, science: "Tendon rehab", col: CYN, cue: "Back flat on wall, thighs parallel to floor — or as low as you can go without pain. Drive your feet into the floor like you're trying to push it away. Squeeze your quads as hard as possible. 45s at high effort promotes collagen synthesis in the patellar tendon, reducing jumper's knee pain for hours after." },
    { name: "Isometric Split Squat", icon: "⚡", targets: ["Single-Leg Quads", "Hip Stability", "Knee Tendon"], highlight: "Hip Stability", hold: "35s each leg", sets: "1 set per side", rpe: 7, duration: 70, science: "COD strength", col: "#06b6d4", cue: "Step into a lunge, lower until front thigh is near parallel. Hold still. No bouncing. Front knee tracks over your 2nd toe. The most important isometric for change-of-direction speed — research on pro basketball players showed significant COD improvement after a season of this drill alone." },
    { name: "Isometric Glute Bridge", icon: "🍑", targets: ["Glutes", "Hamstrings", "Lower Back"], highlight: "Glutes", hold: "45s hold", sets: "1 set", rpe: 6, duration: 45, science: "Hip strength", col: LIME, cue: "Lie on your back, feet flat, drive hips up to a straight line from shoulders to knees. Squeeze glutes as hard as possible at the top. Weak hip strength is the #2 cause of basketball knee pain — building this takes stress off the knee joint on every landing." },
    { name: "Plank Hold", icon: "🧱", targets: ["Core", "Shoulders", "Spinal Stability"], highlight: "Core", hold: "45s hold", sets: "1 set", rpe: 6, duration: 45, science: "Core stability", col: VIO, cue: "Elbows under shoulders, body in a straight line. Don't let your hips sag or pike. Pull your belly button toward your spine and squeeze your glutes. Core stability transfers directly to balance on defense — the reason elite defenders stay grounded when bumped." },

    { name: "Wall Press Isometric", icon: "💪", targets: ["Shoulders", "Chest", "Serratus"], highlight: "Shoulders", hold: "40s hold", sets: "1 set", rpe: 6, duration: 40, science: "Shooting strength", col: PINK, cue: "Place both palms flat on a wall, arms extended. Press INTO the wall as hard as you can — the wall doesn't move, but your muscles fire maximally. Keep shoulder blades wide and stable. This builds the shoulder stability that improves late-game shooting accuracy when you're fatigued." },

  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(EXERCISES[i].duration); };
  const resetAll = () => { stopT(); setIdx(0); setTimeLeft(EXERCISES[0].duration); setDone(new Set()); setComplete(false); };

  useEffect(() => {
    if (!running) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx + 1 < EXERCISES.length) { setIdx(idx+1); setTimeLeft(EXERCISES[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 900);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx]);

  const ovrPct = EXERCISES.slice(0,idx).reduce((s,e)=>s+e.duration,0) / TOTAL * 100;
  const exPct  = ex ? (ex.duration - timeLeft) / ex.duration * 100 : 0;

  if (complete) return (
    <div style={{ height:"100%", overflowY:"auto", padding:"32px 24px", textAlign:"center" }}>
      <div style={{ fontSize:56, marginBottom:14 }}>⚡</div>
      <div style={{ fontSize:26, fontWeight:700, color:CYN, marginBottom:8 }}>Tendons Loaded</div>
      <div style={{ fontSize:13, color:MID, lineHeight:1.7, marginBottom:28, maxWidth:320, margin:"0 auto 28px" }}>5 minutes of science-backed isometric work. Research shows measurable tendon strength gains and knee pain reduction in 4–6 weeks.</div>
      <div style={{ display:"flex", gap:12, justifyContent:"center", marginBottom:32 }}>
        {[["6","Exercises"],["5:00","Duration"],["∞","Daily"]].map(([v,l]) => (
          <div key={l} style={{ background:CARD, border:"1px solid "+BOR, borderRadius:12, padding:"14px 20px", textAlign:"center" }}>
            <div style={{ fontSize:22, fontWeight:700, color:CYN, fontFamily:"monospace" }}>{v}</div>
            <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginTop:3 }}>{l}</div>
          </div>
        ))}
      </div>
      <Btn onClick={resetAll} style={{ width:"100%", padding:14 }}>↺ Run Again</Btn>
    </div>
  );

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <h2 style={{ fontSize:18, fontWeight:700, flex:1 }}>⚡ Isometric Routine</h2>
        <div style={{ fontSize:11, color:MID, fontFamily:"monospace" }}>5 min · 6 exercises</div>
      </div>

      {/* Research callout */}
      <div style={{ background:CARD, border:"1px solid "+BOR, borderLeft:"3px solid "+CYN, borderRadius:12, padding:"12px 16px", marginBottom:14, display:"flex", gap:10, alignItems:"flex-start" }}>
        <div style={{ fontSize:16, flexShrink:0 }}>🔬</div>
        <div style={{ fontSize:12, color:MID, lineHeight:1.55 }}><span style={{ color:CYN, fontWeight:600 }}>Science-backed: </span>Isometric holds at 70%+ effort promote collagen synthesis in tendons. 4–6 weeks of daily practice shows measurable strength gains and pain reduction in recreational athletes.</div>
      </div>

      <PBar pct={ovrPct} col={CYN} h={3} />
      <div style={{ height:12 }} />

      {/* dots */}
      <div style={{ display:"flex", gap:5, marginBottom:16 }}>
        {EXERCISES.map((_,i) => <div key={i} onClick={() => jumpTo(i)} style={{ width:8, height:8, borderRadius:"50%", background: done.has(i) ? LIME : i===idx ? ex.col : BOR, border:"1px solid "+(i===idx ? ex.col : BOR), cursor:"pointer", boxShadow: i===idx ? "0 0 8px "+ex.col+"66" : "none", transition:"all .25s" }} />)}
      </div>

      {/* timer card */}
      <div style={{ background:CARD, border:"1px solid "+BOR, borderRadius:16, overflow:"hidden", marginBottom:12 }}>
        {/* top progress bar */}
        <div style={{ height:3, background:BOR, overflow:"hidden" }}>
          <div style={{ height:"100%", width:exPct+"%", background:"linear-gradient(90deg,"+ex.col+","+ex.col+"88)", transition:"width 1s linear" }} />
        </div>
        <div style={{ padding:18 }}>
          {/* target pills */}
          <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:12 }}>
            {ex.targets.map(t => (
              <span key={t} style={{ fontFamily:"monospace", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", padding:"3px 10px", borderRadius:99, border:"1px solid "+(t===ex.highlight ? ex.col+"55" : BOR), color: t===ex.highlight ? ex.col : LOW, background: t===ex.highlight ? ex.col+"18" : "transparent" }}>{t}</span>
            ))}
            <span style={{ fontFamily:"monospace", fontSize:10, textTransform:"uppercase", letterSpacing:"0.08em", padding:"3px 10px", borderRadius:99, border:"1px solid "+CYN+"44", color:CYN, background:CYN+"12" }}>⚗ {ex.science}</span>
          </div>
          <div style={{ fontSize:10, color:LOW, fontFamily:"monospace", textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>Exercise {idx+1} of {EXERCISES.length}</div>
          <div style={{ fontSize:24, fontWeight:800, marginBottom:14 }}>{ex.icon} {ex.name}</div>

          {/* timer + hold */}
          <div style={{ display:"flex", alignItems:"center", gap:16, marginBottom:14 }}>
            <div style={{ fontSize:60, fontWeight:700, fontFamily:"monospace", color: timeLeft<=5 ? "#ef4444" : timeLeft<=12 ? AMB : TEXT, lineHeight:1, minWidth:110, transition:"color .3s" }}>{fmtT(timeLeft)}</div>
            <div style={{ flex:1 }}>
              <div style={{ background:SURF, borderRadius:8, padding:"8px 12px", marginBottom:6 }}>
                <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:3 }}>Hold</div>
                <div style={{ fontSize:14, fontWeight:700 }}>{ex.hold} · {ex.sets}</div>
              </div>
              {/* RPE dots */}
              <div style={{ display:"flex", gap:3, alignItems:"center" }}>
                <div style={{ fontSize:9, color:LOW, marginRight:4 }}>RPE</div>
                {Array.from({length:10},(_,i) => (
                  <div key={i} style={{ width:8, height:8, borderRadius:"50%", background: i < ex.rpe ? (i >= 7 ? "#ef4444" : ex.col) : BOR, transition:"background .2s" }} />
                ))}
              </div>
            </div>
          </div>

          {/* tension bar */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:4 }}>Muscle Tension</div>
            <div style={{ height:6, background:BOR, borderRadius:99, overflow:"hidden" }}>
              <div style={{ height:"100%", width:exPct+"%", background:"linear-gradient(90deg,"+ex.col+","+ex.col+"88)", borderRadius:99, transition:"width 1s linear" }} />
            </div>
          </div>

          {/* cue */}
          <div style={{ background:SURF, borderRadius:8, padding:"10px 12px", borderLeft:"2px solid "+ex.col }}>
            <div style={{ fontSize:9, color:LOW, textTransform:"uppercase", letterSpacing:"0.12em", marginBottom:4 }}>Coaching Cue</div>
            <div style={{ fontSize:12, color:MID, lineHeight:1.6 }}>{ex.cue}</div>
          </div>
        </div>
      </div>

      {/* next */}
      {idx < EXERCISES.length-1 && (
        <div style={{ background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ fontSize:10, color:LOW, textTransform:"uppercase", letterSpacing:"0.1em", flexShrink:0 }}>Next</div>
          <div style={{ flex:1, fontSize:13, fontWeight:600 }}>{EXERCISES[idx+1].icon} {EXERCISES[idx+1].name}</div>
          <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{fmtT(EXERCISES[idx+1].duration)}</div>
        </div>
      )}

      {/* controls */}
      <div style={{ display:"flex", gap:8, marginBottom:16 }}>
        <Btn onClick={() => jumpTo(Math.max(0,idx-1))} v="sec" style={{ padding:"11px 16px" }} disabled={idx===0}>‹ Back</Btn>
        <Btn onClick={() => setRunning(r=>!r)} style={{ flex:1, padding:12, background: running ? "#334155" : CYN, color: running ? TEXT : "#000" }}>{running ? "⏸ Pause" : timeLeft===ex.duration ? "▶ Start" : "▶ Resume"}</Btn>
        <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); if(idx<EXERCISES.length-1){jumpTo(idx+1);}else{setComplete(true);} }} v="sec" style={{ padding:"11px 16px" }}>Skip ›</Btn>
      </div>

      {/* list */}
      <FL>Full Routine</FL>
      <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
        {EXERCISES.map((e,i) => (
          <div key={i} onClick={() => jumpTo(i)} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 14px", background: i===idx ? e.col+"18" : CARD, border:"1px solid "+(i===idx ? e.col+"66" : BOR), borderRadius:10, cursor:"pointer", opacity: done.has(i) ? 0.4 : 1, transition:"all .15s" }}>
            <div style={{ fontSize:16, flexShrink:0 }}>{e.icon}</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:600, color: i===idx ? TEXT : MID }}>{e.name}</div>
              <div style={{ fontSize:11, color:LOW }}>{e.hold} · RPE {e.rpe}/10</div>
            </div>
            <div style={{ fontSize:12, color:LOW, fontFamily:"monospace", flexShrink:0 }}>{done.has(i) ? "✓" : fmtT(e.duration)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
