  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="In The Lab" />

  <title>In The Lab</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- React + Babel loaded from CDN — no build step needed -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; height: 100dvh; background: #0a0800; overflow: hidden; -webkit-text-size-adjust: 100%; }
    #root { height: 100%; height: 100dvh; }
    /* iPhone safe areas */
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    /* Prevent iOS bounce */
    body { position: fixed; width: 100%; }
  </style>

  <!-- Service Worker for push notifications -->
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          window.__swReg = reg;
          console.log('SW registered');
        }).catch(err => console.log('SW failed:', err));
      });
    }

    // Global notification helper called from React
    window.scheduleNotification = function(title, body, delayMs) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      setTimeout(function() {
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'NOTIFY', title: title, body: body });
          } else {
            new Notification(title, { body: body, icon: '/icon.png' });
          }
        } catch(e) { try { new Notification(title, { body: body }); } catch(_) {} }
      }, Math.max(0, delayMs || 0));
    };

    window.requestNotifPermission = function() {
      if (!('Notification' in window)) return Promise.resolve('denied');
      return Notification.requestPermission();
    };

    // Schedule daily habit reminder (9am)
    window.scheduleDailyHabitReminder = function(enabled) {
      if (!enabled) return;
      const now = new Date();
      const target = new Date();
      target.setHours(9, 0, 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
      const delay = target - now;
      setTimeout(() => {
        window.scheduleNotification('Time to check your habits! ✅', "Open In The Lab and start your daily habits.", 0);
        window.scheduleDailyHabitReminder(true); // reschedule for tomorrow
      }, delay);
    };

    // Schedule a one-time event notification
    window.scheduleEventNotification = function(title, eventTimeStr, minsBeforeArr) {
      minsBeforeArr = minsBeforeArr || [60, 15];
      const eventTime = new Date(eventTimeStr);
      if (isNaN(eventTime)) return;
      minsBeforeArr.forEach(minsBefore => {
        const fireAt = new Date(eventTime.getTime() - minsBefore * 60000);
        const delay = fireAt - Date.now();
        if (delay > 0) {
          window.scheduleNotification(
            (minsBefore === 0 ? 'Starting now: ' : minsBefore + 'm: ') + title,
            'Tap to open In The Lab',
            delay
          );
        }
      });
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useRef, useCallback, useEffect } = React;


// ─── Storage ──────────────────────────────────────────────────────────
const S = {};
function write(k, v) {
  S[k] = v;
  try { localStorage.setItem("itl_" + k, JSON.stringify(v)); } catch (_) {}
}
function read(k, def) {
  if (k in S) return S[k];
  try { const r = localStorage.getItem("itl_" + k); if (r !== null) { S[k] = JSON.parse(r); return S[k]; } } catch (_) {}
  S[k] = def; return def;
}
function useS(k, def) {
  const [v, sv] = useState(() => read(k, def));
  const set = useCallback((x) => sv((p) => { const n = typeof x === "function" ? x(p) : x; write(k, n); return n; }), [k]);
  return [v, set];
}

// ─── Helpers ──────────────────────────────────────────────────────────
const fmtDate = (d) => (d || new Date()).toISOString().slice(0, 10);
const td = () => fmtDate();
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const num = (v) => parseFloat(v) || 0;
const fmt = (n) => Number(n).toLocaleString();

// ─── Colors ───────────────────────────────────────────────────────────
const BG    = "#0a0800";       // near-black with warm undertone
const SURF  = "#110e00";       // dark surface
const CARD  = "#181200";       // card background
const BOR   = "#2a1f00";       // border
const BORHI = "#3d2e00";       // highlighted border
const LIME  = "#ff7a00";       // PRIMARY ACCENT — orange
const VIO   = "#ffa040";       // secondary — amber-orange
const PINK  = "#ff4444";       // danger / red accent
const AMB   = "#ffcc00";       // gold / yellow
const CYN   = "#ff9933";       // warm orange-amber
const TEAL  = "#ffaa55";       // light orange
const TEXT  = "#ffffff";       // pure white text
const MID   = "#c4a882";       // warm mid-tone
const LOW   = "#5a4422";       // muted warm brown

// ─── Base UI ──────────────────────────────────────────────────────────
const IS = { background: "#1a1200", color: TEXT, border: "1px solid " + BOR, borderRadius: 7, padding: "8px 12px", fontSize: 13, width: "100%", fontFamily: "inherit" };

function In({ style, ...p }) { return <input style={{ ...IS, ...style }} {...p} />; }
function Ta({ style, ...p }) { return <textarea style={{ ...IS, resize: "vertical", lineHeight: 1.6, ...style }} {...p} />; }
function Sel({ style, ...p }) { return <select style={{ ...IS, ...style }} {...p} />; }

const BV = { p: { bg: LIME, col: "#fff" }, sec: { bg: SURF, col: MID, bor: BOR }, ghost: { bg: "transparent", col: MID, bor: BOR }, vio: { bg: VIO, col: "#fff" }, pink: { bg: PINK, col: "#fff" }, amb: { bg: AMB, col: "#0a0800" }, cyn: { bg: CYN, col: "#fff" }, teal: { bg: TEAL, col: "#0a0800" }, danger: { bg: "rgba(255,68,68,0.12)", col: PINK, bor: "rgba(255,68,68,0.3)" } };

function Btn({ children, onClick, v = "p", style, disabled }) {
  const s = BV[v] || BV.p;
  return (
    <button onClick={onClick} disabled={disabled} style={{ background: s.bg, color: s.col, border: s.bor ? "1px solid " + s.bor : "none", borderRadius: 8, padding: "8px 18px", fontWeight: 700, fontSize: 13, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, fontFamily: "inherit", ...style }}>
      {children}
    </button>
  );
}

function Chip({ children, on, click, col }) {
  const c = col || LIME;
  return (
    <button onClick={click} style={{ background: on ? c + "20" : SURF, color: on ? c : MID, border: "1px solid " + (on ? c + "55" : BOR), borderRadius: 6, padding: "4px 12px", fontSize: 12, fontWeight: on ? 700 : 400, cursor: "pointer", fontFamily: "inherit" }}>
      {children}
    </button>
  );
}

function Box({ done, col, click }) {
  const c = col || LIME;
  return (
    <div onClick={click} style={{ width: 20, height: 20, borderRadius: 5, flexShrink: 0, cursor: "pointer", border: "2px solid " + (done ? c : BOR), background: done ? c : "transparent", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, color: "#fff" }}>
      {done ? "✓" : ""}
    </div>
  );
}

function PBar({ pct, col, h }) {
  return (
    <div style={{ height: h || 4, background: BOR, borderRadius: 2, overflow: "hidden" }}>
      <div style={{ height: "100%", width: Math.min(100, pct || 0) + "%", background: col || LIME, borderRadius: 2, transition: "width .4s" }} />
    </div>
  );
}

function Stat({ label, value, col, sub }) {
  return (
    <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 10, padding: "12px 14px", textAlign: "center" }}>
      <div style={{ fontSize: 20, fontWeight: 700, color: col || LIME, fontFamily: "monospace" }}>{value}</div>
      <div style={{ fontSize: 11, color: LOW, marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 10, color: col || LIME, marginTop: 2, opacity: 0.75 }}>{sub}</div>}
    </div>
  );
}

function SH({ children, right }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
      <h2 style={{ fontSize: 18, fontWeight: 700 }}>{children}</h2>
      {right}
    </div>
  );
}

function FL({ children }) {
  return <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.13em", textTransform: "uppercase", color: LOW, marginBottom: 5, fontFamily: "monospace" }}>{children}</div>;
}

function Modal({ onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.72)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 9999 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: CARD, border: "1px solid " + BORHI, borderRadius: 14, padding: 24, width: 360, maxWidth: "93vw", maxHeight: "85vh", overflowY: "auto" }}>
        {children}
      </div>
    </div>
  );
}

// ─── Vial Logo ────────────────────────────────────────────────────────
let VI = 0;
function Vial({ size = 26 }) {

        <linearGradient id={id + "b"} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={VIO} />
          <stop offset="100%" stopColor={LIME} />
        </linearGradient>
      </defs>
      <rect x="10" y="5" width="8" height="18" rx="4" fill="#151e30" />
      <rect x="10" y="14" width="8" height="9" rx="4" fill={"url(#" + id + "b)"} />
      <rect x="10" y="12" width="8" height="3" fill={"url(#" + id + "b)"} opacity=".5" />
      <circle cx="13" cy="17" r="1" fill="white" opacity=".4" />
      <circle cx="16" cy="20" r=".6" fill="white" opacity=".3" />
      <rect x="9" y="2" width="10" height="5" rx="2" fill={"url(#" + id + "a)"} />
      <line x1="10" y1="11" x2="12" y2="11" stroke="white" strokeWidth=".8" opacity=".3" />
      <line x1="10" y1="15" x2="12" y2="15" stroke="white" strokeWidth=".8" opacity=".3" />
      <rect x="11.5" y="6" width="1.5" height="10" rx=".75" fill="white" opacity=".08" />
    </svg>

}

// ═════════════════════════════════════════════════════════════════════
// HOME
// ═════════════════════════════════════════════════════════════════════
function Home({ go }) {
  const [prof, setProf] = useS("prof", { name: "", age: "", height: "", weight: "", pos: "", team: "", goal: "", bio: "", photo: "" });
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(prof);
  const ref = useRef(null);

  const [habits] = useS("habits", []);
  const [hc]     = useS("hc",     {});
  const [tasks]  = useS("tasks",  {});
  const [games]  = useS("games",  []);
  const [gym]    = useS("gym",    {});
  const [cal]    = useS("cal",    {});
  const [jnl]    = useS("jnl",    {});
  const [sleep]  = useS("sleep",  {});
  const [prs]    = useS("prs",    []);

  const today = td();
  const hDone   = habits.filter(h => (hc[today] || {})[h.id]).length;
  const dayT    = tasks[today] || [];
  const tDone   = dayT.filter(t => t.done).length;
  const cals    = ((cal[today] || {}).meals || []).reduce((a, m) => a + num(m.cal), 0);
  const steps   = num((cal[today] || {}).steps);
  const wins    = games.filter(g => num(g.myPts) > num(g.oppPts)).length;
  const gSess   = Object.keys(gym).length;
  const wDates  = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - d.getDay() + i); return fmtDate(d); });
  const jDone   = wDates.filter(d => jnl[d]).length;
  const todSleep = sleep[today];

  const up = k => e => setDraft(p => ({ ...p, [k]: e.target.value }));
  const save = () => { setProf(draft); setEditing(false); };
  const onPic = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => setDraft(p => ({ ...p, photo: ev.target.result })); r.readAsDataURL(f); };

  const NAVS = [
    { id: "planner",  icon: "📅", label: "Planner",      col: LIME,  info: "Daily, weekly & monthly" },
    { id: "habits",   icon: "✅", label: "Habits",        col: CYN,   info: hDone + "/" + habits.length + " done today" },
    { id: "tasks",    icon: "📋", label: "Tasks",         col: VIO,   info: tDone + "/" + dayT.length + " complete" },
    { id: "gym",      icon: "🏋️", label: "Gym",           col: AMB,   info: gSess + " sessions logged" },
    { id: "bball",    icon: "🏀", label: "Basketball",    col: PINK,  info: wins + " wins this season" },
    { id: "cals",     icon: "🔥", label: "Calories",      col: "#ff8c42", info: cals ? fmt(cals) + " kcal today" : "Not logged" },
    { id: "recovery", icon: "🛌", label: "Recovery",      col: CYN,   info: todSleep ? todSleep.h + "h sleep" : "Log recovery" },
    { id: "metrics",  icon: "📏", label: "Measurables",   col: LIME,  info: "Body, athletic & lift PRs" },
    { id: "film",     icon: "🎬", label: "Film Room",     col: VIO,   info: "Coaching notes & film" },
    { id: "reflect",  icon: "📓", label: "Reflections",   col: "#a78fff", info: jDone + "/7 entries this week" },
    { id: "activities",   icon: "🏃", label: "Activities",     col: LIME,  info: "6 routines — mobility, shooting & more" },
  ];

  return (
    <div style={{ height: "100%", overflowY: "auto", padding: "24px 28px" }}>
      {/* hero */}
      <div style={{ background: "linear-gradient(135deg,#120a00,#1a1000,#0a0700)", border: "1px solid " + BORHI, borderRadius: 16, padding: 24, marginBottom: 24, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", top: -60, right: -60, width: 200, height: 200, borderRadius: "50%", background: "radial-gradient(circle,rgba(255,122,0,.09),transparent 70%)", pointerEvents: "none" }} />
        <div style={{ display: "flex", gap: 22, alignItems: "flex-start", flexWrap: "wrap", position: "relative" }}>
          {/* photo */}
          <div style={{ position: "relative", flexShrink: 0 }}>
            <div onClick={() => editing && ref.current && ref.current.click()} style={{ width: 100, height: 100, borderRadius: 12, overflow: "hidden", border: "2px solid " + (editing ? LIME : BORHI), background: SURF, display: "flex", alignItems: "center", justifyContent: "center", cursor: editing ? "pointer" : "default" }}>
              {prof.photo ? <img src={prof.photo} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <div style={{ textAlign: "center", color: LOW }}><div style={{ fontSize: 32 }}>👤</div>{editing && <div style={{ fontSize: 9, marginTop: 3, fontFamily: "monospace" }}>UPLOAD</div>}</div>}
            </div>
            {editing && <div onClick={() => ref.current && ref.current.click()} style={{ position: "absolute", bottom: -8, right: -8, background: LIME, borderRadius: "50%", width: 26, height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, cursor: "pointer" }}>📷</div>}
            <input ref={ref} type="file" accept="image/*" onChange={onPic} style={{ display: "none" }} />
          </div>
          {/* info */}
          <div style={{ flex: 1, minWidth: 180 }}>
            {editing ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.name} onChange={up("name")} placeholder="Full Name" style={{ flex: 2, minWidth: 130, fontSize: 16, fontWeight: 700 }} />
                  <In value={draft.age} onChange={up("age")} placeholder="Age" style={{ width: 65 }} />
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.height} onChange={up("height")} placeholder="Height" />
                  <In value={draft.weight} onChange={up("weight")} placeholder="Weight (kg)" />
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <In value={draft.pos} onChange={up("pos")} placeholder="Position" />
                  <In value={draft.team} onChange={up("team")} placeholder="Team / School" />
                </div>
                <In value={draft.goal} onChange={up("goal")} placeholder="Main goal..." />
                <Ta value={draft.bio} onChange={up("bio")} placeholder="Short bio..." rows={2} />
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn onClick={save}>Save</Btn>
                  <Btn onClick={() => { setDraft(prof); setEditing(false); }} v="sec">Cancel</Btn>
                </div>
              </div>

              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>

                    <h1 style={{ fontSize: 24, fontWeight: 700 }}>{prof.name || "Your Name"}</h1>
                    {prof.pos && <div style={{ color: LIME, fontWeight: 600, fontSize: 13, marginTop: 2 }}>{prof.pos}{prof.team ? " · " + prof.team : ""}</div>}

                      <span style={{ color: LOW }}>{l}: </span><span style={{ fontWeight: 600, fontFamily: "monospace" }}>{val}</span>
                    </div>
                  ))}
                </div>
                {prof.goal && <div style={{ background: "rgba(255,122,0,.1)", border: "1px solid rgba(180,255,87,.22)", borderRadius: 8, padding: "7px 12px", fontSize: 13, marginBottom: 8, color: LIME }}>🎯 {prof.goal}</div>}

                {!prof.name && <Btn onClick={() => { setDraft(prof); setEditing(true); }} v="ghost" style={{ marginTop: 8 }}>+ Set up your profile</Btn>}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* snapshot */}
      <FL>Today at a glance</FL>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(110px,1fr))", gap: 10, marginBottom: 28 }}>
        <Stat label="Habits"   value={hDone + "/" + habits.length}      col={LIME}  sub={habits.length ? Math.round(hDone / habits.length * 100) + "%" : ""} />
        <Stat label="Tasks"    value={tDone + "/" + dayT.length}         col={VIO}   />
        <Stat label="Calories" value={cals ? fmt(cals) : "—"}           col={AMB}   sub="kcal" />
        <Stat label="Steps"    value={steps ? fmt(steps) : "—"}          col={CYN}   />
        <Stat label="Sleep"    value={todSleep ? todSleep.h + "h" : "—"} col={TEAL}  sub={todSleep ? "RPE " + (todSleep.rpe || "—") : "not logged"} />
        <Stat label="Journal"  value={jDone + "/7"}                      col={PINK}  sub="this week" />
      </div>

      {/* nav grid */}
      <FL>Sections</FL>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 12 }}>
        {NAVS.map(item => (
          <button key={item.id} onClick={() => go(item.id)} style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: "16px 18px", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", gap: 14, color: TEXT, transition: "border-color .2s", fontFamily: "inherit" }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = item.col + "55"; e.currentTarget.style.transform = "translateY(-1px)"; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = BOR; e.currentTarget.style.transform = "none"; }}>
            <div style={{ width: 42, height: 42, borderRadius: 10, background: item.col + "18", border: "1px solid " + item.col + "33", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>{item.icon}</div>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 2 }}>{item.label}</div>
              <div style={{ fontSize: 11, color: LOW }}>{item.info}</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// PLANNER
// ═════════════════════════════════════════════════════════════════════
function Planner() {
  const [mode, setMode]    = useState("week");
  const [evs, setEvs]      = useS("evs", {});
  const [focus, setFocus]  = useState(td());
  const [modal, setModal]  = useState(null);
  const [eTitle, setETitle] = useState("");
  const [eTime, setETime]   = useState("09:00");
  const [eDur, setEDur]     = useState("60");
  const [eCol, setECol]     = useState(LIME);
  const [eRep, setERep]     = useState("none");
  const [tasks] = useS("tasks", {});
  const [gym]   = useS("gym",   {});

  const COLS = [LIME, VIO, PINK, AMB, CYN, "#e879f9"];
  const SLOTS = ["6AM","7AM","8AM","9AM","10AM","11AM","12PM","1PM","2PM","3PM","4PM","5PM","6PM","7PM","8PM","9PM"];
  const slotH = s => s === "12PM" ? 12 : s.includes("PM") ? parseInt(s) + 12 : parseInt(s);

  const getDay = ds => {
    const direct = evs[ds] || [];
    const extra = [];
    // recurring
    Object.entries(evs).forEach(([k, arr]) => {
      (arr || []).forEach(ev => {
        if (!ev.rep || ev.rep === "none" || k === ds) return;
        const diff = Math.round((new Date(ds + "T12:00:00") - new Date(k + "T12:00:00")) / 86400000);
        if (diff <= 0) return;
        if (ev.rep === "daily" || (ev.rep === "weekly" && diff % 7 === 0)) extra.push({ ...ev, id: ev.id + "_" + ds, _r: true });
      });
    });
    // tasks
    (tasks[ds] || []).forEach(t => { if (t.time) extra.push({ id: "t_" + t.id, title: "📋 " + t.text, color: VIO, time: t.time, _t: true }); });
    // gym
    const g = gym[ds];
    if (g && (g.exercises || []).length) extra.push({ id: "g_" + ds, title: "🏋️ Gym — " + (g.exercises || []).slice(0, 2).map(e => e.name).join(", "), color: AMB, time: g.schedTime || "", _g: true });
    return [...direct, ...extra].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  };

  const addEv = () => {
    if (!eTitle.trim() || !modal) return;
    const ds = modal.ds;
    setEvs(p => ({ ...p, [ds]: [...(p[ds] || []), { id: Date.now(), title: eTitle, color: eCol, time: eTime, dur: eDur, rep: eRep }] }));
    setModal(null); setETitle(""); setETime("09:00"); setEDur("60"); setECol(LIME); setERep("none");
  };
  const delEv = (ds, id) => setEvs(p => ({ ...p, [ds]: (p[ds] || []).filter(e => e.id !== id) }));

  const Chip2 = ({ ev, ds }) => (
    <div style={{ background: ev.color + "22", borderLeft: "3px solid " + ev.color, borderRadius: 3, padding: "2px 6px", marginBottom: 2, fontSize: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
      <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ev.title}</span>
      {!ev._r && !ev._t && !ev._g && <span onClick={() => delEv(ds, ev.id)} style={{ cursor: "pointer", color: LOW, marginLeft: 4, flexShrink: 0 }}>×</span>}
    </div>
  );

  // ── Month ──
  const Month = () => {
    const focusDate = new Date(focus + "T12:00:00");
    const yr = focusDate.getFullYear(), mo = focusDate.getMonth();
    const fd = new Date(yr, mo, 1).getDay(), dim = new Date(yr, mo + 1, 0).getDate();
    const cells = []; for (let i = 0; i < fd; i++) cells.push(null); for (let d = 1; d <= dim; d++) cells.push(new Date(yr, mo, d));
    const goPrev = () => { const d = new Date(yr, mo - 1, 1); setFocus(fmtDate(d)); };
    const goNext = () => { const d = new Date(yr, mo + 1, 1); setFocus(fmtDate(d)); };
    return (
      <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10, flexShrink: 0 }}>
          <Btn onClick={goPrev} v="ghost" style={{ padding: "5px 12px" }}>← Prev</Btn>
          <span style={{ flex: 1, textAlign: "center", fontWeight: 700, fontSize: 16 }}>{MONTHS[mo]} {yr}</span>
          <Btn onClick={goNext} v="ghost" style={{ padding: "5px 12px" }}>Next →</Btn>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 1, flexShrink: 0 }}>
          {DAYS.map(d => <div key={d} style={{ textAlign: "center", fontSize: 10, color: LOW, padding: "3px 0", fontFamily: "monospace" }}>{d}</div>)}
        </div>
        <div style={{ flex: 1, display: "grid", gridTemplateColumns: "repeat(7,1fr)", gridAutoRows: "1fr", gap: 2, overflow: "hidden" }}>
          {cells.map((d, i) => {
            if (!d) return <div key={"e" + i} />;
            const ds = fmtDate(d), isT = ds === td(), dayEvs = getDay(ds);
            return (
              <div key={ds} onClick={() => { setFocus(ds); setMode("day"); }} style={{ background: isT ? "rgba(255,122,0,.1)" : CARD, border: "1px solid " + (isT ? LIME : BOR), borderRadius: 7, padding: "4px 4px", cursor: "pointer", overflow: "hidden" }}>
                <div style={{ fontSize: 12, fontWeight: isT ? 700 : 400, color: isT ? LIME : MID, fontFamily: "monospace", marginBottom: 2 }}>{d.getDate()}</div>
                {dayEvs.slice(0, 2).map(ev => <div key={ev.id} style={{ background: ev.color + "25", borderLeft: "2px solid " + ev.color, borderRadius: 2, padding: "1px 3px", fontSize: 8, marginBottom: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{ev.title}</div>)}
                {dayEvs.length > 2 && <div style={{ fontSize: 8, color: LOW }}>+{dayEvs.length - 2}</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── Day ──
  const Day = () => {
    const d = new Date(focus + "T12:00:00"), dayEvs = getDay(focus);
    const prev = () => { const p = new Date(d); p.setDate(d.getDate() - 1); setFocus(fmtDate(p)); };
    const next = () => { const p = new Date(d); p.setDate(d.getDate() + 1); setFocus(fmtDate(p)); };
    return (
      <div style={{ height: "100%", display: "flex", flexDirection: "column" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12, flexShrink: 0 }}>
          <Btn onClick={prev} v="ghost" style={{ padding: "5px 12px" }}>← Prev</Btn>
          <span style={{ flex: 1, textAlign: "center", fontWeight: 700, fontSize: 14 }}>{DAYS_FULL[d.getDay()]} · {d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</span>
          <Btn onClick={next} v="ghost" style={{ padding: "5px 12px" }}>Next →</Btn>
          <Btn onClick={() => setModal({ ds: focus })} style={{ padding: "6px 14px", fontSize: 12 }}>+ Add</Btn>
        </div>
        <div style={{ flex: 1, overflowY: "auto" }}>
          {SLOTS.map(slot => {
            const sEvs = dayEvs.filter(ev => ev.time && parseInt(ev.time.split(":")[0]) === slotH(slot));
            return (
              <div key={slot} onClick={() => setModal({ ds: focus, slot })} style={{ display: "flex", gap: 10, minHeight: 46, borderBottom: "1px solid " + BOR, cursor: "pointer" }}>
                <div style={{ width: 44, flexShrink: 0, fontSize: 9, color: LOW, fontFamily: "monospace", paddingTop: 4, textAlign: "right", paddingRight: 8 }}>{slot}</div>
                <div style={{ flex: 1, padding: "3px 0" }}>{sEvs.map(ev => <Chip2 key={ev.id} ev={ev} ds={focus} />)}</div>
              </div>
            );
          })}
          {dayEvs.filter(ev => !ev.time).length > 0 && (
            <div style={{ padding: "12px 14px" }}>
              <FL>All Day / Unscheduled</FL>
              {dayEvs.filter(ev => !ev.time).map(ev => <Chip2 key={ev.id} ev={ev} ds={focus} />)}
            </div>
          )}
        </div>
      </div>
    );
  };

  // ── Week ──
  const Week = () => {
    const b = new Date(focus + "T12:00:00"), day = b.getDay();
    const week = Array.from({ length: 7 }, (_, i) => { const n = new Date(b); n.setDate(b.getDate() - day + i); return n; });
    return (
      <div style={{ flex: 1, overflow: "auto" }}>
        <div style={{ display: "grid", gridTemplateColumns: "50px repeat(7,minmax(88px,1fr))", minWidth: 720 }}>
          <div />
          {week.map((d, i) => {
            const ds = fmtDate(d), isT = ds === td();
            return (
              <div key={i} onClick={() => { setFocus(ds); setMode("day"); }} style={{ textAlign: "center", padding: "7px 4px", borderBottom: "2px solid " + (isT ? LIME : BOR), background: isT ? "rgba(255,122,0,.06)" : "transparent", cursor: "pointer", borderRadius: "7px 7px 0 0" }}>
                <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace" }}>{DAYS[d.getDay()]}</div>
                <div style={{ fontWeight: 700, fontSize: 14, fontFamily: "monospace", color: isT ? LIME : TEXT }}>{d.getDate()}</div>
              </div>
            );
          })}
          {SLOTS.map(slot => (
            <React.Fragment key={slot}>
              <div key={"t" + slot} style={{ padding: "4px 6px", fontSize: 8, color: LOW, fontFamily: "monospace", borderRight: "1px solid " + BOR, display: "flex", alignItems: "center" }}>{slot}</div>
              {week.map((d, di) => {
                const ds = fmtDate(d);
                const sEvs = getDay(ds).filter(ev => ev.time && parseInt(ev.time.split(":")[0]) === slotH(slot));
                return (
                  <div key={di + slot} onClick={() => setModal({ ds, slot })} style={{ minHeight: 36, border: "1px solid " + BOR, padding: 2, cursor: "pointer" }}>
                    {sEvs.map(ev => <Chip2 key={ev.id} ev={ev} ds={ds} />)}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 24px 20px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14, flexShrink: 0, flexWrap: "wrap" }}>
        <h2 style={{ fontSize: 18, fontWeight: 700 }}>Planner</h2>
        <div style={{ display: "flex", gap: 6 }}>
          {[["day","Day"],["week","Week"],["month","Month"]].map(([v, l]) => <Chip key={v} on={mode === v} click={() => setMode(v)}>{l}</Chip>)}
        </div>
        {mode !== "month" && <Btn onClick={() => setModal({ ds: mode === "day" ? focus : td() })} style={{ padding: "6px 14px", fontSize: 12 }}>+ Add</Btn>}
      </div>

      {mode === "month" && <Month />}
      {mode === "day"   && <div style={{ flex: 1, overflow: "hidden" }}><Day /></div>}
      {mode === "week"  && <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}><Week /></div>}

      {modal && (
        <Modal onClose={() => setModal(null)}>
          <div style={{ fontFamily: "monospace", fontSize: 11, color: LOW, marginBottom: 12 }}>{modal.ds}{modal.slot ? " · " + modal.slot : ""}</div>
          <FL>Title</FL>
          <In value={eTitle} onChange={e => setETitle(e.target.value)} placeholder="Event name" style={{ marginBottom: 10 }} onKeyDown={e => e.key === "Enter" && addEv()} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
            <div><FL>Time</FL><In type="time" value={eTime} onChange={e => setETime(e.target.value)} /></div>
            <div><FL>Duration (min)</FL><In type="number" value={eDur} onChange={e => setEDur(e.target.value)} /></div>
          </div>
          <FL>Repeat</FL>
          <Sel value={eRep} onChange={e => setERep(e.target.value)} style={{ width: "100%", marginBottom: 12 }}>
            <option value="none">No repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
          </Sel>
          <FL>Color</FL>
          <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
            {COLS.map(c => <div key={c} onClick={() => setECol(c)} style={{ width: 24, height: 24, borderRadius: "50%", background: c, cursor: "pointer", outline: eCol === c ? "2px solid #fff" : "none", outlineOffset: 2 }} />)}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <Btn onClick={addEv}>Add</Btn>
            <Btn onClick={() => setModal(null)} v="sec">Cancel</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// HABITS
// ═════════════════════════════════════════════════════════════════════
function Habits() {
  const [habits, setHabits] = useS("habits", [
    { id: 1, name: "Morning Water",     icon: "💧", pri: "high" },
    { id: 2, name: "Meditate",          icon: "🧘", pri: "med"  },
    { id: 3, name: "Read 20min",        icon: "📚", pri: "med"  },
    { id: 4, name: "No Social Media AM",icon: "📵", pri: "low"  }
  ]);
  const [hc, setHc]       = useS("hc", {});
  const [newN, setNewN]   = useState("");
  const [newI, setNewI]   = useState("⭐");
  const [newP, setNewP]   = useState("med");
  const [adding, setAdding] = useState(false);
  const [viewDay, setViewDay] = useState(td());

  const EMOJIS = "⭐🏃💪🧠💧🥗😴📚🎯🙏🎨🎵💊🌅❄️".split("");
  const PC = { high: PINK, med: AMB, low: LIME };
  const PL = { high: "🔴 High", med: "🟡 Medium", low: "🟢 Low" };

  const dayComp = hc[viewDay] || {};
  const done    = habits.filter(h => dayComp[h.id]).length;
  const tog     = id => setHc(p => ({ ...p, [viewDay]: { ...(p[viewDay] || {}), [id]: !(p[viewDay] || {})[id] } }));
  const addH    = () => { if (!newN.trim()) return; setHabits(p => [...p, { id: Date.now(), name: newN, icon: newI, pri: newP }]); setNewN(""); setAdding(false); };

  // Navigate days
  const prevDay = () => { const d = new Date(viewDay + "T12:00:00"); d.setDate(d.getDate()-1); setViewDay(fmtDate(d)); };
  const nextDay = () => { const d = new Date(viewDay + "T12:00:00"); d.setDate(d.getDate()+1); setViewDay(fmtDate(d)); };
  const isToday = viewDay === td();
  const dayLabel = isToday ? "Today" : viewDay === fmtDate((() => { const d = new Date(); d.setDate(d.getDate()-1); return d; })()) ? "Yesterday" : new Date(viewDay + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  // Sort habits by priority then name
  const sorted = [...habits].sort((a, b) => {
    const PO = { high: 0, med: 1, low: 2 };
    return (PO[a.pri || "med"] - PO[b.pri || "med"]) || a.name.localeCompare(b.name);
  });

  // 7-day chart data
  const last7 = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6-i));
    const k = fmtDate(d), dc = hc[k] || {};
    return { l: DAYS[d.getDay()], p: habits.length ? Math.round(habits.filter(h => dc[h.id]).length / habits.length * 100) : 0, k };
  });

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 16px 16px" }}>

      {/* Day navigator */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexShrink: 0 }}>
        <button onClick={prevDay} style={{ background: SURF, border: "1px solid " + BOR, borderRadius: 8, padding: "8px 14px", color: MID, cursor: "pointer", fontSize: 16, fontFamily: "inherit" }}>‹</button>
        <div style={{ flex: 1, textAlign: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 17 }}>{dayLabel}</div>
          <div style={{ fontSize: 11, color: LOW, fontFamily: "monospace" }}>{viewDay}</div>
        </div>
        <button onClick={nextDay} style={{ background: SURF, border: "1px solid " + BOR, borderRadius: 8, padding: "8px 14px", color: MID, cursor: "pointer", fontSize: 16, fontFamily: "inherit" }}>›</button>
        <div style={{ background: "rgba(255,122,0,.12)", border: "1px solid rgba(255,122,0,.3)", borderRadius: 8, padding: "6px 14px", fontFamily: "monospace", fontWeight: 700, fontSize: 16, color: LIME }}>{done}/{habits.length}</div>
      </div>

      {/* Progress bar */}
      <PBar pct={habits.length ? done/habits.length*100 : 0} col={LIME} h={5} />
      <div style={{ height: 14 }} />

      {/* Habit list sorted by priority */}
      <div style={{ flex: 1, overflowY: "auto" }}>
        {["high","med","low"].map(pri => {
          const group = sorted.filter(h => (h.pri || "med") === pri);
          if (!group.length) return null;
          return (
            <div key={pri} style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: PC[pri] }} />
                <span style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", color: LOW, fontFamily: "monospace" }}>{PL[pri]}</span>
              </div>
              {group.map(h => {
                const isDone = !!dayComp[h.id];
                return (
                  <div key={h.id} onClick={() => tog(h.id)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "13px 14px", background: isDone ? "rgba(255,122,0,.08)" : CARD, border: "1px solid " + (isDone ? "rgba(255,122,0,.3)" : BOR), borderRadius: 10, marginBottom: 8, cursor: "pointer", transition: "all .15s" }}>
                    <span style={{ fontSize: 22, flexShrink: 0 }}>{h.icon}</span>
                    <span style={{ flex: 1, fontWeight: 500, fontSize: 15, textDecoration: isDone ? "line-through" : "none", color: isDone ? LOW : TEXT }}>{h.name}</span>
                    <Box done={isDone} col={PC[h.pri || "med"]} click={e => { e.stopPropagation(); tog(h.id); }} />
                    <button onClick={e => { e.stopPropagation(); setHabits(p => p.filter(x => x.id !== h.id)); }} style={{ background: "none", border: "none", color: LOW, fontSize: 18, cursor: "pointer", padding: "0 4px" }}>×</button>
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* 7-day mini chart */}
        <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: "14px 16px", marginBottom: 14 }}>
          <FL>7-Day Completion</FL>
          <div style={{ display: "flex", gap: 6, alignItems: "flex-end", height: 56 }}>
            {last7.map((x, i) => (
              <div key={i} onClick={() => setViewDay(x.k)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, height: "100%", justifyContent: "flex-end", cursor: "pointer" }}>
                <div style={{ width: "100%", height: (x.p || 2) + "%", minHeight: 3, background: x.k === viewDay ? LIME : LIME + "66", borderRadius: 3 }} />
                <div style={{ fontSize: 9, color: x.k === viewDay ? LIME : LOW, fontFamily: "monospace", fontWeight: x.k === viewDay ? 700 : 400 }}>{x.l}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Add habit */}
        {adding ? (
          <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: 16 }}>
            <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginBottom: 12 }}>
              {EMOJIS.map(e => <span key={e} onClick={() => setNewI(e)} style={{ fontSize: 20, cursor: "pointer", padding: "4px 5px", borderRadius: 6, background: newI === e ? "rgba(255,122,0,.25)" : "transparent" }}>{e}</span>)}
            </div>
            <In value={newN} onChange={e => setNewN(e.target.value)} placeholder="Habit name" style={{ marginBottom: 10 }} onKeyDown={e => e.key === "Enter" && addH()} />
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              {["high","med","low"].map(p => (
                <button key={p} onClick={() => setNewP(p)} style={{ flex: 1, padding: "8px 0", borderRadius: 7, border: "1px solid " + (newP === p ? PC[p] : BOR), background: newP === p ? PC[p] + "22" : SURF, color: newP === p ? PC[p] : MID, fontWeight: newP === p ? 700 : 400, cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>{PL[p]}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <Btn onClick={addH} style={{ flex: 1 }}>Add Habit</Btn>
              <Btn onClick={() => setAdding(false)} v="sec">Cancel</Btn>
            </div>
          </div>
        ) : (
          <button onClick={() => setAdding(true)} style={{ width: "100%", border: "1px dashed " + BOR, background: "none", color: LOW, borderRadius: 10, padding: 12, cursor: "pointer", fontSize: 14, fontFamily: "inherit" }}>+ Add Habit</button>
        )}
      </div>
    </div>
  );
}

// TASKS
// ═════════════════════════════════════════════════════════════════════
function Tasks() {
  const [tasks, setTasks]     = useS("tasks", {});
  const [evs, setEvs]         = useS("evs", {});
  const [skipped, setSkipped] = useS("tasks_skipped", {}); // { "taskId_dateStr": true }
  const [text, setText]       = useState("");
  const [cat, setCat]         = useState("General");
  const [date, setDate]       = useState(td());
  const [time, setTime]       = useState("");
  const [rep, setRep]         = useState("none");

  const buildAllTasks = () => {
    const overdue = [], upcoming = [];
    const seen = new Set();
    const todayDs = td();
    Object.entries(tasks).forEach(function(entry) {
      var d = entry[0], arr = entry[1];
      (arr || []).forEach(function(t) {
        if (t.done || t._skipRecur) return;
        if (t.rep === "weekly") {
          var origin = new Date(d + "T12:00:00");
          for (var w = 0; w <= 8; w++) {
            var occ = new Date(origin); occ.setDate(origin.getDate() + w * 7);
            var occDs = fmtDate(occ);
            // only show up to 4 weeks ahead
            if (occDs > fmtDate(new Date(new Date().setDate(new Date().getDate() + 28)))) continue;
            var key = t.id + "_" + occDs;
            if (seen.has(key)) continue;
            // skip individually-dismissed occurrences
            if (skipped[key]) continue;
            seen.add(key);
            var item = Object.assign({}, t, { _date: occDs, _occKey: key, _isRecur: true });
            if (occDs < todayDs) overdue.push(item);
            else upcoming.push(item);
          }
        } else if (t.rep === "daily") {
          var origin2 = new Date(d + "T12:00:00");
          for (var dd = 0; dd <= 14; dd++) {
            var occ2 = new Date(origin2); occ2.setDate(origin2.getDate() + dd);
            var occDs2 = fmtDate(occ2);
            if (occDs2 > fmtDate(new Date(new Date().setDate(new Date().getDate() + 7)))) continue;
            var key2 = t.id + "_" + occDs2;
            if (seen.has(key2)) continue;
            if (skipped[key2]) continue;
            seen.add(key2);
            var item2 = Object.assign({}, t, { _date: occDs2, _occKey: key2, _isRecur: true });
            if (occDs2 < todayDs) overdue.push(item2);
            else upcoming.push(item2);
          }
        } else {
          var key3 = t.id + "_" + d;
          if (!seen.has(key3) && !skipped[key3]) {
            seen.add(key3);
            var item3 = Object.assign({}, t, { _date: d, _occKey: key3, _isRecur: false });
            if (d < todayDs) overdue.push(item3);
            else upcoming.push(item3);
          }
        }
      });
    });
    overdue.sort(function(a, b) { return a._date.localeCompare(b._date); });
    upcoming.sort(function(a, b) { return a._date.localeCompare(b._date); });
    return { overdue, upcoming };
  };

  const { overdue, upcoming } = buildAllTasks();

  const byDate = {};
  upcoming.forEach(function(t) { if (!byDate[t._date]) byDate[t._date] = []; byDate[t._date].push(t); });
  const sortedDates = Object.keys(byDate).sort();

  const dayHeading = function(ds) {

    var tomorrowDs = fmtDate(tomorrowD);
    if (ds === todayDs) return "Today — " + DAYS_FULL[d.getDay()];
    if (ds === tomorrowDs) return "Tomorrow — " + DAYS_FULL[d.getDay()];

  };

    if (time) {
      const planEv = { id: id + 1, title: "📋 " + text, color: VIO, time, dur: "30", rep: "none", _taskId: id };
      setEvs(p => ({ ...p, [date]: [...(p[date] || []), planEv] }));
      if (rep === "weekly") {

        }

        for (var dd = 1; dd <= 7; dd++) {

      <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 10, padding: 12, marginBottom: 14, flexShrink: 0 }}>
        <In value={text} onChange={e => setText(e.target.value)} placeholder="What needs doing?" style={{ marginBottom: 8 }} onKeyDown={e => e.key === "Enter" && add()} />

          </Sel>

        <div style={{ display: "flex", gap: 6, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 120 }}>
            <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace", marginBottom: 3 }}>DATE</div>
            <In type="date" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div style={{ flex: 1, minWidth: 100 }}>
            <div style={{ fontSize: 9, color: LOW, fontFamily: "monospace", marginBottom: 3 }}>TIME (adds to Planner)</div>
            <In type="time" value={time} onChange={e => setTime(e.target.value)} />

        </div>
        {time && <div style={{ fontSize: 11, color: VIO, marginTop: 6 }}>📅 Planner {rep !== "none" ? "(" + rep + ")" : date}{time ? " at " + time : ""}</div>}
      </div>

      <div style={{ flex: 1, overflowY: "auto" }}>
        {/* ── Overdue section ── */}
        {overdue.length > 0 && (

        <FL>7-Day History</FL>
        <div style={{ display: "flex", gap: 6, alignItems: "flex-end", height: 60, marginBottom: 6 }}>
          {history.map(function(h, i) {
            var barPct = h.cals ? Math.min(100, Math.round(h.cals / h.goal * 100)) : 0;

function Recovery() {

    if (!text) { setSum("No entries this week."); setLoading(false); return; }
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: "Weekly journal:\n\n" + text + "\n\nWrite a warm, insightful weekly summary (3–4 paragraphs): key themes, wins and challenges, emotional journey, and 2–3 actionable intentions for next week." }] }) });
      const d = await r.json(); setSum((d.content && d.content[0] && d.content[0].text) || "Error.");
    } catch (_) { setSum("Error. Please try again."); }
    setLoading(false);
  };

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", padding: "16px 24px 24px" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexShrink: 0, alignItems: "center", flexWrap: "wrap" }}>
        <h2 style={{ fontSize: 18, fontWeight: 700, marginRight: 6 }}>Reflections</h2>
        {[["write","✍ Write"],["history","📜 History"],["summary","✦ AI"]].map(([v, l]) => <Chip key={v} on={view === v} col={VIO} click={() => setView(v)}>{l}</Chip>)}
      </div>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {view === "write" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
              <In type="date" value={date} onChange={ev => setDate(ev.target.value)} style={{ width: 150 }} />
              <div style={{ display: "flex", gap: 5, alignItems: "center" }}>
                <span style={{ color: LOW, fontSize: 10, fontFamily: "monospace" }}>MOOD</span>
                {MOODS.map((m, i) => <span key={i} onClick={() => upd({ ...e, mood: i + 1 })} style={{ fontSize: 22, cursor: "pointer", opacity: e.mood === i + 1 ? 1 : 0.25 }}>{m}</span>)}
              </div>
            </div>
            {e.mood > 0 && <div style={{ background: MC[e.mood-1] + "18", border: "1px solid " + MC[e.mood-1] + "44", borderRadius: 8, padding: "6px 12px", marginBottom: 14, fontSize: 12, color: MC[e.mood-1] }}>{MOODS[e.mood-1]} {["Rough day","Off day","Neutral","Good day","Great day!"][e.mood-1]}</div>}
            {[["hi","✨ Highlights","What went well today?"],["ch","⚡ Challenges","What was difficult?"],["gr","🙏 Gratitude","What are you grateful for?"],["tm","🎯 Tomorrow","Focus for tomorrow?"]].map(([k, l, p]) => (
              <div key={k} style={{ marginBottom: 14 }}>
                <div style={{ fontWeight: 600, marginBottom: 5, fontSize: 13 }}>{l}</div>
                <Ta value={e[k] || ""} onChange={ev => upd({ ...e, [k]: ev.target.value })} placeholder={p} rows={3} />
              </div>
            ))}
          </div>
        )}
        {view === "history" && wDates.map(dd => {
          const en = jnl[dd];
          return (
            <div key={dd} onClick={() => { setDate(dd); setView("write"); }} style={{ padding: "12px 14px", background: CARD, border: "1px solid " + BOR, borderRadius: 10, marginBottom: 8, cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div><span style={{ fontWeight: 600, fontSize: 13 }}>{dd}</span><span style={{ color: LOW, fontSize: 11, marginLeft: 8 }}>— {DAYS_FULL[new Date(dd + "T12:00:00").getDay()]}</span></div>
                <span style={{ fontSize: 20 }}>{en ? MOODS[(en.mood || 3) - 1] : "—"}</span>
              </div>
              {en && en.hi && <p style={{ color: MID, fontSize: 12, marginTop: 4 }}>✨ {en.hi.slice(0, 80)}{en.hi.length > 80 ? "…" : ""}</p>}
              {!en && <p style={{ color: LOW, fontSize: 12, marginTop: 4 }}>No entry</p>}
            </div>
          );
        })}
        {view === "summary" && (
          <div>
            <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: 18, marginBottom: 16 }}>
              <p style={{ color: MID, fontSize: 13, marginBottom: 14 }}>{wDates.filter(d => jnl[d]).length} entries this week</p>
              <Btn onClick={gen} disabled={loading} v="vio">{loading ? "✦ Generating…" : "✦ Generate Weekly Summary"}</Btn>
            </div>
            {sum && <div style={{ background: "rgba(255,122,0,.06)", border: "1px solid rgba(139,127,255,.22)", borderRadius: 12, padding: 20 }}><FL>Weekly Summary</FL><p style={{ lineHeight: 1.8, whiteSpace: "pre-wrap", fontSize: 14 }}>{sum}</p></div>}
          </div>
        )}
      </div>
    </div>
  );
}

// MOBILITY
// ═════════════════════════════════════════════════════════════════════
function Mobility() {
  const EXERCISES = [
    { name: "90/90 Hip Stretch",         phase: "Hips",      duration: 90,  sets: "45s each side",  target: "Hip Flexors & Rotators",        cue: "Sit with front shin parallel to you, back shin pointing behind. Sit tall, lean slightly forward over front leg. Directly counters hip tightness from cutting and jumping.", why: "🏀 Key for ballers" },
    { name: "Kneeling Hip Flexor",        phase: "Hips",      duration: 90,  sets: "45s each side",  target: "Hip Flexors / Psoas",            cue: "Drop to a lunge, back knee down. Drive hips forward gently until you feel a pull in the front of your back hip. Squeeze your glute on the back leg. Tight hip flexors are the #1 issue for basketball players.", why: "🔥 Top priority" },
    { name: "World's Greatest Stretch",   phase: "Hips",      duration: 120, sets: "60s each side",  target: "Thoracic Spine, Hips, Groin",   cue: "Step into a deep lunge. Plant both hands inside your front foot. Drop your back knee, then rotate your inside arm up to the ceiling. Follow your hand with your eyes.", why: "⚡ Most bang for buck" },
    { name: "Pigeon Pose",                phase: "Glutes",    duration: 120, sets: "60s each side",  target: "Glutes / Piriformis",            cue: "From plank, bring one shin forward horizontally in front of you. Sink hips toward the floor. Walk hands forward and rest. Releases deep glute muscles hammered by lateral cuts and defensive slides.", why: "🏀 Key for ballers" },
    { name: "Thoracic Spine Rotation",    phase: "Back",      duration: 90,  sets: "45s each side",  target: "Mid & Upper Back",              cue: "Lie on your side, knees bent at 90°. Keep bottom arm extended, top hand behind your head. Rotate your top elbow toward the floor behind you. Follow with your eyes.", why: "👤 Posture recovery" },
    { name: "Child's Pose + Lat Reach",   phase: "Back",      duration: 60,  sets: "Hold",           target: "Lower Back, Lats, Hips",        cue: "Kneel and sit back toward your heels, arms extended forward. Walk hands to one side to stretch the opposite lat. Hold 30s each side. Decompresses the spine after basketball impact.", why: "😌 Pure relief" },
    { name: "Seated Hamstring Stretch",   phase: "Legs",      duration: 90,  sets: "45s each side",  target: "Hamstrings",                    cue: "Sit with one leg out, one foot tucked in. Hinge at the hips and reach toward your foot — keep chest tall, don't round your back. Hamstrings absorb massive force in basketball.", why: "🚨 Injury prevention" },
    { name: "Standing Calf / Achilles",   phase: "Legs",      duration: 60,  sets: "30s each side",  target: "Calves, Achilles, Ankles",      cue: "Stand with toes on a slight elevation, heel hanging. Let the heel drop slowly. Also do a bent-knee version to hit the soleus. Protecting the Achilles tendon is crucial — it's the most common serious injury in recreational basketball.", why: "🚨 Injury prevention" },
    { name: "Diaphragmatic Breathing",    phase: "Wind Down", duration: 120, sets: "10 slow breaths", target: "Nervous System",               cue: "Lie on your back, one hand on chest, one on belly. Breathe IN through the nose for 4 counts — belly rises, chest stays still. OUT for 6 counts through the mouth. Activates the parasympathetic nervous system, lowering cortisol for better recovery.", why: "😴 Sleep quality boost" },
  ];
  const PHASES = ["Hips", "Glutes", "Back", "Legs", "Wind Down"];
  const PHASE_COL = { Hips: LIME, Glutes: CYN, Back: VIO, Legs: AMB, "Wind Down": TEAL };
  const TOTAL_TIME = EXERCISES.reduce((s, e) => s + e.duration, 0);

  const [idx, setIdx]         = useState(0);
  const [timeLeft, setTimeLeft] = useState(EXERCISES[0].duration);
  const [running, setRunning]   = useState(false);
  const [done, setDone]         = useState(new Set());
  const [complete, setComplete] = useState(false);
  const intervalRef = useRef(null);

  const ex = EXERCISES[idx];
  const circ = 2 * Math.PI * 54;
  const pct  = (ex.duration - timeLeft) / ex.duration;
  const offset = circ - pct * circ;
  const ringCol = pct > 0.75 ? TEAL : LIME;

  const fmtTime = s => { const m = Math.floor(s/60); const sc = s%60; return m + ":" + String(sc).padStart(2,"0"); };
  const totalDone = Array.from(done).length;
  const progressPct = EXERCISES.slice(0, idx).reduce((s, e) => s + e.duration, 0) / TOTAL_TIME * 100;

  const stopTimer = useCallback(() => {
    clearInterval(intervalRef.current);
    intervalRef.current = null;
    setRunning(false);
  }, []);

  const jumpTo = useCallback((i) => {
    stopTimer();
    setIdx(i);
    setTimeLeft(EXERCISES[i].duration);
    setRunning(false);
  }, [stopTimer]);

  const advanceExercise = useCallback((nextIdx) => {
    if (nextIdx < EXERCISES.length) {
      setIdx(nextIdx);
      setTimeLeft(EXERCISES[nextIdx].duration);
    } else {
      setComplete(true);
      setRunning(false);
    }
  }, []);

  useEffect(() => {
    if (!running) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(intervalRef.current);
          intervalRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            setRunning(r => {
              if (r) return r; // already stopped
              return r;
            });
            advanceExercise(idx + 1);
            setRunning(true);
          }, 800);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [running, idx, advanceExercise]);

  const toggle = () => setRunning(r => !r);
  const reset = () => { stopTimer(); setIdx(0); setTimeLeft(EXERCISES[0].duration); setDone(new Set()); setComplete(false); };

  if (complete) return (
    <div style={{ height: "100%", overflowY: "auto", padding: "32px 24px", textAlign: "center" }}>
      <div style={{ fontSize: 56, marginBottom: 16 }}>🔥</div>
      <h2 style={{ fontSize: 28, fontWeight: 700, color: TEAL, marginBottom: 8 }}>Session Complete</h2>
      <p style={{ color: MID, fontSize: 14, lineHeight: 1.7, marginBottom: 28, maxWidth: 320, margin: "0 auto 28px" }}>15 minutes done. Your joints and muscles will thank you tomorrow — especially those knees and hips.</p>
      <div style={{ display: "flex", gap: 12, justifyContent: "center", marginBottom: 32 }}>
        {[["9", "Exercises"], ["15", "Minutes"], ["✓", "Recovered"]].map(([val, lbl]) => (
          <div key={lbl} style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 12, padding: "14px 20px", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 700, color: LIME, fontFamily: "monospace" }}>{val}</div>
            <div style={{ fontSize: 10, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 3 }}>{lbl}</div>
          </div>
        ))}
      </div>
      <Btn onClick={reset} style={{ width: "100%", padding: 14, fontSize: 15 }}>↺ Do It Again</Btn>
    </div>
  );

  return (
    <div style={{ height: "100%", overflowY: "auto", padding: "16px 16px 32px" }}>
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <h2 style={{ fontSize: 18, fontWeight: 700, flex: 1 }}>🧘 Mobility</h2>
        <div style={{ fontSize: 11, color: MID, fontFamily: "monospace" }}>{fmtTime(TOTAL_TIME - EXERCISES.slice(0,idx).reduce((s,e)=>s+e.duration,0))} left</div>
      </div>

      {/* Overall progress bar */}
      <PBar pct={progressPct} col={LIME} h={4} />
      <div style={{ height: 14 }} />

      {/* Phase tabs */}
      <div style={{ display: "flex", gap: 5, marginBottom: 14, flexWrap: "wrap" }}>
        {PHASES.map(p => {
          const phExs = EXERCISES.filter(e => e.phase === p);
          const allDone = phExs.every(e => done.has(EXERCISES.indexOf(e)));
          const isCur = ex.phase === p;
          const col = allDone ? TEAL : isCur ? (PHASE_COL[p] || LIME) : null;
          return (
            <div key={p} style={{ padding: "4px 10px", borderRadius: 7, fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", border: "1px solid " + (col ? col + "66" : BOR), background: col ? col + "18" : SURF, color: col || LOW, cursor: "default" }}>
              {allDone ? "✓ " : ""}{p}
            </div>
          );
        })}
      </div>

      {/* Timer ring */}
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
        <div style={{ position: "relative", width: 128, height: 128 }}>
          <svg width="128" height="128" viewBox="0 0 128 128" style={{ position: "absolute", inset: 0, transform: "rotate(-90deg)" }}>
            <circle cx="64" cy="64" r="54" fill="none" stroke={BOR} strokeWidth="7" />
            <circle cx="64" cy="64" r="54" fill="none" stroke={ringCol} strokeWidth="7" strokeLinecap="round"
              strokeDasharray={circ} strokeDashoffset={offset}
              style={{ transition: "stroke-dashoffset 1s linear, stroke 0.3s", filter: "drop-shadow(0 0 5px " + ringCol + "99)" }} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <div style={{ fontSize: 34, fontWeight: 800, fontFamily: "monospace", lineHeight: 1 }}>{fmtTime(timeLeft)}</div>
            <div style={{ fontSize: 9, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", marginTop: 3 }}>{running ? "running" : timeLeft === ex.duration ? "ready" : "paused"}</div>
          </div>
        </div>
      </div>

      {/* Current exercise card */}
      <div style={{ background: CARD, border: "1px solid " + BOR, borderRadius: 14, padding: "16px 18px", marginBottom: 12, position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: 3, background: PHASE_COL[ex.phase] || LIME, borderRadius: "3px 0 0 3px" }} />
        <div style={{ fontSize: 10, color: PHASE_COL[ex.phase] || LIME, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 4 }}>
          Exercise {idx+1} of {EXERCISES.length}
        </div>
        <div style={{ fontSize: 20, fontWeight: 800, marginBottom: 8 }}>{ex.name}</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
          <span style={{ background: (PHASE_COL[ex.phase]||LIME)+"22", border: "1px solid "+(PHASE_COL[ex.phase]||LIME)+"44", borderRadius: 6, padding: "3px 10px", fontSize: 11, color: PHASE_COL[ex.phase]||LIME, fontWeight: 600 }}>{ex.sets}</span>
          <span style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 6, padding: "3px 10px", fontSize: 11, color: MID }}>{ex.target}</span>
          <span style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 6, padding: "3px 10px", fontSize: 11, color: MID }}>{ex.why}</span>
        </div>
        <p style={{ fontSize: 13, color: MID, lineHeight: 1.65 }}>{ex.cue}</p>
      </div>

      {/* Next up */}
      {idx < EXERCISES.length - 1 && (
        <div style={{ background: SURF, border: "1px solid "+BOR, borderRadius: 10, padding: "10px 14px", marginBottom: 14, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ fontSize: 10, color: LOW, textTransform: "uppercase", letterSpacing: "0.1em", flexShrink: 0 }}>Next</div>
          <div style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{EXERCISES[idx+1].name}</div>
          <div style={{ fontSize: 12, color: LOW, fontFamily: "monospace", flexShrink: 0 }}>{fmtTime(EXERCISES[idx+1].duration)}</div>
        </div>
      )}

      {/* Controls */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <Btn onClick={() => jumpTo(Math.max(0, idx-1))} v="sec" style={{ padding: "10px 16px" }} disabled={idx === 0}>‹ Back</Btn>
        <Btn onClick={toggle} style={{ flex: 1, padding: 12, fontSize: 15 }}>{running ? "⏸ Pause" : timeLeft === ex.duration ? "▶ Start" : "▶ Resume"}</Btn>
        <Btn onClick={() => { setDone(d=>{const nd=new Set(d);nd.add(idx);return nd;}); jumpTo(Math.min(EXERCISES.length-1, idx+1)); if(idx===EXERCISES.length-1){setComplete(true);} }} v="sec" style={{ padding: "10px 16px" }} disabled={idx === EXERCISES.length-1}>Skip ›</Btn>
      </div>

      {/* Exercise list */}
      <FL>Full Routine</FL>
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {EXERCISES.map((e, i) => {
          const isDone = done.has(i);
          const isCur  = i === idx;
          return (
            <div key={i} onClick={() => jumpTo(i)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: isCur ? (LIME+"12") : CARD, border: "1px solid "+(isCur ? LIME+"55" : BOR), borderRadius: 10, cursor: "pointer", opacity: isDone ? 0.45 : 1, transition: "all .15s" }}>
              <div style={{ width: 22, textAlign: "center", fontSize: 13, fontFamily: "monospace", fontWeight: 700, color: isCur ? LIME : LOW, flexShrink: 0 }}>{isDone ? "✓" : i+1}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: isCur ? TEXT : MID }}>{e.name}</div>
                <div style={{ fontSize: 11, color: LOW }}>{e.phase} · {e.target}</div>
              </div>
              <div style={{ fontSize: 12, color: LOW, fontFamily: "monospace", flexShrink: 0 }}>{fmtTime(e.duration)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// FORM SHOOTING
// ═════════════════════════════════════════════════════════════════════
function FormShooting() {
  const BEEF = [
    { letter: "B", word: "Balance", tagline: "Your foundation for every shot", detail: "Feet shoulder-width apart, shooting foot slightly forward (right foot ~2–3 inches ahead for right-handers). Knees bent. Weight centered — not tipping forward or back. Toes point slightly inward toward where a basket would be.", tip: "Stand in your stance, close your eyes, shoot the ball straight up. Land in the exact same spot. If you drift, your balance is off — fix your base before anything else." },
    { letter: "E", word: "Eyes", tagline: "Pick your target and lock in", detail: "Without a net, pick a mark on your wall at ~9–10 feet high, or aim at a ceiling point. Eyes lock before the ball goes up — NOT on the ball in flight. Most coaches say focus on the back of the rim; without a rim, find the equivalent target and never break your gaze.", tip: "Put a small piece of tape on the wall at 9–10 feet height. Shoot at that exact spot every rep. Your eyes should be on the tape mark before you start your motion, not after." },
    { letter: "E", word: "Elbow", tagline: "The L-shape that controls everything", detail: "Shooting elbow forms a 90-degree 'L' under the ball. Elbow points at the target — not flared out to the side (the 'chicken wing'). Thumb of shooting hand at 45°, which naturally pulls the elbow under.", tip: "Hold the ball in your shooting hand only, guide hand behind your back. Your elbow should naturally sit under the ball. If it flares, rotate your thumb up until the elbow drops in." },
    { letter: "F", word: "Follow-Through", tagline: "Freeze it every time", detail: "After release: arm fully extended, wrist snapped forward so fingers point toward the floor (the 'gooseneck'). Ball rolls off the index and middle fingers last, creating backspin. HOLD the follow-through until the ball hits something.", tip: "Freeze drill: After every shot, freeze your follow-through and check it. Arm extended? Fingers pointed down? Guide hand off the ball? Wrist relaxed? This habit catches 80% of form errors automatically." },
  ];
  const DRILLS = [
    { name: "Ceiling Aim Form Shooting", phase: "Mechanics", duration: 90, focus: "Elbow + Follow-Through", cue: "Stand in one spot, aim at a point on your ceiling directly above. Shoot straight up using perfect BEEF form. Catch on the way down — you should catch it right back in your shooting pocket if your form is straight. 100% focus on elbow alignment and the gooseneck follow-through." },
    { name: "Wall Mark Shooting", phase: "Mechanics", duration: 90, focus: "Eyes + Arc", cue: "Stand 8–10 feet from a wall. Put tape at 9–10 feet high. Shoot at that mark with a high arc — the ball should hit the wall above your mark. If it hits low and flat, your arc is too flat. Eyes on the mark BEFORE you start your motion." },
    { name: "One-Hand Form Drill", phase: "Mechanics", duration: 90, focus: "Guide Hand Off", cue: "Guide hand behind your back. Shoot with only your dominant hand. Toss the ball at your ceiling target. If the ball spins sideways, your release is off. The ball must spin with clean backspin only. Go slow and feel every finger." },
    { name: "Spin-Return Catch & Shoot", phase: "Game Motion", duration: 90, focus: "Footwork + Rhythm", cue: "Spin the ball on the floor, step into it as it bounces back, catch in your shooting pocket and go directly into your shot. This simulates a catch-and-shoot. Feet should be ready before the ball arrives." },
    { name: "Line Shooting", phase: "Alignment", duration: 90, focus: "Straight Release", cue: "Line your shooting foot up with a floor line. Shoot the ball forward at low height so it lands ON the line. If it lands left or right, your release is off-center. This gives instant straight-line feedback with zero equipment." },
    { name: "Jump Shot Rhythm", phase: "Game Speed", duration: 90, focus: "Timing + Legs", cue: "Full jump shot motion — dip the ball as you gather, jump, release at the top, land in the same spot. Most adult recreational players shoot on the way DOWN — this drill fixes that. The ball should leave your hand at your body's highest point." },
  ];
  const MISTAKES = [
    { icon: "🐔", bad: "Chicken Wing Elbow", fix: "Elbow flares out to the side causing the ball to hook left or right. Fix: Rotate your thumb upward to 45° — this naturally pulls the elbow under. Film yourself from behind to check." },
    { icon: "✋", bad: "Guide Hand Interference", fix: "The off-hand pushes the ball at release, causing random left/right misses. Fix: Practice the one-hand-only drill daily. Your guide hand drops OFF the ball before release — it's a stabilizer, not a launcher." },
    { icon: "📉", bad: "Flat Arc (Line Drive)", fix: "Ball travels too flat — needs higher arc for a larger entry window into the basket. Optimal arc is 45–55°. Fix: Aim at a spot significantly above your target on the wall." },
    { icon: "👣", bad: "Jumping Sideways or Backward", fix: "Drifting on the jump shot kills consistency. Fix: Shoot at the ceiling and watch where you land. You should land within 2 inches of takeoff. Drift = wasted energy." },
    { icon: "⏱️", bad: "Shooting on the Way Down", fix: "Releasing after peak height reduces power and arc. Fix: Consciously try to release 'too early' — this will put you right at peak. Release should feel like it happens at the top of the jump." },
  ];
  const TOTAL = DRILLS.reduce((s, d) => s + d.duration, 0);
  const [inner, setInner] = useState("mechanics");
  const [open, setOpen] = useState(null);
  const [idx, setIdx] = useState(0);
  const [timeLeft, setTimeLeft] = useState(DRILLS[0].duration);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(new Set());
  const [complete, setComplete] = useState(false);
  const iRef = useRef(null);

  const fmtT = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  const stopT = () => { clearInterval(iRef.current); iRef.current = null; setRunning(false); };
  const jumpTo = i => { stopT(); setIdx(i); setTimeLeft(DRILLS[i].duration); };
  const resetDrills = () => { stopT(); setIdx(0); setTimeLeft(DRILLS[0].duration); setDone(new Set()); setComplete(false); };

  useEffect(() => {
    if (!running) return;
    iRef.current = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iRef.current); iRef.current = null;
          setDone(d => { const nd = new Set(d); nd.add(idx); return nd; });
          setTimeout(() => {
            if (idx + 1 < DRILLS.length) { setIdx(idx + 1); setTimeLeft(DRILLS[idx+1].duration); setRunning(true); }
            else { setComplete(true); setRunning(false); }
          }, 800);
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(iRef.current);
  }, [running, idx]);

  const dr = DRILLS[idx];
  const drPct = dr ? (dr.duration - timeLeft) / dr.duration * 100 : 0;
  const ovrPct = DRILLS.slice(0,idx).reduce((s,d)=>s+d.duration,0) / TOTAL * 100;

  return (
    <div style={{ height:"100%", overflowY:"auto", padding:"16px 16px 32px" }}>

      <div style={{ display:"flex", gap:4, background:SURF, border:"1px solid "+BOR, borderRadius:10, padding:4, marginBottom:16 }}>
